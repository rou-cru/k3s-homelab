[mcp_servers.serena]
command = "uvx"
args = ["--from", "git+https://github.com/oraios/serena", "serena-mcp-server", "--context", "ide-assistant", "--project", "/home/rc/k3s-homelab"]
startup_timeout_sec = 120

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking", "--mcp", "--max-steps", "10"]

[projects."/home/rc/k3s-homelab"]
trust_level = "trusted"
