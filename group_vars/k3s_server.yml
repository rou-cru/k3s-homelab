# group_vars/k3s_server.yml - K3s Master Node Overrides
# Only values that DIFFER from group_vars/all.yml

# ---- HARDWARE SPECIFIC: ASUS ROG SERVER & INTEL POWER -----------------------------
hardware_rogServer: true
hardware_radioBlockEnabled: true
hardware_audioOptimizationEnabled: true
hardware_batteryChargeThreshold: 80
hardware_thermalPolicy: 1

# Intel-specific
hardware_intelRaplPl1LimitMicrowatts: 100000000
hardware_intelRaplPl2LimitMicrowatts: 140000000
hardware_intelPstateMaxPerfPct: 80
hardware_intelPstateNoTurbo: 1

# ---- NVIDIA GPU --------------------------------------------------------------------
nvidia_setup: "auto"
nvidia_driverPackage: "auto"
nvidia_driverFallback: "nvidia-driver-535"
nvidia_devicePluginVersion: "0.14.3"
nvidia_toolkitRepoUrl: "https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list"
nvidia_toolkitGpgUrl: "https://nvidia.github.io/libnvidia-container/gpgkey"
nvidia_devicePluginRepo: "https://nvidia.github.io/k8s-device-plugin"
nvidia_rebootTimeout: 600
nvidia_headlessX11Enabled: true
nvidia_pciBusId: "1:0:0"
nvidia_coolbits: "28"

# ---- MINING ------------------------------------------------------------------------
mining_cpuEnabled: true
mining_gpuEnabled: true

# ---- SERVER CONFIG -----------------------------------------------------------------
# K3s server needs Ansible K8s modules
system_installK8sAnsibleDeps: true

# Server lifecycle
k3s_serverRecreate: true

tailscale_advertiseServiceCidr: true

