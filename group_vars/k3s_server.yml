# group_vars/k3s_server.yml - K3s Master Node Overrides
# Only values that DIFFER from group_vars/all.yml

# Hardware-specific: ASUS ROG Server
common_rog_server: true
common_radio_block_enabled: true
common_audio_optimization_enabled: true
common_mining_enabled: true

# K3s server needs Ansible K8s modules
common_install_k8s_ansible_deps: true

# Server lifecycle
k3s_server_recreate: true
