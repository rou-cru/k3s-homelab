# ===== Tailscale Secret (Strict Environment Lookup) =====
# Se espera que TAILSCALE_AUTHKEY esté definida en el host que ejecuta Ansible.
tailscale_authkey: "{{ lookup('env', 'TAILSCALE_AUTHKEY') }}"

# Nota: Otras variables específicas están en roles/*/defaults/main.yml
# Puedes sobrescribirlas aquí si es necesario para todo el grupo.
