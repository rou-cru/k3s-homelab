# group_vars/vps.yml - VPS Gateway Node Overrides
# Only values that DIFFER from group_vars/all.yml (physical on-premise defaults)

# ------------------------------------------------------------------------------
# DISABLE PHYSICAL HARDWARE FEATURES
# ------------------------------------------------------------------------------
common_install_hwe_kernel: false
common_install_network_manager: false
common_install_acpid: false
common_install_cloud_binaries: false
common_install_dev_packages: false
common_install_github_cli_repo: false

# No GPU on VPS
nvidia_gpu_setup: "false"

# No gVisor on VPS
gvisor_install: false

# No dev tools on VPS (network appliance role)
devtools_enabled: false

# ------------------------------------------------------------------------------
# VPS-SPECIFIC REQUIREMENTS
# ------------------------------------------------------------------------------
# Exit node for egress gateway
tailscale_exit_node_enabled: true

# ------------------------------------------------------------------------------
# K3S AGENT CONFIGURATION (VPS is agent, not server)
# ------------------------------------------------------------------------------
k3s_agent_server_url: "https://k3s-master:6443"

k3s_agent_kubelet_args:
  - "--system-reserved=cpu=200m,memory=512Mi"
  - "--kube-reserved=cpu=200m,memory=512Mi"
  - "--eviction-hard=memory.available<256Mi,nodefs.available<10%"
  - "--eviction-soft=memory.available<512Mi,nodefs.available<15%"
  - "--eviction-soft-grace-period=memory.available=1m30s,nodefs.available=2m"

k3s_agent_node_labels:
  - "node-role.kubernetes.io/edge=true"
  - "topology.kubernetes.io/zone=vps"
  - "node.kubernetes.io/instance-type=vps"
  - "egress-gateway=vps"

k3s_agent_node_taints:
  - "node-role.kubernetes.io/edge=true:NoSchedule"
