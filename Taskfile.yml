version: '3'
vars:
  TEMPLATE_DIR: roles/common/templates
  DEFAULTS_FILE: group_vars/all.yml
  TEST_VARS_FILE: .task/test-vars.yml
  OUTPUT_DIR: .task/rendered
  CILIUM_VERSION:
    sh: yq e '.cilium_chartVersion' group_vars/all.yml
tasks:
  default:
    desc: "Show available tasks"
    cmds:
      - task --list
  render-rog-tweaks:
    internal: true
    env:
      PYTHONWARNINGS: ignore
    sources:
      - "{{.TEMPLATE_DIR}}/apply-rog-tweaks.sh.j2"
      - "group_vars/k3s_server.yml"
    generates:
      - "{{.OUTPUT_DIR}}/apply-rog-tweaks.sh"
    cmds:
      - mkdir -p {{.OUTPUT_DIR}}
      - |
        j2 {{.TEMPLATE_DIR}}/apply-rog-tweaks.sh.j2 \
          group_vars/k3s_server.yml > {{.OUTPUT_DIR}}/apply-rog-tweaks.sh
      - chmod +x {{.OUTPUT_DIR}}/apply-rog-tweaks.sh
  render-network-opt:
    internal: true
    env:
      PYTHONWARNINGS: ignore
    sources:
      - "{{.TEMPLATE_DIR}}/optimize-network.sh.j2"
      - "{{.DEFAULTS_FILE}}"
      - "{{.TEST_VARS_FILE}}"
    generates:
      - "{{.OUTPUT_DIR}}/optimize-network.sh"
    cmds:
      - mkdir -p {{.OUTPUT_DIR}}
      - |
        j2 {{.TEMPLATE_DIR}}/optimize-network.sh.j2 \
          {{.TEST_VARS_FILE}} > {{.OUTPUT_DIR}}/optimize-network.sh
      - chmod +x {{.OUTPUT_DIR}}/optimize-network.sh
  render-all:
    internal: true
    deps:
      - render-rog-tweaks
      - render-network-opt
  docs:generate:
    desc: "Generate Docsible documentation for roles and playbooks"
    cmds:
      - echo "Generating documentation for all roles..."
      - |
        for role in roles/*/; do
          echo "Processing $role..."
          .venv/bin/docsible --role "$role" --graph --comments --task-line --no-backup --no-docsible
        done
      - echo "Generating playbook docs via Docsible wrappers..."
      - |
        .venv/bin/docsible \
          --role docs/playbooks/site \
          --playbook site.yaml \
          --graph \
          --comments \
          --task-line \
          --no-backup \
          --no-docsible \
          --output ../../generated/site.md
      - |
        .venv/bin/docsible \
          --role docs/playbooks/site-vps \
          --playbook site-vps.yaml \
          --graph \
          --comments \
          --task-line \
          --no-backup \
          --no-docsible \
          --output ../../generated/site-vps.md
      - echo "Building consolidated playbook guide..."
      - |
        cat > docs/generated/playbook-master.md <<'EOF'
        # Playbook Master Guide

        End-to-end execution map for this repository using generated Docsible documentation.

        ## Primary Flow

        1. Control plane bootstrap: `docs/generated/site.md`
        2. VPS agent bootstrap: `docs/generated/site-vps.md`
        3. Role-level implementation details: `roles/*/README.md`

        ## Where To Insert New Tasks

        | Goal | Insert In | Why |
        | ---- | --------- | --- |
        | Host prerequisites | `site.yaml` play `Setup K3s Master Node` phase 1 | Runs before cluster init |
        | Cluster sequencing | `site.yaml` play `Setup K3s Master Node` phase 2 | Defines control-plane order |
        | Infra platform | `site.yaml` play `Setup K3s Master Node` phase 3 | Cert-manager, secrets, gateway |
        | GitOps controller changes | `site.yaml` Play `Deploy ArgoCD GitOps` | ArgoCD deployment and sync behavior |
        | VPS edge/agent behavior | `site-vps.yaml` Play `Setup K3s VPS Agent Node` | Agent join and route ads |

        ## Role Docs

        - `roles/argocd/README.md`
        - `roles/cert_manager/README.md`
        - `roles/cilium/README.md`
        - `roles/common/README.md`
        - `roles/crds_bootstrap/README.md`
        - `roles/developer_tools/README.md`
        - `roles/external_secrets/README.md`
        - `roles/gateway/README.md`
        - `roles/gvisor/README.md`
        - `roles/k3s_agent/README.md`
        - `roles/k3s_common/README.md`
        - `roles/k3s_server/README.md`
        - `roles/miners/README.md`
        - `roles/nvidia_gpu/README.md`
        - `roles/validate_hardware/README.md`
        - `roles/tailscale/README.md`
        EOF
      - echo "Documentation generated."
  k8s:bootstrap:cilium:
    desc: "Deploy/Upgrade Cilium CNI directly via Helm"
    cmds:
      - echo "Deploying Cilium"
      - |
        helm upgrade --install cilium cilium/cilium \
          --version {{.CILIUM_VERSION}} \
          --namespace kube-system \
          --values k8s/bootstrap/cilium/values.yaml \
          --set k8sServiceHost=100.96.136.51 \
          --wait \
          --timeout 10m
      - echo "Cilium deployment updated."
      # -           --set ipv4NativeRoutingCIDR=10.0.0.0/8 \

  validate:
    desc: "Validate all files (YAML, Ansible, Jinja2, Bash)"
    cmds:
      - task: validate-yaml
      - task: validate-ansible-checkov
      - task: validate-ansible-syntax
      - task: validate-jinja2
      - task: validate-bash
      - defer: rm -rf {{.OUTPUT_DIR}}/ .task/checksum/
  validate-yaml:
    desc: "Validate all YAML files with yamllint"
    sources:
      - "**/*.yml"
      - "**/*.yaml"
      - ".yamllint.yml"
    preconditions:
      - sh: command -v yamllint
        msg: "yamllint not found. Run: devbox shell"
    cmds:
      - yamllint .
  validate-ansible-checkov:
    desc: "Validate Ansible files with checkov"
    preconditions:
      - sh: command -v checkov
        msg: "checkov not found. Run: devbox shell"
    cmds:
      - checkov -d . --framework ansible --quiet
  validate-ansible-syntax:
    desc: "Validate Ansible files with ansible-playbook --syntax-check"
    env:
      ANSIBLE_LOCAL_TEMP: .task/ansible-tmp
    preconditions:
      - sh: command -v ansible-playbook
        msg: "ansible-playbook not found. Run: devbox shell"
    cmds:
      - |
        mkdir -p .task
        mkdir -p .task/ansible-tmp
        cp secrets.example.yaml .task/mock-secrets.yaml
        touch .task/mock-secrets.created
      - ansible-playbook --syntax-check site.yaml -e secrets_file=.task/mock-secrets.yaml
      - defer: |
          if [ -f .task/mock-secrets.created ]; then
            rm -f .task/mock-secrets.yaml .task/mock-secrets.created
          fi
  validate-jinja2:
    desc: "Lint Jinja2 templates with j2lint"
    sources:
      - "roles/**/templates/*.j2"
    preconditions:
      - sh: command -v j2lint
        msg: "j2lint not found. Run: devbox shell"
    cmds:
      - j2lint roles/**/templates/*.j2 --ignore jinja-variable-lower-case
  validate-bash:
    desc: "Validate rendered bash scripts"
    cmds:
      - task: validate-bash-rog-tweaks
      - task: validate-bash-network-opt
  validate-bash-rog-tweaks:
    desc: "Validate apply-rog-tweaks.sh (rendered)"
    deps:
      - render-rog-tweaks
    vars:
      SCRIPT: "{{.OUTPUT_DIR}}/apply-rog-tweaks.sh"
    sources:
      - "{{.SCRIPT}}"
    preconditions:
      - sh: command -v shellcheck
        msg: "shellcheck not found. Run: devbox shell"
      - sh: test -f {{.SCRIPT}}
        msg: "Script not rendered"
    cmds:
      - bash -n {{.SCRIPT}}
      - shellcheck {{.SCRIPT}}
  validate-bash-network-opt:
    desc: "Validate optimize-network.sh (rendered)"
    deps:
      - render-network-opt
    vars:
      SCRIPT: "{{.OUTPUT_DIR}}/optimize-network.sh"
    sources:
      - "{{.SCRIPT}}"
    preconditions:
      - sh: command -v shellcheck
        msg: "shellcheck not found. Run: devbox shell"
      - sh: test -f {{.SCRIPT}}
        msg: "Script not rendered"
    cmds:
      - bash -n {{.SCRIPT}}
      - shellcheck {{.SCRIPT}}
  format:
    desc: "Auto-format all files (YAML + Bash)"
    cmds:
      - task: format-yaml
      - task: format-bash
  format-yaml:
    desc: "Auto-format YAML files with yamlfmt"
    sources:
      - "**/*.yml"
      - "**/*.yaml"
    preconditions:
      - sh: command -v yamlfmt
        msg: "yamlfmt not found. Run: devbox shell"
    cmds:
      - yamlfmt -conf .yamlfmt
  format-bash:
    desc: "Auto-format rendered bash scripts with shfmt"
    deps:
      - render-all
    cmds:
      - task: format-bash-rog-tweaks
      - task: format-bash-network-opt
  format-bash-rog-tweaks:
    desc: "Format apply-rog-tweaks.sh"
    deps:
      - render-rog-tweaks
    vars:
      SCRIPT: "{{.OUTPUT_DIR}}/apply-rog-tweaks.sh"
    preconditions:
      - sh: command -v shfmt
        msg: "shfmt not found. Run: devbox shell"
    cmds:
      - shfmt -w -i 4 {{.SCRIPT}}
      - echo "Formatted {{.SCRIPT}}"
  format-bash-network-opt:
    desc: "Format optimize-network.sh"
    deps:
      - render-network-opt
    vars:
      SCRIPT: "{{.OUTPUT_DIR}}/optimize-network.sh"
    preconditions:
      - sh: command -v shfmt
        msg: "shfmt not found. Run: devbox shell"
    cmds:
      - shfmt -w -i 4 {{.SCRIPT}}
      - echo "Formatted {{.SCRIPT}}"
  ci-full:
    desc: "Run full CI pipeline (validate + format check)"
    cmds:
      - echo "Running full CI pipeline..."
      - task: validate
      - task: ci-format-check
  ci-quick:
    desc: "Quick validation (ansible-playbook syntax + bash syntax)"
    cmds:
      - echo "Running quick checks..."
      - task: validate-ansible-syntax
      - task: validate-bash
  ci-format-check:
    desc: "Check formatting without modifying files"
    cmds:
      - yamlfmt -conf .yamlfmt -dry
      - task: render-all
      - shfmt -d -i 4 {{.OUTPUT_DIR}}/*.sh
  clean:
    desc: "Clean rendered files and cache"
    cmds:
      - rm -rf {{.OUTPUT_DIR}}/ .task/checksum/
      - echo "Cleaned {{.OUTPUT_DIR}}/ and cache"
  secrets:init:
    desc: "Initialize Vault password file if missing"
    status:
      - test -f .ansible_vault_pass
    cmds:
      - openssl rand -base64 32 > .ansible_vault_pass
      - chmod 600 .ansible_vault_pass
      - echo "Generated .ansible_vault_pass"
  secrets:set:
    desc: "Encrypt and set a secret (usage: task secrets:set -- KEY VALUE)"
    deps:
      - secrets:init
    preconditions:
      - sh: command -v ansible-vault
        msg: "ansible-vault not found"
      - sh: '[ $# -eq 2 ]'
        msg: "Usage: task secrets:set -- KEY VALUE"
    vars:
      KEY: "{{index .CLI_ARGS 0}}"
      VAL: "{{index .CLI_ARGS 1}}"
    cmds:
      - touch secrets.yaml
      - |
        # Use a temporary file to hold the encrypted string
        ansible-vault encrypt_string --vault-password-file .ansible_vault_pass \
          "{{.VAL}}" --name "{{.KEY}}" >> secrets.yaml
      - echo "Added {{.KEY}} to secrets.yaml"
  secrets:setup:
    desc: "Interactive setup for all required secrets"
    deps:
      - secrets:init
    cmds:
      - |
        echo "Starting Interactive Secrets Setup"
        echo "You will be asked for: tailscale_authkey, ansible_become_password, honeygain_pass"
        echo "---------------------------------------------------------------------------------------------------"

        read -p "Tailscale AuthKey (tskey-auth-...): " tailscale_key
        [ -n "$tailscale_key" ] && task secrets:set -- tailscale_authkey "$tailscale_key"

        read -s -p "Sudo Password (ansible_become_password): " sudo_pass
        echo ""
        [ -n "$sudo_pass" ] && task secrets:set -- ansible_become_password "$sudo_pass"

        read -s -p "Honeygain Password: " honey_pass
        echo ""
        [ -n "$honey_pass" ] && task secrets:set -- honeygain_pass "$honey_pass"

        echo "Setup complete! secrets.yaml is ready."
  build:miners:cpu:
    desc: "Build custom CPU miner image"
    cmds:
      - docker buildx bake -f docker-bake.hcl cpu-miner-i9 cpu-miner-generic cpu-miner-tnn
  build:miners:cpu:tnn:
    desc: "Build TNN CPU miner image"
    cmds:
      - docker buildx bake -f docker-bake.hcl cpu-miner-tnn
  build:miners:gpu:
    desc: "Build custom GPU miner image"
    cmds:
      - docker buildx bake -f docker-bake.hcl gpu-miner
  build:miners:gpu:rigel:
    desc: "Build custom GPU miner image (Rigel)"
    cmds:
      - docker buildx bake -f docker-bake.hcl gpu-miner-rigel
  build:miners:
    desc: "Build all custom miner Docker images"
    cmds:
      - docker buildx bake -f docker-bake.hcl
  push:miners:
    desc: "Push all miner images to registry"
    cmds:
      - docker buildx bake -f docker-bake.hcl --push
  push:miners:gpu:rigel:
    desc: "Push GPU Rigel miner image to registry"
    cmds:
      - docker buildx bake -f docker-bake.hcl gpu-miner-rigel --push
  release:miners:
    desc: "Build and push all miner images (Release)"
    cmds:
      - task: build:miners
      - task: push:miners
