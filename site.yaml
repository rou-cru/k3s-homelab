---
- name: Setup K3s Master Node
  hosts: k3s_server
  become: true

  vars_files:
    - secrets.yaml

  pre_tasks:
    - name: Update APT cache once at start
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: always

    - name: Validate Tailscale AuthKey presence
      ansible.builtin.assert:
        that:
          - tailscale_authkey is defined
          - tailscale_authkey | length > 0
          - "tailscale_authkey != 'tskey-auth-REPLACE-WITH-REAL-KEY'"
        fail_msg: "ERROR: Configure your real 'tailscale_authkey' in 'secrets.yaml'."
        success_msg: "Tailscale AuthKey validated successfully."
      tags: always

  roles:
    - role: preflight
      tags: ["preflight", "validation"]
    - role: common
      tags: ["common", "system"]
    - role: tailscale
      tags: ["tailscale", "network", "vpn"]
    - role: k3s_server
      tags: ["k3s", "kubernetes"]
    - role: nvidia_gpu
      tags: ["nvidia", "gpu"]
    - role: cilium
      tags: ["cilium", "cni", "network"]
