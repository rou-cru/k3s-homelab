---
# site.yaml - Master Playbook for K3s Homelab
# Organized into distinct phases for Master, Miners, VPS, and GitOps.

# ==============================================================================
# PLAY 1: K3s Master Node Setup (Infrastructure)
# ==============================================================================
- name: Setup K3s Master Node
  hosts: k3s_server
  become: true
  vars_files:
    - "{{ secrets_file | default('secrets.yaml') }}"
  pre_tasks:
    # @docsible Remove malformed NVIDIA source list
    - name: Remove potential malformed NVIDIA source list
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/nvidia-container-toolkit.list
        state: absent
      tags: always
    # @docsible Update APT cache
    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: always
    # @docsible Normalize NVIDIA setup mode
    - name: Normalize NVIDIA GPU setup mode
      ansible.builtin.set_fact:
        nvidia_setupMode: "{{ nvidia_setup | default('auto') | string | lower }}"
      tags: ["nvidia"]
    # @docsible Validate Tailscale AuthKey
    - name: Validate Tailscale AuthKey presence
      ansible.builtin.assert:
        that:
          - tailscale_authkey is defined
          - tailscale_authkey | length > 0
          - "tailscale_authkey != 'tskey-auth-REPLACE-WITH-REAL-KEY'"
        fail_msg: "ERROR: Configure your real 'tailscale_authkey' in 'secrets.yaml'."
        success_msg: "Tailscale AuthKey validated successfully."
      tags: always
      no_log: true

  tasks:
    # @docsible Validate system requirements before installation
    - name: Run preflight role
      ansible.builtin.import_role:
        name: preflight
      tags: ["host", "os"]
    # @docsible Configure base OS settings and kernel parameters
    - name: Run common role
      ansible.builtin.import_role:
        name: common
      tags: ["host", "os"]
    # @docsible Deploy system monitoring with glances
    - name: Run glances monitoring
      ansible.builtin.import_role:
        name: glances
      tags: ["host", "os"]
    # @docsible Optimize network stack for cluster communication
    - name: Run common network optimizations
      ansible.builtin.import_role:
        name: common
        tasks_from: network_optimization.yml
      when: system_networkOptimize | default(true)
      tags: ["host", "os", "network"]
    # @docsible Install kubectl, helm, and other development tools
    - name: Run developer tools role
      ansible.builtin.import_role:
        name: developer_tools
      tags: ["host", "os"]
      when: devtools_enabled | default(true) | bool
    # @docsible Setup gVisor in host
    - name: Run gvisor role
      ansible.builtin.import_role:
        name: gvisor
        tasks_from: host.yml
      tags: ["host", "os", "security"]
      when: not ansible_check_mode
    # @docsible Setup NVIDIA GPU host drivers and toolkit
    - name: Run NVIDIA GPU host role
      ansible.builtin.import_role:
        name: nvidia_gpu
        tasks_from: host.yml
      tags: ["host", "nvidia"]
      when: nvidia_setupMode != 'false'
    # @docsible Ensure all host-level changes are applied before cluster setup
    - name: Flush host handlers before cluster init
      ansible.builtin.meta: flush_handlers
    # @docsible Setup the tailscale network
    - name: Run tailscale role
      ansible.builtin.import_role:
        name: tailscale
      tags: ["host", "network"]
    # @docsible Initialize K3s control plane on master node
    - name: Run k3s server role
      ansible.builtin.import_role:
        name: k3s_server
      tags: ["cluster"]
    # @docsible Setup gVisor in cluster
    - name: Run gvisor RuntimeClass
      ansible.builtin.import_role:
        name: gvisor
        tasks_from: runtimeclass.yml
      tags: ["cluster", "security"]
      when: not ansible_check_mode
    # @docsible Deploy CRDs for service monitors
    - name: Run crds_bootstrap role
      ansible.builtin.import_role:
        name: crds_bootstrap
      tags: ["cluster", "infrastructure"]
      when: not ansible_check_mode
    # @docsible Deploy Cilium CNI
    - name: Run cilium role
      ansible.builtin.import_role:
        name: cilium
      tags: ["cluster", "network"]
      become: false
      when: not ansible_check_mode
    # @docsible Deploy NVIDIA GPU device plugin
    - name: Run NVIDIA GPU cluster role
      ansible.builtin.import_role:
        name: nvidia_gpu
        tasks_from: cluster.yml
      tags: ["cluster", "nvidia"]
      when:
        - nvidia_active | default(false) | bool
        - not ansible_check_mode
      become: false
    # @docsible Deploy Cert Manager
    - name: Run cert-manager role
      ansible.builtin.import_role:
        name: cert_manager
      tags: ["cluster", "infrastructure", "cert-manager"]
      become: false
      when: not ansible_check_mode
    # @docsible Deploy External Secrets Operator
    - name: Run external-secrets role
      ansible.builtin.import_role:
        name: external_secrets
      tags: ["cluster", "infrastructure", "external-secrets"]
      become: false
      when: not ansible_check_mode
    # @docsible Deploy ACME/Let's Encrypt and public Gateway (requires external-secrets)
    - name: Run cert-manager ACME configuration
      ansible.builtin.import_role:
        name: cert_manager
        tasks_from: acme.yml
      tags: ["cluster", "infrastructure", "acme", "gateway"]
      become: false
      when: not ansible_check_mode

# ==============================================================================
# PLAY 2: Mining Workloads (Deploy before VPS)
# ==============================================================================
- name: Deploy Mining Workloads
  hosts: k3s_server
  become: true
  vars:
    # @docsible Mining wallet configuration
    wallet_cpu: "{{ miningWallet | default('') }}"
  vars_files:
    - "{{ secrets_file | default('secrets.yaml') }}"
  pre_tasks:
    # @docsible Validate mining wallet configuration
    - name: Validate mining wallet configuration
      ansible.builtin.assert:
        that:
          - wallet_cpu | length > 0
        fail_msg: >-
          ERROR: Configure 'miningWallet' in 'secrets.yaml' or inventory variables.
        success_msg: "Mining wallet configuration validated successfully."
      tags: always
  tasks:
    # @docsible Build control plane miner labels
    - name: Build control plane miner labels
      ansible.builtin.set_fact:
        miner_control_plane_labels: >-
          {{
            []
            + (['miner.network=true'] if (minerLabelNetwork | default(true) | bool) else [])
            + (['miner.cpu=true'] if (mining_cpuEnabled | default(false) | bool) else [])
            + (['miner.gpu=true'] if (mining_gpuEnabled | default(false) | bool) else [])
          }}
      tags: ["cluster", "apps", "miners"]
    # @docsible Label control plane for mining
    - name: Get control plane nodes for mining labeling
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Node
        label_selectors:
          - node-role.kubernetes.io/control-plane
      register: control_plane_nodes
      when:
        - miner_control_plane_labels | length > 0
        - not ansible_check_mode
      tags: ["cluster", "apps", "miners"]

    - name: Label control plane nodes for mining workloads
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        kind: Node
        name: "{{ item.metadata.name }}"
        definition:
          metadata:
            labels: "{{ dict(miner_control_plane_labels | map('split', '=') | map('list')) }}"
      loop: "{{ control_plane_nodes.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when:
        - miner_control_plane_labels | length > 0
        - not ansible_check_mode
      tags: ["cluster", "apps", "miners"]

    # @docsible Clean remote manifests directory
    - name: Clean remote manifests directory
      ansible.builtin.file:
        path: "{{ k8s_manifestsDir }}"
        state: absent
      tags: ["apps"]

    # @docsible Copy Kustomize bases to remote
    - name: Copy Kustomize bases to remote
      ansible.builtin.copy:
        src: k8s/
        dest: "{{ k8s_manifestsDir }}/"
        directory_mode: "0750"
        mode: "0640"
      tags: ["apps"]

    # @docsible Apply Kubernetes namespaces
    - name: Find namespace manifests on remote
      ansible.builtin.find:
        paths: "{{ k8s_manifestsDir }}/bootstrap/namespaces"
        patterns: "*.yaml"
      register: k8s_namespace_manifests
      tags: ["apps"]
      when: not ansible_check_mode

    - name: Apply Namespaces
      kubernetes.core.k8s:
        src: "{{ item.path }}"
        kubeconfig: "{{ kubeconfig }}"
        state: present
      tags: ["apps"]
      loop: "{{ k8s_namespace_manifests.files | sort(attribute='path') }}"
      when: not ansible_check_mode

    # @docsible Generate Honeygain config
    - name: Generate Honeygain Config (Kustomize Bridge)
      ansible.builtin.copy:
        dest: "{{ k8s_manifestsDir }}/apps/miners/honeygain/config.env"
        content: |
          HONEYGAIN_EMAIL={{ honeygainEmail }}
          HONEYGAIN_DEVICE={{ honeygainDevice | default('bandwidth-miner') }}
        mode: "0600"
      tags: ["apps", "honeygain"]

    # @docsible Generate Honeygain secrets
    - name: Generate Honeygain Secrets (Kustomize Bridge)
      ansible.builtin.copy:
        dest: "{{ k8s_manifestsDir }}/apps/miners/honeygain/secret.env"
        content: |
          HONEYGAIN_PASS={{ honeygainPass }}
        mode: "0600"
      tags: ["apps", "honeygain"]
      no_log: true

    # @docsible Deploy Honeygain workload
    - name: Deploy Honeygain via Kustomize
      ansible.builtin.command: kubectl apply -k {{ k8s_manifestsDir }}/apps/miners/honeygain/
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: honeygain_apply
      changed_when: "'configured' in honeygain_apply.stdout or 'created' in honeygain_apply.stdout"
      tags: ["apps", "honeygain"]
      when: not ansible_check_mode

    # @docsible Generate mining wallets secret
    - name: Generate Mining Wallets Secret (Kustomize Bridge)
      ansible.builtin.copy:
        dest: "{{ k8s_manifestsDir }}/apps/miners/mining-secrets/wallets.env"
        content: |
          XEL_WALLET={{ wallet_cpu }}
        mode: "0600"
      tags: ["apps", "miners"]
      no_log: true

    # @docsible Deploy mining secrets
    - name: Deploy Mining Secrets via Kustomize
      ansible.builtin.command: kubectl apply -k {{ k8s_manifestsDir }}/apps/miners/mining-secrets/
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: mining_secrets_apply
      changed_when: "'configured' in mining_secrets_apply.stdout or 'created' in mining_secrets_apply.stdout"
      tags: ["apps", "miners"]
      when: not ansible_check_mode

    # @docsible Deploy mining pools ConfigMap
    - name: Deploy Mining Pools ConfigMap via Kustomize
      ansible.builtin.command: kubectl apply -k {{ k8s_manifestsDir }}/apps/miners/mining-pools/
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: mining_pools_apply
      changed_when: "'configured' in mining_pools_apply.stdout or 'created' in mining_pools_apply.stdout"
      tags: ["apps", "miners"]
      when: not ansible_check_mode

    # @docsible Deploy CPU miner
    - name: Deploy Unmineable CPU TNN via Kustomize
      ansible.builtin.command: kubectl apply -k {{ k8s_manifestsDir }}/apps/miners/cpu-miner/
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: unmineable_cpu_tnn_apply
      changed_when: "'configured' in unmineable_cpu_tnn_apply.stdout or 'created' in unmineable_cpu_tnn_apply.stdout"
      tags: ["apps", "miners", "cpu-miner"]
      when: not ansible_check_mode

    # @docsible Deploy GPU miner
    - name: Deploy Unmineable GPU Rigel via Kustomize
      ansible.builtin.command: kubectl apply -k {{ k8s_manifestsDir }}/apps/miners/gpu-miner/
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: unmineable_gpu_rigel_apply
      changed_when: >-
        'configured' in unmineable_gpu_rigel_apply.stdout or 'created' in unmineable_gpu_rigel_apply.stdout
      when:
        - nvidia_active | default(false) | bool
        - not ansible_check_mode
      tags: ["apps", "miners", "gpu-miner"]

# ==============================================================================
# PLAY 3: VPS Agent Setup (Import)
# ==============================================================================
# @docsible Import VPS agent setup if vps hosts exist in inventory
- name: Import VPS playbook
  ansible.builtin.import_playbook: site-vps.yaml
  when: groups['vps'] | default([]) | length > 0

# ==============================================================================
# PLAY 4: GitOps & Platform (ArgoCD)
# ==============================================================================
- name: Deploy ArgoCD GitOps
  hosts: k3s_server
  become: false
  tasks:
    # @docsible Deploy ArgoCD GitOps
    - name: Run argocd role
      ansible.builtin.import_role:
        name: argocd
      tags: ["apps", "argocd"]
      when: not ansible_check_mode
