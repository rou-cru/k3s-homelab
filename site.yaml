---
# Playbook principal para configurar el nodo maestro K3s con Tailscale y Cilium
- name: Setup K3s Master Node
  hosts: k3s_server
  become: true
  vars_files:
    - secrets.yaml
  pre_tasks:
    - name: Update APT cache once at start
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: always
    - name: Validate Tailscale AuthKey presence
      ansible.builtin.assert:
        that:
          - tailscale_authkey is defined
          - tailscale_authkey | length > 0
          - "tailscale_authkey != 'tskey-auth-REPLACE-WITH-REAL-KEY'"
        fail_msg: "ERROR: Configure your real 'tailscale_authkey' in 'secrets.yaml'."
        success_msg: "Tailscale AuthKey validated successfully."
      tags: always
  tasks:
    - name: Run preflight role
      ansible.builtin.import_role:
        name: preflight
      tags: ["preflight", "validation"]
    - name: Run common role
      ansible.builtin.import_role:
        name: common
      tags: ["common", "system", "mining", "hugepages", "msr"]
    - name: Run developer tools role
      ansible.builtin.import_role:
        name: developer_tools
      tags: ["devtools", "cli", "utilities"]
      when: devtools_enabled | default(true) | bool
    # NVIDIA GPU Host Setup - BEFORE K3s (drivers, toolkit, containerd runtime)
    - name: Run NVIDIA GPU host role
      ansible.builtin.import_role:
        name: nvidia_gpu
        tasks_from: host.yml
      tags: ["nvidia", "gpu", "nvidia-host"]
      when: nvidia_gpu_setup | default('auto') != false

    # NVIDIA GPU Headless Optimization - X11, persistence mode (host-only)
    - name: Run NVIDIA GPU headless optimization
      ansible.builtin.import_role:
        name: nvidia_gpu
        tasks_from: headless_optimization.yml
      tags: ["nvidia", "gpu", "nvidia-headless"]
      when:
        - nvidia_gpu_active | default(false) | bool
        - nvidia_gpu_headless_enabled | default(true) | bool
      ignore_errors: true

    - name: Run tailscale role
      ansible.builtin.import_role:
        name: tailscale
      tags: ["tailscale", "network", "vpn"]
    - name: Run k3s server role
      ansible.builtin.import_role:
        name: k3s_server
      tags: ["k3s", "kubernetes"]
    - name: Run cilium role
      ansible.builtin.import_role:
        name: cilium
      tags: ["cilium", "cni", "network"]
      become: false
    # NVIDIA GPU Cluster Setup - AFTER Cilium (device plugin Helm chart)
    - name: Run NVIDIA GPU cluster role
      ansible.builtin.import_role:
        name: nvidia_gpu
        tasks_from: cluster.yml
      tags: ["nvidia", "gpu", "nvidia-cluster"]
      when: nvidia_gpu_setup | default('auto') != false
      become: false

  post_tasks:
    - name: Create temporary Honeygain secret file
      ansible.builtin.tempfile:
        state: file
        suffix: "-honeygain-secret.yaml"
      register: honeygain_secret_tmp
      delegate_to: localhost
      become: false
      tags: ["k8s-deploy", "workloads", "honeygain"]

    - name: Render Honeygain Secret
      ansible.builtin.template:
        src: k8s/miners/honeygain/secret.yaml.j2
        dest: "{{ honeygain_secret_tmp.path }}"
        mode: "0644"
      delegate_to: localhost
      become: false
      tags: ["k8s-deploy", "workloads", "honeygain"]

    - name: Apply Honeygain Secret
      ansible.builtin.command: kubectl apply -f {{ honeygain_secret_tmp.path }}
      delegate_to: localhost
      become: false
      tags: ["k8s-deploy", "workloads", "honeygain"]
      environment:
        KUBECONFIG: "{{ k3s_server_local_kubeconfig_path }}"

    - name: Remove temporary Honeygain secret file
      ansible.builtin.file:
        path: "{{ honeygain_secret_tmp.path }}"
        state: absent
      delegate_to: localhost
      become: false
      tags: ["k8s-deploy", "workloads", "honeygain"]


    # Safe K8s Manifest Deployment Logic
    # 1. Calculate deployment decision
    - name: Determine if GPU manifests should be deployed
      ansible.builtin.set_fact:
        should_deploy_gpu_manifests: >-
          {{
            (nvidia_gpu_active is defined and nvidia_gpu_active) or
            (nvidia_gpu_active is not defined and nvidia_gpu_setup | default('auto') == true)
          }}
      tags: ["k8s-deploy", "workloads"]

    # 2. Apply Namespaces first
    - name: Apply K8s Namespaces first (with GPU)
      ansible.builtin.shell: |
        find {{ playbook_dir }}/k8s -name '*.yaml' -exec grep -l '^kind: Namespace' {} \; | xargs -r kubectl apply -f
      when: should_deploy_gpu_manifests | bool
      tags: ["k8s-deploy", "workloads"]
      register: namespace_apply
      until: namespace_apply.rc == 0
      retries: 10
      delay: 5
      changed_when: true
      become: false
      environment:
        KUBECONFIG: "{{ k3s_server_local_kubeconfig_path }}"
      delegate_to: localhost

    - name: Apply K8s Namespaces first (without GPU)
      ansible.builtin.shell: |
        find {{ playbook_dir }}/k8s -path '*/unmineable-gpu/*' -prune -o -name '*.yaml' \
          -exec grep -l '^kind: Namespace' {} \; | xargs -r kubectl apply -f
      when: not (should_deploy_gpu_manifests | bool)
      tags: ["k8s-deploy", "workloads"]
      register: namespace_apply
      until: namespace_apply.rc == 0
      retries: 10
      delay: 5
      changed_when: true
      become: false
      environment:
        KUBECONFIG: "{{ k3s_server_local_kubeconfig_path }}"
      delegate_to: localhost

    # 3. Apply all remaining manifests
    - name: Apply all K8s manifests (with GPU)
      ansible.builtin.command: kubectl apply -R -f {{ playbook_dir }}/k8s/
      when: should_deploy_gpu_manifests | bool
      register: manifest_apply
      until: manifest_apply.rc == 0
      retries: 10
      delay: 5
      changed_when: true
      tags: ["k8s-deploy", "workloads"]
      become: false
      environment:
        KUBECONFIG: "{{ k3s_server_local_kubeconfig_path }}"
      delegate_to: localhost

    - name: Apply all K8s manifests (without GPU)
      ansible.builtin.shell: |
        find {{ playbook_dir }}/k8s -path '*/unmineable-gpu/*' -prune -o -name '*.yaml' -print \
          | xargs -r kubectl apply -f
      when: not (should_deploy_gpu_manifests | bool)
      register: manifest_apply
      until: manifest_apply.rc == 0
      retries: 10
      delay: 5
      changed_when: true
      tags: ["k8s-deploy", "workloads"]
      become: false
      environment:
        KUBECONFIG: "{{ k3s_server_local_kubeconfig_path }}"
      delegate_to: localhost
