---
- name: Setup K3s Master Node
  hosts: k3s_server
  become: true
  vars:
    k8s_manifests_dir: "/home/{{ ansible_user }}/k8s-manifests"
    # Mining Defaults (Override via standard Ansible variables)
    # XEL wallet used by both CPU and GPU miners
    wallet_cpu: "{{ mining_wallet | default('') }}"

  vars_files:
    - "{{ secrets_file | default('secrets.yaml') }}"
  pre_tasks:
    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: always
    - name: Normalize NVIDIA GPU setup mode
      ansible.builtin.set_fact:
        nvidia_gpu_setup_mode: "{{ nvidia_gpu_setup | default('auto') | string | lower }}"
      tags: ["nvidia"]
    - name: Validate Tailscale AuthKey presence
      ansible.builtin.assert:
        that:
          - tailscale_authkey is defined
          - tailscale_authkey | length > 0
          - "tailscale_authkey != 'tskey-auth-REPLACE-WITH-REAL-KEY'"
        fail_msg: "ERROR: Configure your real 'tailscale_authkey' in 'secrets.yaml'."
        success_msg: "Tailscale AuthKey validated successfully."
      tags: always
    - name: Validate mining wallet configuration
      ansible.builtin.assert:
        that:
          - wallet_cpu | length > 0
        fail_msg: >-
          ERROR: Configure 'mining_wallet' in 'secrets.yaml' or inventory variables.
        success_msg: "Mining wallet configuration validated successfully."
      tags: always
  tasks:
    - name: Run preflight role
      ansible.builtin.import_role:
        name: preflight
      tags: ["host", "os"]
    - name: Run common role
      ansible.builtin.import_role:
        name: common
      tags: ["host", "os"]
    - name: Run glances monitoring
      ansible.builtin.import_role:
        name: glances
      tags: ["host", "monitoring"]
    - name: Run common network optimizations
      ansible.builtin.import_role:
        name: common
        tasks_from: network_optimization.yml
      when: common_network_optimization_enabled | default(true)
      tags: ["host", "os", "network"]
    - name: Run developer tools role
      ansible.builtin.import_role:
        name: developer_tools
      tags: ["host", "os"]
      when: devtools_enabled | default(true) | bool
    # NVIDIA GPU Host Setup - BEFORE K3s (drivers, toolkit, containerd runtime)
    - name: Run NVIDIA GPU host role
      ansible.builtin.import_role:
        name: nvidia_gpu
        tasks_from: host.yml
      tags: ["host", "nvidia"]
      when: nvidia_gpu_setup_mode != 'false'
    # NVIDIA GPU Headless Optimization - X11, persistence mode (host-only)
    - name: Run NVIDIA GPU headless optimization
      ansible.builtin.import_role:
        name: nvidia_gpu
        tasks_from: headless_optimization.yml
      tags: ["host", "nvidia"]
      when:
        - nvidia_gpu_active | default(false) | bool
        - nvidia_gpu_headless_enabled | default(true) | bool
      ignore_errors: true
      register: headless_result
      failed_when: false
    - name: Warn if NVIDIA headless optimization failed
      ansible.builtin.debug:
        msg: "WARNING: NVIDIA headless optimization encountered errors but continuing deployment"
      when:
        - headless_result is defined
        - headless_result.failed | default(false)
      tags: ["host", "nvidia"]
    - name: Determine if NVIDIA GPU cluster setup should run
      ansible.builtin.set_fact:
        nvidia_gpu_cluster_enabled: >-
          {{
            (nvidia_gpu_setup_mode == 'true') or
            (
              (nvidia_gpu_active | default(false) | bool) and
              (nvidia_gpu_setup_mode != 'false')
            )
          }}
      tags: ["host", "cluster", "nvidia"]
    - name: Run tailscale role
      ansible.builtin.import_role:
        name: tailscale
      tags: ["host", "network"]
    - name: Run k3s server role
      ansible.builtin.import_role:
        name: k3s_server
      tags: ["cluster"]
    - name: Build control plane miner labels
      ansible.builtin.set_fact:
        miner_control_plane_labels: >-
          {{
            []
            + (['miner.network=true'] if (miner_label_network | default(true) | bool) else [])
            + (['miner.cpu=true'] if (miner_label_cpu | default(true) | bool) else [])
            + (['miner.gpu=true'] if (miner_label_gpu | default(true) | bool) else [])
          }}
      tags: ["cluster", "apps", "miners"]
    - name: Label control plane for mining workloads
      ansible.builtin.shell: |
        set -euo pipefail
        NODE_NAME="$(kubectl get nodes -l kubernetes.io/hostname={{ ansible_facts['hostname'] }} -o jsonpath='{.items[0].metadata.name}')"
        kubectl label node "${NODE_NAME}" {{ miner_control_plane_labels | join(' ') }} --overwrite
      args:
        executable: /bin/bash
      when: miner_control_plane_labels | length > 0
      tags: ["cluster", "apps", "miners"]
    - name: Run cilium role
      ansible.builtin.import_role:
        name: cilium
      tags: ["cluster", "network"]
      become: false
    # NVIDIA GPU Cluster Setup - AFTER Cilium (device plugin Helm chart)
    - name: Run NVIDIA GPU cluster role
      ansible.builtin.import_role:
        name: nvidia_gpu
        tasks_from: cluster.yml
      tags: ["cluster", "nvidia"]
      when: nvidia_gpu_cluster_enabled | default(false) | bool
      become: false
  post_tasks:
    - name: Clean remote manifests directory
      ansible.builtin.file:
        path: "{{ k8s_manifests_dir }}"
        state: absent
      become: false
      tags: ["apps"]

    - name: Copy Kustomize bases to remote
      ansible.builtin.copy:
        src: k8s/
        dest: "{{ k8s_manifests_dir }}/"
        directory_mode: "0755"
        mode: "0644"
      become: false
      tags: ["apps"]

    # --- NAMESPACES ---
    - name: Apply Namespaces
      ansible.builtin.command: kubectl apply -f {{ k8s_manifests_dir }}/namespaces/
      register: namespaces_apply
      changed_when: "'configured' in namespaces_apply.stdout or 'created' in namespaces_apply.stdout"
      become: false
      tags: ["apps"]

    # --- HONEYGAIN ---
    - name: Generate Honeygain Config (Kustomize Bridge)
      ansible.builtin.copy:
        dest: "{{ k8s_manifests_dir }}/miners/honeygain/config.env"
        content: |
          HONEYGAIN_EMAIL={{ honeygain_email }}
          HONEYGAIN_DEVICE={{ honeygain_device | default('bandwidth-miner') }}
        mode: "0600"
      become: false
      tags: ["apps", "honeygain"]

    - name: Generate Honeygain Secrets (Kustomize Bridge)
      ansible.builtin.copy:
        dest: "{{ k8s_manifests_dir }}/miners/honeygain/secret.env"
        content: |
          HONEYGAIN_PASS={{ honeygain_pass }}
        mode: "0600"
      become: false
      tags: ["apps", "honeygain"]

    - name: Deploy Honeygain via Kustomize
      ansible.builtin.command: kubectl apply -k {{ k8s_manifests_dir }}/miners/honeygain/
      register: honeygain_apply
      changed_when: "'configured' in honeygain_apply.stdout or 'created' in honeygain_apply.stdout"
      become: false
      tags: ["apps", "honeygain"]

    # --- MINING SECRETS (Centralized Wallets) ---
    - name: Generate Mining Wallets Secret (Kustomize Bridge)
      ansible.builtin.copy:
        dest: "{{ k8s_manifests_dir }}/miners/mining-secrets/wallets.env"
        content: |
          XEL_WALLET={{ wallet_cpu }}
        mode: "0600"
      become: false
      tags: ["apps", "miners"]

    - name: Deploy Mining Secrets via Kustomize
      ansible.builtin.command: kubectl apply -k {{ k8s_manifests_dir }}/miners/mining-secrets/
      register: mining_secrets_apply
      changed_when: "'configured' in mining_secrets_apply.stdout or 'created' in mining_secrets_apply.stdout"
      become: false
      tags: ["apps", "miners"]

    # --- UNMINEABLE CPU TNN ---
    - name: Deploy Unmineable CPU TNN via Kustomize
      ansible.builtin.command: kubectl apply -k {{ k8s_manifests_dir }}/miners/unmineable-cpu-tnn/
      register: unmineable_cpu_tnn_apply
      changed_when: "'configured' in unmineable_cpu_tnn_apply.stdout or 'created' in unmineable_cpu_tnn_apply.stdout"
      become: false
      tags: ["apps", "miners", "unmineable-cpu-tnn"]

    # --- UNMINEABLE GPU RIGEL ---
    - name: Determine if GPU mining is enabled
      ansible.builtin.set_fact:
        gpu_mining_enabled: "{{ nvidia_gpu_cluster_enabled | default(false) | bool }}"
      tags: ["apps", "nvidia"]

    - name: Deploy Unmineable GPU Rigel via Kustomize
      ansible.builtin.command: kubectl apply -k {{ k8s_manifests_dir }}/miners/unmineable-gpu-rigel/
      register: unmineable_gpu_rigel_apply
      changed_when: "'configured' in unmineable_gpu_rigel_apply.stdout or 'created' in unmineable_gpu_rigel_apply.stdout"
      when: gpu_mining_enabled
      become: false
      tags: ["apps", "miners", "unmineable-gpu-rigel"]
