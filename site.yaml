---
# Playbook principal para configurar el nodo maestro K3s con Tailscale y Cilium
- name: Setup K3s Master Node
  hosts: k3s_server
  become: true
  vars_files:
    - secrets.yaml
  pre_tasks:
    - name: Update APT cache once at start
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: always
    - name: Validate Tailscale AuthKey presence
      ansible.builtin.assert:
        that:
          - tailscale_authkey is defined
          - tailscale_authkey | length > 0
          - "tailscale_authkey != 'tskey-auth-REPLACE-WITH-REAL-KEY'"
        fail_msg: "ERROR: Configure your real 'tailscale_authkey' in 'secrets.yaml'."
        success_msg: "Tailscale AuthKey validated successfully."
      tags: always
  tasks:
    - name: Run preflight role
      ansible.builtin.import_role:
        name: preflight
      tags: ["preflight", "validation"]
    - name: Run common role
      ansible.builtin.import_role:
        name: common
      tags: ["common", "system", "mining", "hugepages", "msr"]
    - name: Run developer tools role
      ansible.builtin.import_role:
        name: developer_tools
      tags: ["devtools", "cli", "utilities"]
      when: devtools_enabled | default(true) | bool
    # NVIDIA GPU Host Setup - BEFORE K3s (drivers, toolkit, containerd runtime)
    - name: Run NVIDIA GPU host role
      ansible.builtin.import_role:
        name: nvidia_gpu
        tasks_from: host.yml
      tags: ["nvidia", "gpu", "nvidia-host"]
    - name: Run tailscale role
      ansible.builtin.import_role:
        name: tailscale
      tags: ["tailscale", "network", "vpn"]
    - name: Run k3s server role
      ansible.builtin.import_role:
        name: k3s_server
      tags: ["k3s", "kubernetes"]
    - name: Run cilium role
      ansible.builtin.import_role:
        name: cilium
      tags: ["cilium", "cni", "network"]
    # NVIDIA GPU Cluster Setup - AFTER Cilium (device plugin Helm chart)
    - name: Run NVIDIA GPU cluster role
      ansible.builtin.import_role:
        name: nvidia_gpu
        tasks_from: cluster.yml
      tags: ["nvidia", "gpu", "nvidia-cluster"]
  post_tasks:
    - name: Copy K8s manifests to remote host
      ansible.builtin.copy:
        src: k8s/
        dest: /tmp/k8s-manifests/
        mode: "0644"
      tags: ["k8s-deploy", "workloads"]
    - name: Apply K8s manifests
      ansible.builtin.shell:
        cmd: |
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          find /tmp/k8s-manifests -type f -name '*.yaml' -print0 \
            | xargs -0 -r grep -l '^kind: Namespace' \
            | xargs -r kubectl apply -f
          kubectl apply -R -f /tmp/k8s-manifests/
        executable: /bin/bash
      changed_when: true
      tags: ["k8s-deploy", "workloads"]
    - name: Cleanup temporary manifests
      ansible.builtin.file:
        path: /tmp/k8s-manifests/
        state: absent
      tags: ["k8s-deploy", "workloads"]
