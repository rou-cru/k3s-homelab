- name: Setup K3s Master Node
  hosts: k3s_server
  become: true
  
  pre_tasks:
    - name: Validate Tailscale AuthKey presence
      assert:
        that:
          - tailscale_authkey | length > 0
        fail_msg: "ERROR: La variable de entorno TAILSCALE_AUTHKEY no está definida o está vacía."
        success_msg: "Tailscale AuthKey validada correctamente."

  roles:
    - common
    - tailscale
    - k3s_server
    - cilium
