- name: Setup K3s Master Node
  hosts: k3s_server
  become: true
  
  # Cargar variables sensibles desde archivo externo ignorado por git
  vars_files:
    - secrets.yaml

  pre_tasks:
    - name: Validate Tailscale AuthKey presence
      assert:
        that:
          - tailscale_authkey is defined
          - tailscale_authkey | length > 0
          - "tailscale_authkey != 'tskey-auth-REEMPLAZA-ESTO-POR-TU-CLAVE-REAL'"
        fail_msg: "ERROR: Debes configurar tu 'tailscale_authkey' real en el archivo 'secrets.yaml'."
        success_msg: "Tailscale AuthKey validada correctamente."

  roles:
    - common
    - tailscale
    - k3s_server
    - nvidia_gpu
    - cilium
