---
- name: Setup K3s Master Node
  hosts: k3s_server
  become: true
  vars:
    k8s_manifests_dir: "/home/{{ ansible_user }}/k8s-manifests"
  vars_files:
    - "{{ secrets_file | default('secrets.yaml') }}"
  pre_tasks:
    - name: Update APT cache once at start
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: always
    - name: Normalize NVIDIA GPU setup mode
      ansible.builtin.set_fact:
        nvidia_gpu_setup_mode: "{{ nvidia_gpu_setup | default('auto') | string | lower }}"
      tags: ["nvidia"]
    - name: Validate Tailscale AuthKey presence
      ansible.builtin.assert:
        that:
          - tailscale_authkey is defined
          - tailscale_authkey | length > 0
          - "tailscale_authkey != 'tskey-auth-REPLACE-WITH-REAL-KEY'"
        fail_msg: "ERROR: Configure your real 'tailscale_authkey' in 'secrets.yaml'."
        success_msg: "Tailscale AuthKey validated successfully."
      tags: always
  tasks:
    - name: Run preflight role
      ansible.builtin.import_role:
        name: preflight
      tags: ["host", "os"]
    - name: Run common role
      ansible.builtin.import_role:
        name: common
      tags: ["host", "os"]
    - name: Run glances monitoring
      ansible.builtin.import_role:
        name: glances
      tags: ["host", "monitoring"]
    - name: Run common network optimizations
      ansible.builtin.import_role:
        name: common
        tasks_from: network_optimization.yml
      when: common_network_optimization_enabled | default(true)
      tags: ["host", "os", "network"]
    - name: Run developer tools role
      ansible.builtin.import_role:
        name: developer_tools
      tags: ["host", "os"]
      when: devtools_enabled | default(true) | bool
    # NVIDIA GPU Host Setup - BEFORE K3s (drivers, toolkit, containerd runtime)
    - name: Run NVIDIA GPU host role
      ansible.builtin.import_role:
        name: nvidia_gpu
        tasks_from: host.yml
      tags: ["host", "nvidia"]
      when: nvidia_gpu_setup_mode != 'false'
    # NVIDIA GPU Headless Optimization - X11, persistence mode (host-only)
    - name: Run NVIDIA GPU headless optimization
      ansible.builtin.import_role:
        name: nvidia_gpu
        tasks_from: headless_optimization.yml
      tags: ["host", "nvidia"]
      when:
        - nvidia_gpu_active | default(false) | bool
        - nvidia_gpu_headless_enabled | default(true) | bool
      ignore_errors: true
    - name: Determine if NVIDIA GPU cluster setup should run
      ansible.builtin.set_fact:
        nvidia_gpu_cluster_enabled: >-
          {{

            (nvidia_gpu_setup_mode == 'true') or
            (
              (nvidia_gpu_active | default(false) | bool) and
              (nvidia_gpu_setup_mode != 'false')
            )
          }}
      tags: ["host", "cluster", "nvidia"]
    - name: Run tailscale role
      ansible.builtin.import_role:
        name: tailscale
      tags: ["host", "network"]
    - name: Run k3s server role
      ansible.builtin.import_role:
        name: k3s_server
      tags: ["cluster"]
    - name: Run cilium role
      ansible.builtin.import_role:
        name: cilium
      tags: ["cluster", "network"]
      become: false
    # NVIDIA GPU Cluster Setup - AFTER Cilium (device plugin Helm chart)
    - name: Run NVIDIA GPU cluster role
      ansible.builtin.import_role:
        name: nvidia_gpu
        tasks_from: cluster.yml
      tags: ["cluster", "nvidia"]
      when: nvidia_gpu_cluster_enabled | default(false) | bool
      become: false
  post_tasks:
    - name: Remove Kubernetes manifests directory on remote
      ansible.builtin.file:
        path: "{{ k8s_manifests_dir }}"
        state: absent
      become: false
      tags: ["apps"]
    - name: Copy Kubernetes manifests to remote
      ansible.builtin.copy:
        src: k8s/
        dest: "{{ k8s_manifests_dir }}/"
        directory_mode: "0755"
        mode: "0644"
      become: false
      tags: ["apps"]
    - name: Template Honeygain Secret on remote
      ansible.builtin.template:
        src: k8s/miners/honeygain/secret.yaml.j2
        dest: "{{ k8s_manifests_dir }}/miners/honeygain/secret.yaml"
        mode: "0600"
      become: false
      tags: ["apps"]
    - name: Collect namespace manifests
      ansible.builtin.find:
        paths: "{{ k8s_manifests_dir }}/namespaces"
        patterns:
          - "*.yml"
          - "*.yaml"
        file_type: file
        recurse: true
      register: k8s_namespace_manifests
      become: false
      tags: ["apps"]
    - name: Apply K8s namespaces
      kubernetes.core.k8s:
        src: "{{ item.path }}"
        kubeconfig: "/home/{{ ansible_user }}/.kube/config"
        state: present
      loop: "{{ k8s_namespace_manifests.files | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path }}"
      when: k8s_namespace_manifests.files | length > 0
      become: false
      tags: ["apps"]
    - name: Determine if GPU manifests should be deployed
      ansible.builtin.set_fact:
        should_deploy_gpu_manifests: >-
          {{

            nvidia_gpu_cluster_enabled | default(false)
          }}
      tags: ["apps"]
    - name: Collect Honeygain manifests
      ansible.builtin.find:
        paths: "{{ k8s_manifests_dir }}/miners/honeygain"
        patterns:
          - "*.yml"
          - "*.yaml"
        file_type: file
        recurse: true
      register: k8s_honeygain_manifests
      become: false
      tags: ["apps"]
    - name: Apply Honeygain workload
      kubernetes.core.k8s:
        src: "{{ item.path }}"
        kubeconfig: "/home/{{ ansible_user }}/.kube/config"
        state: present
      loop: "{{ k8s_honeygain_manifests.files | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path }}"
      when: k8s_honeygain_manifests.files | length > 0
      become: false
      tags: ["apps"]
    - name: Collect Unmineable (CPU) manifests
      ansible.builtin.find:
        paths: "{{ k8s_manifests_dir }}/miners/unmineable"
        patterns:
          - "*.yml"
          - "*.yaml"
        file_type: file
        recurse: true
      register: k8s_unmineable_cpu_manifests
      become: false
      tags: ["apps"]
    - name: Apply Unmineable (CPU)
      kubernetes.core.k8s:
        src: "{{ item.path }}"
        kubeconfig: "/home/{{ ansible_user }}/.kube/config"
        state: present
      loop: "{{ k8s_unmineable_cpu_manifests.files | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path }}"
      when: k8s_unmineable_cpu_manifests.files | length > 0
      become: false
      tags: ["apps"]
    - name: Collect Unmineable (GPU) manifests
      ansible.builtin.find:
        paths: "{{ k8s_manifests_dir }}/miners/unmineable-gpu"
        patterns:
          - "*.yml"
          - "*.yaml"
        file_type: file
        recurse: true
      register: k8s_unmineable_gpu_manifests
      become: false
      when: should_deploy_gpu_manifests | bool
      tags: ["apps"]
    - name: Apply Unmineable (GPU)
      kubernetes.core.k8s:
        src: "{{ item.path }}"
        kubeconfig: "/home/{{ ansible_user }}/.kube/config"
        state: present
      loop: "{{ k8s_unmineable_gpu_manifests.files | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path }}"
      when:
        - should_deploy_gpu_manifests | bool
        - k8s_unmineable_gpu_manifests.files | length > 0
      become: false
      tags: ["apps"]
