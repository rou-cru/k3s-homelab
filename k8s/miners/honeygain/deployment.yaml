apiVersion: apps/v1
kind: Deployment
metadata:
  name: honeygain
  namespace: miners
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: honeygain
  template:
    metadata:
      labels:
        app: honeygain
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: "miner.network"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: miner.network
                    operator: In
                    values: ["true"]
      containers:
        - name: honeygain
          image: honeygain/honeygain:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: honeygain-config
            - secretRef:
                name: honeygain-secret
          command: ["honeygain"]
          args:
            - "-tou-accept"
            - "-email"
            - "$(HONEYGAIN_EMAIL)"
            - "-pass"
            - "$(HONEYGAIN_PASS)"
            - "-device"
            - "$(HONEYGAIN_DEVICE)"
