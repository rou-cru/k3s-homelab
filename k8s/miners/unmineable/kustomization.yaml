---
namespace: miners
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml

configMapGenerator:
  - name: unmineable-script
    files:
      - entrypoint.sh
  - name: unmineable-config
    envs:
      - miner.env

secretGenerator:
  - name: unmineable-secret
    envs:
      - secret.env
