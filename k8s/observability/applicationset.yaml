---
# ArgoCD ApplicationSet for Observability Stack
# Auto-discovers and deploys monitoring/logging applications from k8s/observability/
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/YOUR_USERNAME/k3s-homelab.git  # TODO: Replace with your repo URL
        revision: HEAD
        directories:
          - path: k8s/observability/*
          - path: k8s/observability/governance
            exclude: true   # Governance deployed separately
          - path: k8s/observability/infrastructure
            exclude: true   # Infrastructure deployed via bootstrap
  template:
    metadata:
      name: '{{path.basename}}'
      labels:
        stack: observability
    spec:
      project: observability
      source:
        repoURL: https://github.com/YOUR_USERNAME/k3s-homelab.git  # TODO: Replace with your repo URL
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        name: in-cluster
        namespace: observability
      syncPolicy:
        automated:
          prune: true      # Remove resources when deleted from Git
          selfHeal: true   # Auto-correct drift from desired state
        syncOptions:
          - CreateNamespace=false  # Namespace created by governance
          - PruneLast=true         # Delete resources last to avoid dependency issues
