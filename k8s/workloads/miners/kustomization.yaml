---
# Kustomization for cryptocurrency mining workloads
# Deploys CPU miner, GPU miner, and bandwidth sharing applications
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workloads

resources:
  - configmaps.yaml      # Mining pool and miner configuration
  - cpu-miner.yaml       # CPU-based XEL cryptocurrency miner
  - gpu-miner.yaml       # GPU-based XEL cryptocurrency miner
  - honeygain.yaml       # Bandwidth sharing for passive income

commonLabels:
  stack: workloads
  app.kubernetes.io/part-of: miners  # Identifies all resources as part of mining stack
