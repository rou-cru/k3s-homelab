---
# Centralized configuration for cryptocurrency mining pools
apiVersion: v1
kind: ConfigMap
metadata:
  name: mining-pools
  namespace: workloads
data:
  # Kryptex pool configuration for XEL (Elastic) cryptocurrency
  KRYPTEX_XEL_HOST: xel-us.kryptex.network
  KRYPTEX_XEL_PORT: "7019"
  KRYPTEX_XEL_SCHEME: stratum+tcp
  # Unmineable pool for Autolykos algorithm (ERG/Conflux)
  UNMINEABLE_AUTOLYKOS_HOST: autolykos.unmineable.com
  UNMINEABLE_AUTOLYKOS_PORT: "3333"
  UNMINEABLE_AUTOLYKOS_SCHEME: stratum+ssl
  # Unmineable pool for XelisHash algorithm
  UNMINEABLE_XELISHASH_HOST: xelishash.unmineable.com
  UNMINEABLE_XELISHASH_PORT: "3333"
  UNMINEABLE_XELISHASH_SCHEME: stratum+ssl
---
# CPU miner configuration for XEL cryptocurrency mining
apiVersion: v1
kind: ConfigMap
metadata:
  name: cpu-miner-config
  namespace: workloads
data:
  # XelisHash algorithm optimized for CPU mining
  MINING_ALGO: xelishashv3
  # Target cryptocurrency (Elastic - XEL)
  MINING_COIN: XEL
  # Referral code for mining pool rewards
  REFERRAL_CODE: 18ps-7t5s
  # Worker identification for pool statistics
  MINING_WORKER_NAME: home-miner
  # Number of CPU threads allocated for mining
  MINING_THREADS: "8"
  # CPU core affinity mask (hexadecimal) for optimal performance
  CPU_AFFINITY_MASK: "0x00FF0000"
  # Developer fee percentage for mining software
  DEV_FEE: "1.0"
---
# GPU miner configuration for XEL cryptocurrency mining with thermal management
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-miner-config
  namespace: workloads
data:
  # XelisHash algorithm for GPU mining
  MINING_ALGO: xelishashv3
  # Target cryptocurrency (Elastic - XEL)
  MINING_COIN: XEL
  # Pool password (typically 'x' for most mining pools)
  MINING_PASS: x
  # Worker identification for pool statistics
  MINING_WORKER_NAME: k8s-gpu
  # Referral code for mining pool rewards
  REFERRAL_CODE: 18ps-7t5s
  # GPU core clock offset (0 = no overclocking)
  GPU_CORE_OFFSET: "0"
  # GPU memory clock offset (0 = no overclocking)
  GPU_MEM_OFFSET: "0"
  # Minimum GPU core temperature for operation (Celsius)
  GPU_TEMP_CORE_MIN: "55"
  # Maximum GPU core temperature before throttling (Celsius)
  GPU_TEMP_CORE_MAX: "80"
  # Minimum GPU memory temperature (Celsius)
  GPU_TEMP_MEM_MIN: "70"
  # Maximum GPU memory temperature before throttling (Celsius)
  GPU_TEMP_MEM_MAX: "85"
---
# Honeygain configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: honeygain-config
  namespace: workloads
data:
  HONEYGAIN_EMAIL: ""  # Set via ExternalSecret or override
  HONEYGAIN_DEVICE: bandwidth-miner
