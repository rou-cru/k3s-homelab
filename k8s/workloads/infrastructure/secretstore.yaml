---
# SecretStore configuration for OCI Vault backend
# Provides namespace-scoped access to OCI Vault for mining wallet secrets
# Uses namespace-scoped (not cluster-scoped) for security isolation
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: oci-vault
  namespace: workloads
spec:
  provider:
    oracle:
      vault: "{{ oci_vault_ocid }}"  # Templated by ArgoCD/Kustomize from cluster config
      region: "{{ oci_region }}"
      auth:
        secretRef:
          privatekey:
            name: oci-auth
            key: privateKey
          fingerprint:
            name: oci-auth
            key: fingerprint
          tenancy:
            name: oci-auth
            key: tenancy
          user:
            name: oci-auth
            key: user
