# GPU miner configuration for XEL cryptocurrency mining with thermal management
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-miner-config
  namespace: miners
data:
  # XelisHash algorithm for GPU mining (same as CPU for XEL)
  MINING_ALGO: xelishashv3
  # Target cryptocurrency (Elastic - XEL)
  MINING_COIN: XEL
  # Pool password (typically 'x' for most mining pools)
  MINING_PASS: x
  # Worker identification for pool statistics
  MINING_WORKER_NAME: k8s-gpu
  # Referral code for mining pool rewards
  REFERRAL_CODE: 18ps-7t5s
  # GPU core clock offset (0 = no overclocking)
  GPU_CORE_OFFSET: "0"
  # GPU memory clock offset (0 = no overclocking)
  GPU_MEM_OFFSET: "0"
  # Minimum GPU core temperature for operation (Celsius)
  GPU_TEMP_CORE_MIN: "55"
  # Maximum GPU core temperature before throttling (Celsius)
  GPU_TEMP_CORE_MAX: "80"
  # Minimum GPU memory temperature (Celsius)
  GPU_TEMP_MEM_MIN: "70"
  # Maximum GPU memory temperature before throttling (Celsius)
  GPU_TEMP_MEM_MAX: "85"
