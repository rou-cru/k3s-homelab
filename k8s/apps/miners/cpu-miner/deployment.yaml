# CPU cryptocurrency miner deployment using host network for optimal performance
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-miner
  namespace: miners
  labels:
    app: cpu-miner
spec:
  replicas: 1
  strategy:
    type: Recreate  # Ensure clean restart without overlapping instances
  selector:
    matchLabels:
      app: cpu-miner
  template:
    metadata:
      labels:
        app: cpu-miner
    spec:
      hostNetwork: true  # Use host network for direct hardware access
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: cpu-miner
          image: roucru/k3s-cpu-miner:tnn
          imagePullPolicy: Always
          securityContext:
            privileged: true  # Required for CPU affinity and MSR access
            runAsUser: 0  # Run as root for hardware control
          env:
            # Mining pool configuration from centralized ConfigMap
            - name: MINING_POOL_HOST
              valueFrom:
                configMapKeyRef:
                  name: mining-pools
                  key: KRYPTEX_XEL_HOST
            # Pool port for XEL cryptocurrency mining
            - name: MINING_POOL_PORT
              valueFrom:
                configMapKeyRef:
                  name: mining-pools
                  key: KRYPTEX_XEL_PORT
            # Connection scheme (stratum) for mining pool
            - name: MINING_POOL_SCHEME
              valueFrom:
                configMapKeyRef:
                  name: mining-pools
                  key: KRYPTEX_XEL_SCHEME
            # Mining algorithm configuration (RandomX for CPU)
            - name: MINING_ALGO
              valueFrom:
                configMapKeyRef:
                  name: cpu-miner-config
                  key: MINING_ALGO
            # Target cryptocurrency for mining (XEL)
            - name: MINING_COIN
              valueFrom:
                configMapKeyRef:
                  name: cpu-miner-config
                  key: MINING_COIN
            # Referral code for mining pool rewards
            - name: REFERRAL_CODE
              valueFrom:
                configMapKeyRef:
                  name: cpu-miner-config
                  key: REFERRAL_CODE
            # Worker identification for pool statistics
            - name: MINING_WORKER_NAME
              valueFrom:
                configMapKeyRef:
                  name: cpu-miner-config
                  key: MINING_WORKER_NAME
            # Mining pool type identifier
            - name: POOL_TYPE
              value: "kryptex"
            # CPU thread allocation for mining
            - name: MINING_THREADS
              valueFrom:
                configMapKeyRef:
                  name: cpu-miner-config
                  key: MINING_THREADS
            # CPU core affinity mask for optimal performance
            - name: CPU_AFFINITY_MASK
              valueFrom:
                configMapKeyRef:
                  name: cpu-miner-config
                  key: CPU_AFFINITY_MASK
            # Developer fee percentage for mining software
            - name: DEV_FEE
              valueFrom:
                configMapKeyRef:
                  name: cpu-miner-config
                  key: DEV_FEE
            # Wallet address for mining rewards from secure Secret
            - name: WALLET_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: mining-wallets
                  key: XEL_WALLET
          resources:
            requests:
              cpu: "8"  # Reserve 8 CPU cores for mining
              memory: 3Gi
              hugepages-2Mi: 2560Mi  # Allocate hugepages for RandomX algorithm
              ephemeral-storage: 100Mi
            limits:
              cpu: "8"  # Limit to 8 CPU cores to prevent system overload
              memory: 3Gi
              hugepages-2Mi: 2560Mi
              ephemeral-storage: 200Mi
          volumeMounts:
            - name: dev-cpu
              mountPath: /dev/cpu  # Access CPU devices for affinity control
            - name: hugepages
              mountPath: /dev/hugepages  # Mount hugepages for mining performance
      volumes:
        - name: dev-cpu
          hostPath:
            path: /dev/cpu
            type: Directory
        - name: hugepages
          emptyDir:
            medium: HugePages-2Mi  # Pre-allocate hugepages for RandomX mining
