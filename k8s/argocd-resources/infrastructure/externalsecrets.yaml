---
# ExternalSecret for mining wallets stored in OCI Vault
# Modern replacement for Kustomize secretGenerator pattern
# Automatically syncs wallet addresses from OCI Vault to Kubernetes secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mining-wallets
  namespace: workloads
spec:
  refreshInterval: 1h  # Balance between security (fresh secrets) and API rate limits
  secretStoreRef:
    name: oci-vault
    kind: SecretStore
  target:
    name: mining-wallets
    creationPolicy: Owner  # ESO manages full lifecycle of generated secret
  data:
    - secretKey: XEL_WALLET
      remoteRef:
        key: mining-xel-wallet  # OCI Vault secret name containing XEL wallet address
---
# ExternalSecret for Honeygain bandwidth sharing credentials
# Stores Honeygain password in OCI Vault instead of Git
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: honeygain-credentials
  namespace: workloads
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: SecretStore
  target:
    name: honeygain-secret
    creationPolicy: Owner
  data:
    - secretKey: HONEYGAIN_PASS
      remoteRef:
        key: honeygain-password  # OCI Vault secret name
