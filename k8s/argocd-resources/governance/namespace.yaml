---
# Governance resources for workloads namespace
# Implements resource controls and defaults for mining workloads
apiVersion: v1
kind: Namespace
metadata:
  name: workloads
  labels:
    app.kubernetes.io/managed-by: argocd
    stack: workloads
---
# ResourceQuota prevents resource exhaustion by mining workloads
# Limits total resources consumable in workloads namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workloads-quota
  namespace: workloads
spec:
  hard:
    requests.cpu: "16"      # Reserve 16 cores (prevents oversubscription)
    requests.memory: 32Gi   # Reserve 32GB RAM
    limits.cpu: "20"        # Max 20 cores (allows burst for miners)
    limits.memory: 40Gi     # Max 40GB RAM
    persistentvolumeclaims: "10"  # Limit PV claims
    pods: "20"              # Max 20 pods in namespace
---
# LimitRange enforces default resource constraints
# Prevents pods without resource limits from consuming entire node
apiVersion: v1
kind: LimitRange
metadata:
  name: workloads-limits
  namespace: workloads
spec:
  limits:
    - default:
        cpu: "1"            # Default limit: 1 core
        memory: 1Gi         # Default limit: 1GB RAM
      defaultRequest:
        cpu: "100m"         # Default request: 0.1 cores
        memory: 128Mi       # Default request: 128MB RAM
      type: Container
