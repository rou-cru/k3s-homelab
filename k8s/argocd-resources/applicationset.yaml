---
# ArgoCD ApplicationSet for Workloads Stack
# Auto-discovers and deploys user workloads from k8s/workloads/
# Includes cryptocurrency miners, Honeygain, and other applications
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/rou-cru/k3s-homelab.git
        revision: HEAD
        directories:
          - path: k8s/apps/*/*  # Mining apps are nested in subfolders like miners/cpu-miner
          - path: k8s/workloads/* # Keep for backward compatibility if folder reappears
          - path: k8s/workloads/governance
            exclude: true
          - path: k8s/workloads/infrastructure
            exclude: true
  template:
    metadata:
      name: '{{path.basename}}'
      labels:
        stack: workloads
    spec:
      project: workloads
      source:
        repoURL: https://github.com/rou-cru/k3s-homelab.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        name: in-cluster
        namespace: workloads
      syncPolicy:
        automated:
          prune: true      # Remove workloads when deleted from Git
          selfHeal: true   # Auto-correct workload drift
        syncOptions:
          - CreateNamespace=false  # Namespace created by governance
          - PruneLast=true         # Delete workloads last to avoid disruption
