---
# Kustomization for Cilium network security policies
# Implements zero-trust network segmentation across cluster stacks
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - akash-isolation.yaml    # Zero-trust isolation for Akash tenants
  - trusted-zones.yaml      # Allow rules for trusted infrastructure

commonLabels:
  stack: security
  app.kubernetes.io/part-of: network-policies  # Identifies all policy resources
