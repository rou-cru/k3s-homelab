---
# Kustomization for Kyverno policy enforcement
# Kyverno controller deployed via Helm (see applicationset.yaml)
# This applies ClusterPolicies for runtime security
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - policies.yaml  # ClusterPolicies for gVisor, PriorityClasses, resource limits

commonLabels:
  stack: security
  app.kubernetes.io/part-of: kyverno  # Policy engine for runtime security
