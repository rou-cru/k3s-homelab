# Kyverno Helm values
# Deploys via ArgoCD ApplicationSet

# High availability for policy enforcement
replicaCount: 1  # Single node cluster

# Resource limits
resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Webhook configuration
webhookConfig:
  failurePolicy: Fail  # Reject if Kyverno is unavailable

# Background scan for existing resources
backgroundController:
  enabled: true
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

# Reports for policy violations
reportsController:
  enabled: true
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
