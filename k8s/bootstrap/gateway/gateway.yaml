---
# Gateway API resources for k3s-homelab
# Cilium acts as the Gateway controller
# See: .serena/memories/public_exposure_plan.md

# GatewayClass - Cilium implementation
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium
spec:
  controllerName: io.cilium/gateway-controller
---
# Main Gateway - Public entry point on VPS
# Binds to VPS public IP (74.208.250.178)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: kube-system
  annotations:
    # Cilium will create a LoadBalancer service
    # On VPS, this binds to the public IP
    io.cilium/lb-ipam-ips: "74.208.250.178"
spec:
  gatewayClassName: cilium
  listeners:
    # HTTP listener (redirects to HTTPS)
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # HTTPS listener for internal services (TLS termination)
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.homelab.local"  # Replace with your domain
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All
    # TLS passthrough listener for Akash
    # SNI-based routing to Akash Nginx Ingress
    - name: akash-passthrough
      protocol: TLS
      port: 443
      hostname: "*.akash.network"
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              stack: akash
