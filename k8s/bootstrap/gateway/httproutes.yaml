---
# HTTPRoutes for internal services with TLS termination
# Cilium Gateway handles TLS termination, forwards plaintext to backend services
# See: gateway.yaml for TLS certificate configuration

# ArgoCD UI route - HTTPS terminated at Gateway, HTTP to backend
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: public-gateway
      namespace: kube-system
      sectionName: https  # Matches HTTPS listener on Gateway
  hostnames:
    - "argocd.homelab.local"  # Replace with your actual domain
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80  # Backend uses HTTP (TLS terminated at Gateway)
---
# Grafana UI route (when observability stack deployed)
# Same TLS termination pattern - HTTPS at edge, HTTP internally
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs:
    - name: public-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "grafana.homelab.local"  # Replace with your actual domain
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
