---
# Cilium Egress Gateway Configuration for Akash Provider
# Routes Akash tenant egress traffic through VPS public IP for reputation management
# Akash providers require stable, reputable IP addresses for tenant deployments
# See: .serena/memories/public_exposure_plan.md

# CiliumEgressGatewayPolicy performs SNAT on Akash tenant traffic
# All egress from akash-services namespace exits through VPS public IP (74.208.250.178)
apiVersion: cilium.io/v2
kind: CiliumEgressGatewayPolicy
metadata:
  name: akash-egress-vps
spec:
  # Select all pods in Akash namespace (tenant workloads)
  selectors:
    - podSelector:
        matchLabels:
          io.kubernetes.pod.namespace: akash-services
  destinationCIDRs:
    - 0.0.0.0/0  # All outbound internet traffic
  excludedCIDRs:
    # Exclude internal cluster CIDRs - preserve direct pod-to-pod communication
    - 10.42.0.0/16   # K3s pod network
    - 10.43.0.0/16   # K3s service network
    - 100.64.0.0/10  # Tailscale VPN network
    - 192.168.0.0/16 # Local LAN network
  egressGateway:
    # VPS node must be labeled: kubectl label node k3s-vps egress-gateway=vps
    nodeSelector:
      matchLabels:
        egress-gateway: "vps"
    # Use VPS public interface for source NAT
    interface: eth0  # VPS primary network interface
---
# Documentation ConfigMap for Egress Gateway setup
# Provides manual verification steps for egress gateway functionality
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-gateway-readme
  namespace: kube-system
data:
  README: |
    Egress Gateway Configuration
    ============================

    The VPS node (k3s-vps) must be labeled to act as egress gateway:

      kubectl label node k3s-vps egress-gateway=vps

    This allows Akash tenant traffic to be SNAT'd to the VPS public IP
    (74.208.250.178) for improved IP reputation with Akash providers.

    Verify egress gateway is working:

      kubectl exec -n akash-services <pod> -- curl ifconfig.me

    Should return: 74.208.250.178
