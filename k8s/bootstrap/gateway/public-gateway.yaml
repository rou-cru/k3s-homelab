apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: networking
  # Annotations removed: io.cilium/service-type and nodeipam not needed with hostNetwork mode
spec:
  gatewayClassName: cilium
  # Explicit address for hostNetwork mode (VPS public IP)
  addresses:
    - type: IPAddress
      value: "74.208.250.178"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.roura.xyz"
      tls:
        mode: Terminate
        certificateRefs:
          - name: "cloudflare-ca-roura-xyz"
      allowedRoutes:
        namespaces:
          from: All
---
# HTTP to HTTPS redirect for all *.roura.xyz traffic
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: networking
spec:
  parentRefs:
    - name: public-gateway
      sectionName: http
  hostnames:
    - "*.roura.xyz"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
