apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k3s-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: k3s-ca
  secretName: k3s-ca-secret
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: k3s-selfsigned-issuer
    kind: ClusterIssuer
