# Base values for cert-manager
crds:
  enabled: true
  keep: true

# Controller configuration
replicaCount: 1
podDisruptionBudget:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

# Webhook configuration
webhook:
  replicaCount: 1
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# CA Injector configuration
cainjector:
  replicaCount: 1
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
