---
# PriorityClasses for k3s-homelab
# Implements the "Pyramid of Survival" scheduler strategy
# See: .serena/memories/scheduler_priority_plan.md

# Level 2: IT Operations & Data Safety (High)
# Scope: Longhorn, Vault, Cert-Manager, Kyverno, Gateway Controllers
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: priority-ops-critical
value: 1000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "IT Operations - Storage, security, certificates. Never preempted by workloads."
---
# Level 3: Business Revenue / SLA (Medium-High)
# Scope: Akash Tenant Workloads
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: priority-akash-prod
value: 500000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Akash production workloads - Revenue generating, SLA-bound."
---
# Level 4: Observability (Medium)
# Scope: Prometheus, Grafana, Loki
# Tradeoff: "Fly blind is better than crash land" - sacrificed during resource pressure
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: priority-observability
value: 100000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Observability stack - Prometheus, Grafana, Loki. Preemptable by SLA workloads."
---
# Level 5: Background / Scavenger (Disposable)
# Scope: Mining (CPU/GPU), Batch Jobs, Experiments
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: priority-background
value: 1000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Background/scavenger workloads - Mining, batch jobs. Immediate preemption on demand."
