# Base values for Akash Ingress NGINX
controller:
  ingressClassResource:
    name: akash-nginx
    enabled: true
    default: false
  ingressClass: akash-nginx
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  kind: DaemonSet
  service:
    enabled: false
  config:
    allow-snippet-annotations: "false"
    proxy-buffer-size: "16k"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
