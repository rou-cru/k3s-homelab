apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-admin-pass
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: admin.password
      remoteRef:
        key: argocd-admin-pass
