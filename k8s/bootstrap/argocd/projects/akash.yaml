apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: akash
  namespace: argocd
spec:
  description: Akash provider and tenant workloads
  sourceRepos:
    - '*'
  destinations:
    - namespace: akash-services
      name: in-cluster
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
