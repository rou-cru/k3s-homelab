---
# GRPCRoute for ArgoCD CLI (gRPC over HTTP/2)
# This enables the argocd CLI to communicate with the server via gRPC
# Workaround for Cilium issue #43679: using separate port (8080) from HTTPRoute (80)
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: argocd-server-grpc
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server-grpc
    app.kubernetes.io/component: route
    app.kubernetes.io/part-of: argocd
spec:
  parentRefs:
    - name: public-gateway
      namespace: networking
      sectionName: https
  hostnames:
    - "argocd.roura.xyz"
  rules:
    - backendRefs:
        - name: argocd-server
          port: 8080
      matches:
        - headers:
            - name: Content-Type
              type: RegularExpression
              value: "^application/grpc.*$"
