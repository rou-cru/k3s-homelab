# @docsible Sets persistent system hostname to match inventory
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  when: not ansible_check_mode

# @docsible Retrieves available space on root filesystem (KB)
- name: Check disk space
  ansible.builtin.shell:
    cmd: df --output=avail / | tail -1
  register: root_disk_space
  changed_when: false
  check_mode: false

# @docsible Enforces minimum disk space requirement (Default: 20GB)
- name: Assert disk space
  ansible.builtin.assert:
    that:
      - root_disk_space.stdout | int >= (preflight_minDiskGb | int * 1024 * 1024)
    fail_msg: >-
      {{
        'Insufficient disk space on /. Required: ' ~ preflight_minDiskGb ~ 'GB, Available: '
        ~ ((root_disk_space.stdout | int / 1024 / 1024) | round(2))
        ~ 'GB'
      }}

# @docsible Enforces minimum RAM requirement (Default: 2GB)
- name: Assert memory
  ansible.builtin.assert:
    that:
      - ansible_facts['memtotal_mb'] >= preflight_minRamMb | int
    fail_msg: >-
      Insufficient memory. Required: {{ preflight_minRamMb }}MB, Available:
      {{ ansible_facts['memtotal_mb'] }}MB

# @docsible Enforces x86_64 CPU architecture
- name: Assert architecture
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == 'x86_64'
    fail_msg: "Unsupported architecture: {{ ansible_facts['architecture'] }}. Only x86_64 is supported."
