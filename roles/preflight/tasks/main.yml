---
- name: Check network connectivity
  ansible.builtin.uri:
    url: https://get.k3s.io
    method: HEAD
    timeout: 10
  register: network_check
  failed_when: false
  changed_when: false

- name: Fail if no network connectivity
  ansible.builtin.fail:
    msg: "No network connectivity detected. Cannot proceed with installation."
  when: network_check.status is not defined or network_check.status != 200

- name: Assert Disk Space (Root Partition > 20GB)
  ansible.builtin.assert:
    that:
      - item.size_available > 21474836480
    fail_msg: "Insufficient disk space on {{ item.mount }}. Required: 20GB, Available: {{ (item.size_available / 1024 / 1024 / 1024) | round(2) }}GB"
  loop: "{{ ansible_mounts }}"
  when: item.mount == '/'

- name: Assert Memory (> 4GB)
  ansible.builtin.assert:
    that:
      - ansible_memtotal_mb >= 4096
    fail_msg: "Insufficient memory. Required: 4GB, Available: {{ ansible_memtotal_mb }}MB"

- name: Assert Architecture (x86_64)
  ansible.builtin.assert:
    that:
      - ansible_architecture == 'x86_64'
    fail_msg: "Unsupported architecture: {{ ansible_architecture }}. Only x86_64 is supported."

- name: Pre-flight checks passed
  ansible.builtin.debug:
    msg: "All pre-flight checks passed successfully."
