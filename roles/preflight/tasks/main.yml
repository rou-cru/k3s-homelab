---
- name: Check connectivity
  ansible.builtin.uri:
    url: https://get.k3s.io
    method: HEAD
    timeout: 10
  register: preflight_network_check
  failed_when: false
  changed_when: false
  check_mode: false
- name: Fail on disconnect
  ansible.builtin.fail:
    msg: "No network connectivity detected. Cannot proceed with installation."
  when: preflight_network_check.status is not defined or preflight_network_check.status != 200
- name: Check disk space
  ansible.builtin.shell:
    cmd: df --output=avail / | tail -1
  register: root_disk_space
  changed_when: false
  check_mode: false
- name: Assert disk space
  ansible.builtin.assert:
    that:
      - root_disk_space.stdout | int > 20971520
    fail_msg: >-
      Insufficient disk space on /. Required: 20GB,
      Available: {{ (root_disk_space.stdout | int / 1024 / 1024) | round(2) }}GB
- name: Assert memory
  ansible.builtin.assert:
    that:
      - ansible_facts['memtotal_mb'] >= 4096
    fail_msg: "Insufficient memory. Required: 4GB, Available: {{ ansible_facts['memtotal_mb'] }}MB"
- name: Assert architecture
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == 'x86_64'
    fail_msg: "Unsupported architecture: {{ ansible_facts['architecture'] }}. Only x86_64 is supported."
