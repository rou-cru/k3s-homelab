# @docsible Set system hostname
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  when: not ansible_check_mode

# @docsible Verify network connectivity to K3s download endpoint
- name: Check connectivity
  ansible.builtin.uri:
    url: https://get.k3s.io
    method: HEAD
    timeout: 10
  register: preflight_network_check
  failed_when: false
  changed_when: false
  check_mode: false
# @docsible Fail if network is unreachable
- name: Fail on disconnect
  ansible.builtin.fail:
    msg: "No network connectivity detected. Cannot proceed with installation."
  when: preflight_network_check.status is not defined or preflight_network_check.status != 200
# @docsible Check available disk space on root filesystem
- name: Check disk space
  ansible.builtin.shell:
    cmd: df --output=avail / | tail -1
  register: root_disk_space
  changed_when: false
  check_mode: false
# @docsible Validate minimum disk space requirement
- name: Assert disk space
  ansible.builtin.assert:
    that:
      - root_disk_space.stdout | int >= (preflight_minDiskGb | int * 1024 * 1024)
    fail_msg: >-
      {{
        'Insufficient disk space on /. Required: ' ~ preflight_minDiskGb ~ 'GB, Available: '
        ~ ((root_disk_space.stdout | int / 1024 / 1024) | round(2))
        ~ 'GB'
      }}
# @docsible Validate minimum memory requirement
- name: Assert memory
  ansible.builtin.assert:
    that:
      - ansible_facts['memtotal_mb'] >= preflight_minRamMb | int
    fail_msg: >-
      Insufficient memory. Required: {{ preflight_minRamMb }}MB, Available:
      {{ ansible_facts['memtotal_mb'] }}MB
# @docsible Validate x86_64 architecture
- name: Assert architecture
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == 'x86_64'
    fail_msg: "Unsupported architecture: {{ ansible_facts['architecture'] }}. Only x86_64 is supported."
