- name: Check connectivity
  ansible.builtin.uri:
    url: https://get.k3s.io
    method: HEAD
    timeout: 10
  register: preflight_network_check
  failed_when: false
  changed_when: false
  check_mode: false
- name: Fail on disconnect
  ansible.builtin.fail:
    msg: "No network connectivity detected. Cannot proceed with installation."
  when: preflight_network_check.status is not defined or preflight_network_check.status != 200
- name: Check disk space
  ansible.builtin.shell:
    cmd: df --output=avail / | tail -1
  register: root_disk_space
  changed_when: false
  check_mode: false
- name: Assert disk space
  ansible.builtin.assert:
    that:
      - root_disk_space.stdout | int >= (preflight_min_disk_gb | int * 1024 * 1024)
    fail_msg: >-
      {{
        'Insufficient disk space on /. Required: ' ~ preflight_min_disk_gb ~ 'GB, Available: '
        ~ ((root_disk_space.stdout | int / 1024 / 1024) | round(2))
        ~ 'GB'
      }}
- name: Assert memory
  ansible.builtin.assert:
    that:
      - ansible_facts['memtotal_mb'] >= preflight_min_ram_mb | int
    fail_msg: >-
      Insufficient memory. Required: {{ preflight_min_ram_mb }}MB, Available:
      {{ ansible_facts['memtotal_mb'] }}MB
- name: Assert architecture
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == 'x86_64'
    fail_msg: "Unsupported architecture: {{ ansible_facts['architecture'] }}. Only x86_64 is supported."
