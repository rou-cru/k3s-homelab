# Validaciones previas de infraestructura y recursos
- name: Check network connectivity
  ansible.builtin.uri:
    url: https://get.k3s.io
    method: HEAD
    timeout: 10
  register: preflight_network_check
  failed_when: false
  changed_when: false
  check_mode: false
- name: Fail if no network connectivity
  ansible.builtin.fail:
    msg: "No network connectivity detected. Cannot proceed with installation."
  when: preflight_network_check.status is not defined or preflight_network_check.status != 200
- name: Get actual disk space on root partition
  ansible.builtin.shell:
    cmd: df --output=avail / | tail -1
  register: root_disk_space
  changed_when: false
  check_mode: false
- name: Assert Disk Space (Root Partition > 20GB)
  ansible.builtin.assert:
    that:
      - root_disk_space.stdout | int > 20971520
    fail_msg: >-
      Insufficient disk space on /. Required: 20GB, Available: {{ (root_disk_space.stdout | int / 1024 / 1024) | round(2) }}GB
- name: Assert Memory (> 4GB)
  ansible.builtin.assert:
    that:
      - ansible_facts['memtotal_mb'] >= 4096
    fail_msg: "Insufficient memory. Required: 4GB, Available: {{ ansible_facts['memtotal_mb'] }}MB"
- name: Assert Architecture (x86_64)
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == 'x86_64'
    fail_msg: "Unsupported architecture: {{ ansible_facts['architecture'] }}. Only x86_64 is supported."
- name: Pre-flight checks passed
  ansible.builtin.debug:
    msg: "All pre-flight checks passed successfully."
