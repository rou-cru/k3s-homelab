# Installation of gVisor (runsc)
- name: Install runsc binary
  ansible.builtin.get_url:
    url: https://storage.googleapis.com/gvisor/releases/release/latest/x86_64/runsc
    dest: /usr/local/bin/runsc
    mode: '0755'
    owner: root
    group: root
    checksum: sha512:https://storage.googleapis.com/gvisor/releases/release/latest/x86_64/runsc.sha512

# Register gVisor as an available runtime for the cluster
- name: Add gVisor to additional runtimes list
  ansible.builtin.set_fact:
    containerd_additional_runtimes: "{{ containerd_additional_runtimes | default([]) + ['runsc'] }}"
  tags: always

# Use K3s auto-deploy manifests directory for the RuntimeClass
- name: Ensure K3s manifests directory exists
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    mode: '0755'

- name: Deploy gVisor RuntimeClass manifest
  ansible.builtin.copy:
    src: runtime-class.yaml
    dest: /var/lib/rancher/k3s/server/manifests/gvisor-runtime-class.yaml
    mode: '0644'