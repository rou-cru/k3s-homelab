# Use K3s auto-deploy manifests directory for the RuntimeClass
- name: Ensure K3s manifests directory exists
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    mode: '0755'
    owner: root
    group: root
  when:
    - "'k3s_server' in group_names"
    - gvisor_install | bool

- name: Deploy gVisor RuntimeClass manifest
  ansible.builtin.copy:
    src: runtime-class.yaml
    dest: /var/lib/rancher/k3s/server/manifests/gvisor-runtime-class.yaml
    mode: '0644'
    owner: root
    group: root
  when:
    - "'k3s_server' in group_names"
    - gvisor_install | bool
