# @docsible Registers gVisor RuntimeClass (requires runsc on nodes)
- name: Apply gVisor RuntimeClass
  kubernetes.core.k8s:
    src: "{{ k8s_manifestsDir }}/bootstrap/runtimes/gvisor/runtime-class.yaml"
    kubeconfig: "{{ kubeconfig }}"
    state: present
  when: gvisor_install | default(true) | bool
