# @docsible Check for existing server uninstall script
- name: Check K3s uninstall script
  ansible.builtin.stat:
    path: /usr/local/bin/k3s-uninstall.sh
  register: k3s_server_uninstall_script

# @docsible Check for existing agent uninstall script
- name: Check K3s agent uninstall script
  ansible.builtin.stat:
    path: /usr/local/bin/k3s-agent-uninstall.sh
  register: k3s_agent_uninstall_script

# @docsible Uninstall K3s server if recreate requested
- name: Uninstall K3s (Server)
  ansible.builtin.command: /usr/local/bin/k3s-uninstall.sh
  when:
    - k3s_recreate | bool
    - k3s_server_uninstall_script.stat.exists
    - not ansible_check_mode
  changed_when: true

# @docsible Uninstall K3s agent if recreate requested
- name: Uninstall K3s (Agent)
  ansible.builtin.command: /usr/local/bin/k3s-agent-uninstall.sh
  when:
    - k3s_recreate | bool
    - k3s_agent_uninstall_script.stat.exists
    - not ansible_check_mode
  changed_when: true

# @docsible Remove K3s data directories
- name: Cleanup K3s directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/rancher/k3s
    - /etc/rancher/k3s
    - /var/lib/kubelet
    - /var/lib/cni
    - /etc/cni/net.d
  when:
    - k3s_recreate | bool

# @docsible Create K3s configuration directory
- name: Ensure K3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0750"

# @docsible Configure container registry authentication
- name: Configure K3s registry auth
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: /etc/rancher/k3s/registries.yaml
    mode: "0600"
  no_log: true
  notify: "{{ k3s_commonRestartHandler | default('Restart k3s') }}"
  when:
    - k3s_commonRegistryAuths is defined
    - k3s_commonRegistryAuths | length > 0

# @docsible Removes stale registry auth file when no registry auths are configured
- name: Remove K3s registry auth when unset
  ansible.builtin.file:
    path: /etc/rancher/k3s/registries.yaml
    state: absent
  notify: "{{ k3s_commonRestartHandler | default('Restart k3s') }}"
  when:
    - k3s_commonRegistryAuths is not defined or k3s_commonRegistryAuths | length == 0

# @docsible Create CNI configuration directory
- name: Ensure CNI config directory exists
  ansible.builtin.file:
    path: "{{ k3s_cniConfDir }}"
    state: directory
    mode: "0750"

# @docsible Create CNI binaries directory
- name: Ensure CNI bin directory exists
  ansible.builtin.file:
    path: "{{ k3s_cniBinDir }}"
    state: directory
    mode: "0750"

# @docsible Create containerd configuration directory
- name: Ensure K3s agent etc directory exists (for containerd)
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/etc/containerd
    state: directory
    mode: "0750"

# @docsible Deploy containerd configuration template
- name: Deploy containerd configuration template
  ansible.builtin.template:
    src: containerd-config.toml.tmpl.j2
    dest: /var/lib/rancher/k3s/agent/etc/containerd/config.toml.tmpl
    mode: "0640"
  notify: "{{ k3s_commonRestartHandler | default('Restart k3s') }}"
