# main.yml - K3s Common logic
- name: Ensure K3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Ensure registries.d exists
  ansible.builtin.file:
    path: /etc/rancher/k3s/registries.d
    state: directory
    mode: "0755"

- name: Deploy registries.yaml
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: /etc/rancher/k3s/registries.yaml
    mode: "0600"
  notify: "{{ k3s_commonRestartHandler | default('Restart k3s') }}"
  when:
    - k3s_commonRegistryAuths is defined
    - k3s_commonRegistryAuths | length > 0

- name: Deploy containerd-config.toml
  ansible.builtin.template:
    src: containerd-config.toml.tmpl.j2
    dest: /etc/rancher/k3s/containerd-config.toml.tmpl
    mode: "0644"
  when: k3s_commonContainerdAdditionalRuntimes | default([]) | length > 0

- name: Create containerd scripts dir
  ansible.builtin.file:
    path: /usr/local/bin/containerd-scripts
    state: directory
    mode: "0755"
  when: k3s_commonContainerdAdditionalRuntimes | default([]) | length > 0

- name: Deploy runtime check script
  ansible.builtin.template:
    src: check-runtime.sh.j2
    dest: /usr/local/bin/containerd-scripts/check-runtime.sh
    mode: "0755"
  when: k3s_commonContainerdAdditionalRuntimes | default([]) | length > 0

- name: Ensure k3s service override dir
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    mode: "0755"
  when: k3s_commonContainerdAdditionalRuntimes | default([]) | length > 0

- name: Reload systemd and restart k3s
  ansible.builtin.systemd:
    daemon_reload: true
  when: k3s_commonContainerdAdditionalRuntimes | default([]) | length > 0
  notify: "{{ k3s_commonRestartHandler | default('Restart k3s') }}"
