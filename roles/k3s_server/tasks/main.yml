# @docsible Validates IP_tailscale follows CGNAT range (100.x.x.x)
- name: Validate Tailscale IP
  ansible.builtin.assert:
    that:
      - IP_tailscale is defined
      - IP_tailscale | length > 0
      - IP_tailscale is match('^100\.')
    fail_msg: "ERROR: Invalid IP_tailscale ({{ IP_tailscale | default('undefined') }}). Must be 100.x.x.x"

# @docsible Validates k3s_serverVersion is defined
- name: Verify K3s server version
  ansible.builtin.assert:
    that:
      - k3s_serverVersion is defined
      - k3s_serverVersion | length > 0
    fail_msg: "ERROR: k3s_serverVersion must be defined"

# @docsible Checks whether gVisor runsc binary is installed
- name: Check for runsc binary
  ansible.builtin.stat:
    path: /usr/local/bin/runsc
  register: k3s_runsc_stat

# @docsible Checks whether NVIDIA container runtime is installed
- name: Check for nvidia-container-runtime
  ansible.builtin.stat:
    path: /usr/bin/nvidia-container-runtime
  register: k3s_nvidia_runtime_stat

# @docsible Builds base list of detected containerd runtimes
- name: Build containerd runtime list
  ansible.builtin.set_fact:
    _current_runtimes: "{{ ansible_facts['k3s_commonContainerdAdditionalRuntimes'] | default([]) }}"

# @docsible Merges detected runtimes into k3s_commonContainerdAdditionalRuntimes
- name: Update containerd runtime list
  ansible.builtin.set_fact:
    k3s_commonContainerdAdditionalRuntimes: >-
      {{
        _current_runtimes
        | union(['runsc'] if k3s_runsc_stat.stat.exists else [])
        | union(['nvidia'] if k3s_nvidia_runtime_stat.stat.exists else [])
      }}

# @docsible Imports k3s_common role for shared K3s host setup
- name: Run K3s Common
  ansible.builtin.import_role:
    name: k3s_common
  vars:
    k3s_recreate: "{{ k3s_serverRecreate }}"
    k3s_commonRestartHandler: "Restart k3s"

# @docsible Ensures K3s log directory exists
- name: Ensure K3s log directory exists
  ansible.builtin.file:
    path: /var/log/k3s
    state: directory
    mode: "0755"

# @docsible Ensures K3s audit log file exists with mode 0600
- name: Ensure K3s audit log file exists with restrictive permissions
  ansible.builtin.file:
    path: /var/log/k3s/audit.log
    state: touch
    owner: root
    group: root
    mode: "0600"
    modification_time: preserve

# @docsible Renders Kubernetes audit policy for K3s server
- name: Deploy K3s audit policy
  ansible.builtin.template:
    src: audit-policy.yaml.j2
    dest: /etc/rancher/k3s/audit-policy.yaml
    mode: "0600"

# @docsible Renders K3s server config.yaml
- name: Deploy server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s
  when: not ansible_check_mode

# @docsible Downloads official K3s install script
- name: Download K3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s_install.sh
    mode: "0700"
  when: not ansible_check_mode

# @docsible Installs K3s server with configured flags
- name: Install K3s server
  ansible.builtin.shell: |
    INSTALL_K3S_VERSION="{{ k3s_serverVersion }}" \
    /tmp/k3s_install.sh server \
    --write-kubeconfig-mode {{ k3s_serverKubeconfigMode }} \
    {{ '--disable traefik' if k3s_serverDisableTraefik | bool else '' }} \
    {{ '--disable servicelb' if k3s_serverDisableServicelb | bool else '' }}
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s
  when: not ansible_check_mode

# @docsible Ensures systemd override directory for k3s exists
- name: Create override dir
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    mode: "0750"

# @docsible Writes systemd ExecStart override for k3s
- name: Create override
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service.d/override.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/local/bin/k3s server
    mode: "0640"
  notify: Restart k3s

# @docsible Reloads systemd daemon
- name: Reload systemd (k3s)
  ansible.builtin.systemd:
    daemon_reload: true

# @docsible Enables and starts k3s.service
- name: Start K3s
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started
  when: not ansible_check_mode

# @docsible Flushes pending handlers (service restarts)
- name: Flush handlers
  ansible.builtin.meta: flush_handlers

# @docsible Waits for K3s node-token file generation
- name: Wait for node-token
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: "{{ k3s_serverNodeTokenTimeout }}"
  when: not ansible_check_mode

# @docsible Waits for K3s kubeconfig file generation
- name: Wait for kubeconfig
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: "{{ k3s_serverNodeTokenTimeout }}"
  when: not ansible_check_mode

# @docsible Reads raw server kubeconfig
- name: Read kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig_raw
  no_log: true
  when: not ansible_check_mode

# @docsible Builds Tailscale-aware kubeconfig endpoint
- name: Build canonical config
  ansible.builtin.set_fact:
    k3s_kubeconfig_canonical: |
      {{ k3s_kubeconfig_raw.content | b64decode |
         regex_replace('https://[0-9.]+:6443', 'https://' + IP_tailscale + ':6443') }}
  when: not ansible_check_mode

# @docsible Writes canonical kubeconfig to /etc/rancher/k3s/k3s-tailscale.yaml
- name: Write server config
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig_canonical }}"
    dest: /etc/rancher/k3s/k3s-tailscale.yaml
    owner: root
    group: root
    mode: "{{ k3s_serverKubeconfigMode }}"
  when: not ansible_check_mode

# @docsible Ensures kubeconfig directory exists for ansible user
- name: Create user kube dir
  ansible.builtin.file:
    path: "{{ kubeconfig | dirname }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
  when: not ansible_check_mode

# @docsible Writes kubeconfig to ansible user home path
- name: Write user config
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig_canonical }}"
    dest: "{{ kubeconfig }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  when: not ansible_check_mode

# @docsible Reads generated K3s node-token
- name: Read node-token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_server_node_token_raw
  when: not ansible_check_mode

# @docsible Sets k3s_server_node_token fact from node-token file
- name: Set node-token fact
  ansible.builtin.set_fact:
    k3s_server_node_token: "{{ k3s_server_node_token_raw.content | b64decode | trim }}"
  when: not ansible_check_mode

# @docsible Waits for Kubernetes API server readiness
- name: Wait for apiserver
  kubernetes.core.k8s_info:
    kind: Namespace
    name: kube-system
    kubeconfig: "{{ kubeconfig }}"
  register: k3s_server_readyz
  retries: "{{ k3s_serverReadyzRetries }}"
  delay: "{{ k3s_serverReadyzDelay }}"
  until: k3s_server_readyz.resources | length > 0
  when: not ansible_check_mode
  become: false

# @docsible Labels node with control-plane and master roles
- name: Label master node
  kubernetes.core.k8s:
    kind: Node
    name: "{{ ansible_facts['hostname'] }}"
    kubeconfig: "{{ kubeconfig }}"
    definition:
      metadata:
        labels:
          node-role.kubernetes.io/control-plane: "true"
          node-role.kubernetes.io/master: "true"
  become: false
  when: not ansible_check_mode

# @docsible Removes Traefik HelmChart resources when disabled
- name: Remove Traefik resources if disabled
  kubernetes.core.k8s:
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: kube-system
    state: absent
    kubeconfig: "{{ kubeconfig }}"
  loop:
    - {kind: "HelmChart", name: "traefik"}
    - {kind: "HelmChartConfig", name: "traefik"}
  become: false
  when:
    - k3s_serverDisableTraefik | bool
    - not ansible_check_mode

# @docsible Applies CoreDNS custom ConfigMap for upstream and MagicDNS forwarding
- name: Apply CoreDNS custom ConfigMap
  kubernetes.core.k8s:
    src: "{{ k8s_manifestsDir }}/bootstrap/coredns-custom.yaml"
    kubeconfig: "{{ kubeconfig }}"
    state: present
  become: false
  when: not ansible_check_mode

# @docsible Copies kubeconfig to controller host when enabled
- name: Copy local config
  when:
    - k3s_serverCopyKubeconfigLocal | default(true) | bool
    - not ansible_check_mode
  delegate_to: localhost
  become: false
  run_once: true
  block:
    # @docsible Ensures local kubeconfig directory exists
    - name: Create local dir
      ansible.builtin.file:
        path: "{{ k3s_serverLocalKubeconfigPath | dirname }}"
        state: directory
        mode: "0700"

    # @docsible Fetches k3s-tailscale.yaml from server node
    - name: Fetch config
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s-tailscale.yaml
      register: k3s_server_kubeconfig_b64
      delegate_to: "{{ inventory_hostname }}"
      become: true

    # @docsible Rewrites kubeconfig context names to k3s-{{ hostname }}
    - name: Parse config
      ansible.builtin.set_fact:
        k3s_server_kubeconfig_local: |
          {{ k3s_server_kubeconfig_b64.content | b64decode |
             regex_replace('name: default', 'name: k3s-' + k3s_serverContextName) |
             regex_replace('cluster: default', 'cluster: k3s-' + k3s_serverContextName) |
             regex_replace('user: default', 'user: k3s-' + k3s_serverContextName) |
             regex_replace('current-context: default', 'current-context: k3s-' + k3s_serverContextName)
          }}

    # @docsible Writes final kubeconfig on controller
    - name: Write local config
      ansible.builtin.copy:
        content: "{{ k3s_server_kubeconfig_local }}"
        dest: "{{ k3s_serverLocalKubeconfigPath }}"
        mode: "0600"

    # @docsible Prints resulting local kubeconfig path
    - name: Show config info
      ansible.builtin.debug:
        msg: "✅ Kubeconfig ready: {{ k3s_serverLocalKubeconfigPath }}"
  rescue:
    # @docsible Reports kubeconfig copy failure details
    - name: Report kubeconfig copy failure
      ansible.builtin.debug:
        msg: >-
          Kubeconfig copy failed at {{ ansible_failed_task.name }}: {{ ansible_failed_result | to_json }}
    # @docsible Fails block after kubeconfig copy error
    - name: Fail kubeconfig copy
      ansible.builtin.fail:
        msg: "Kubeconfig copy to local machine failed"
