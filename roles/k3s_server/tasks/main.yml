# main.yml - K3s Server Role
- name: Verify K3s server version
  ansible.builtin.assert:
    that:
      - k3s_serverVersion is defined
      - k3s_serverVersion | length > 0
    fail_msg: "ERROR: k3s_serverVersion must be defined"

# Detect if gVisor or Nvidia runtimes are present on host
- name: Check for runsc binary
  ansible.builtin.stat:
    path: /usr/local/bin/runsc
  register: k3s_runsc_stat

- name: Check for nvidia-container-runtime
  ansible.builtin.stat:
    path: /usr/bin/nvidia-container-runtime
  register: k3s_nvidia_runtime_stat

- name: Build containerd runtime list
  ansible.builtin.set_fact:
    k3s_commonContainerdAdditionalRuntimes: >-
      {{
        []
        + (['runsc'] if k3s_runsc_stat.stat.exists else [])
        + (['nvidia'] if k3s_nvidia_runtime_stat.stat.exists else [])
      }}

# Import common K3s setup tasks (directories, containerd, uninstall logic)
- name: Run K3s Common
  ansible.builtin.import_role:
    name: k3s_common
  vars:
    k3s_recreate: "{{ k3s_serverRecreate }}"
    k3s_commonRestartHandler: "Restart k3s"

- name: Ensure K3s log directory exists
  ansible.builtin.file:
    path: /var/log/k3s
    state: directory
    mode: "0755"

# Deploy K3s server configuration
- name: Deploy server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s
  when: not ansible_check_mode

# Download and install K3s server with specified version
- name: Install K3s server
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION="{{ k3s_serverVersion }}" \
      sh -s - server \
      --write-kubeconfig-mode {{ k3s_serverKubeconfigMode }} \
      {{ '--disable traefik' if k3s_serverDisableTraefik | bool else '' }} \
      {{ '--disable servicelb' if k3s_serverDisableServicelb | bool else '' }}
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s
  when: not ansible_check_mode

# Create systemd override directory for K3s server service customization
- name: Create override dir
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    mode: "0750"

# Override K3s server service configuration for clean startup
- name: Create override
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service.d/override.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/local/bin/k3s server
    mode: "0640"
  notify: Restart k3s

# Wait for K3s node token to be generated
- name: Wait for node-token
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: "{{ k3s_serverNodeTokenTimeout }}"
  when: not ansible_check_mode

# Read the generated node token for agent joins
- name: Read node-token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_server_node_token_raw
  when: not ansible_check_mode

- name: Set node-token fact
  ansible.builtin.set_fact:
    k3s_server_node_token: "{{ k3s_server_node_token_raw.content | b64decode | trim }}"
  when: not ansible_check_mode

# Set proper permissions for the K3s kubeconfig file
- name: Set kubeconfig permissions
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: "{{ k3s_serverKubeconfigMode }}"
  when: not ansible_check_mode

# Wait for K3s API server to become ready
- name: Wait for API server to be ready
  ansible.builtin.uri:
    url: https://127.0.0.1:6443/readyz
    validate_certs: false  # checkov:skip=CKV_ANSIBLE_1:Localhost self-signed cert validation
  register: k3s_readyz
  until: k3s_readyz.status == 200
  retries: "{{ k3s_serverReadyzRetries }}"
  delay: "{{ k3s_serverReadyzDelay }}"
  when: not ansible_check_mode

# Label the master node as a control-plane node
- name: Label master node
  kubernetes.core.k8s:
    kind: Node
    name: "{{ ansible_facts['hostname'] }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      metadata:
        labels:
          node-role.kubernetes.io/control-plane: "true"
          node-role.kubernetes.io/master: "true"
  when: not ansible_check_mode

# Remove Traefik resources if disabled
- name: Remove Traefik resources if disabled
  kubernetes.core.k8s:
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: kube-system
    state: absent
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  loop:
    - {kind: "HelmChart", name: "traefik"}
    - {kind: "HelmChartConfig", name: "traefik"}
  when:
    - k3s_serverDisableTraefik | bool
    - not ansible_check_mode

# Optional: Copy kubeconfig to a local path for management from workstation
- name: Local kubeconfig setup
  when:
    - k3s_serverCopyKubeconfigLocal | default(true) | bool
    - not ansible_check_mode
  block:
    - name: Create local .kube directory
      ansible.builtin.file:
        path: "{{ k3s_serverLocalKubeconfigPath | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Fetch kubeconfig from server
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ k3s_serverLocalKubeconfigPath }}"
        flat: true

    - name: Update server address in local kubeconfig
      ansible.builtin.replace:
        path: "{{ k3s_serverLocalKubeconfigPath }}"
        regexp: 'https://127.0.0.1:6443'
        replace: "https://{{ inventory_hostname }}:6443"
      delegate_to: localhost
      become: false

    - name: Set context name in local kubeconfig
      ansible.builtin.replace:
        path: "{{ k3s_serverLocalKubeconfigPath }}"
        regexp: 'name: default'
        replace: "name: {{ k3s_serverContextName }}"
      delegate_to: localhost
      become: false

    - name: Show kubeconfig status
      ansible.builtin.debug:
        msg: "✅ Kubeconfig ready: {{ k3s_serverLocalKubeconfigPath }}"
  rescue:
    - name: Warn about local kubeconfig failure
      ansible.builtin.debug:
        msg: "⚠️ Could not copy kubeconfig locally. This is non-critical."
