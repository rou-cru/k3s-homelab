---
- name: Validate Tailscale IP is defined
  ansible.builtin.assert:
    that:
      - tailscale_ip is defined
      - tailscale_ip | length > 0
      - tailscale_ip is match('^100\.')
    fail_msg: "ERROR: Invalid tailscale_ip ({{ tailscale_ip | default('undefined') }}). Must be 100.x.x.x"

- name: Check if K3s uninstall script exists
  ansible.builtin.stat:
    path: /usr/local/bin/k3s-uninstall.sh
  register: k3s_uninstall_script

- name: Recreate K3s cluster for a clean state
  ansible.builtin.command: /usr/local/bin/k3s-uninstall.sh
  when:
    - k3s_server_recreate | bool
    - k3s_uninstall_script.stat.exists
  register: k3s_uninstall
  changed_when: k3s_uninstall.rc == 0

- name: Remove residual K3s state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/rancher/k3s
    - /etc/rancher/k3s
    - /var/lib/kubelet
    - /var/lib/cni
    - /etc/cni/net.d
  when:
    - k3s_server_recreate | bool
    - k3s_uninstall_script.stat.exists

- name: Ensure K3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Deploy K3s declarative configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s

- name: Install k3s server
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION="{{ k3s_server_version }}" \
      sh -
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s

- name: Ensure K3s systemd override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    mode: "0755"

- name: Create K3s systemd override to force declarative config
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service.d/override.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/local/bin/k3s server
    mode: "0644"
  notify: Restart k3s

- name: Remove K3s installer environment file to prevent config duplication
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.env
    state: absent
  notify: Restart k3s

- name: Reload systemd daemon immediately
  ansible.builtin.systemd:
    daemon_reload: true

- name: Ensure K3s service is enabled and running
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Apply pending K3s restarts before readiness checks
  ansible.builtin.meta: flush_handlers

- name: Wait for kubeconfig to be generated
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: "{{ k3s_server_node_token_timeout }}"
  when: not ansible_check_mode

- name: Read K3s kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig_raw

- name: Build canonical kubeconfig (Tailscale API endpoint)
  ansible.builtin.set_fact:
    k3s_kubeconfig_canonical: |
      {{ k3s_kubeconfig_raw.content | b64decode |
         regex_replace('https://[0-9.]+:6443', 'https://' + tailscale_ip + ':6443') }}

- name: Write canonical kubeconfig on server
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig_canonical }}"
    dest: /etc/rancher/k3s/k3s-tailscale.yaml
    owner: root
    group: root
    mode: "{{ k3s_server_kubeconfig_mode }}"

- name: Ensure .kube directory exists for user {{ ansible_user }}
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Write kubeconfig for target user
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig_canonical }}"
    dest: "/home/{{ ansible_user }}/.kube/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Wait for kube-apiserver (Standard Kubectl + Discovery)
  ansible.builtin.command: kubectl api-resources
  register: k3s_server_readyz
  retries: "{{ k3s_server_readyz_retries }}"
  delay: "{{ k3s_server_readyz_delay }}"
  until: k3s_server_readyz.rc == 0
  changed_when: false
  when: not ansible_check_mode
  become: false
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"

- name: Remove Traefik HelmCharts when disabled
  ansible.builtin.command: >
    kubectl -n kube-system delete helmchart traefik traefik-crd --ignore-not-found
  register: k3s_traefik_cleanup
  changed_when: "'deleted' in k3s_traefik_cleanup.stdout"
  when:
    - not ansible_check_mode
    - k3s_server_disable_traefik | bool
  become: false
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"

- name: Copy kubeconfig to local machine
  when:
    - k3s_server_copy_kubeconfig_local | default(true) | bool
    - not ansible_check_mode
  delegate_to: localhost
  become: false
  run_once: true
  block:
    - name: Ensure local .kube directory exists
      ansible.builtin.file:
        path: "{{ k3s_server_local_kubeconfig_path | dirname }}"
        state: directory
        mode: "0700"
    - name: Fetch kubeconfig from K3s server
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s-tailscale.yaml
      register: k3s_server_kubeconfig_b64
      delegate_to: "{{ inventory_hostname }}"
      become: true
    - name: Parse and modify kubeconfig
      ansible.builtin.set_fact:
        k3s_server_kubeconfig_local: |
          {{ k3s_server_kubeconfig_b64.content | b64decode |
             regex_replace('name: default', 'name: k3s-' + inventory_hostname) |
             regex_replace('cluster: default', 'cluster: k3s-' + inventory_hostname) |
             regex_replace('user: default', 'user: k3s-' + inventory_hostname) |
             regex_replace('current-context: default', 'current-context: k3s-' + inventory_hostname)
          }}
    - name: Write kubeconfig to local path
      ansible.builtin.copy:
        content: "{{ k3s_server_kubeconfig_local }}"
        dest: "{{ k3s_server_local_kubeconfig_path }}"
        mode: "0600"
    - name: Show kubeconfig info
      ansible.builtin.debug:
        msg:
          - "✅ Kubeconfig copied to: {{ k3s_server_local_kubeconfig_path }}"
          - "✅ Context name: k3s-{{ inventory_hostname }}"
          - "✅ Server URL: https://{{ tailscale_ip }}:6443"
          - ""
          - "Use kubectl with your existing installation:"
          - "  kubectl get nodes"
          - "  kubectl get pods -A"
