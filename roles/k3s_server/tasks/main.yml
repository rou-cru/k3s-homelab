- name: Validate Tailscale IP is defined
  assert:
    that:
      - tailscale_ip is defined
      - tailscale_ip | length > 0
    fail_msg: "ERROR: tailscale_ip fact is not set. Tailscale role must run before k3s_server."
    success_msg: "Tailscale IP validated: {{ tailscale_ip }}"

- name: Write k3s server install env
  set_fact:
    k3s_server_exec: >-
      server
      --node-ip {{ tailscale_ip }}
      --advertise-address {{ tailscale_ip }}
      --flannel-backend=none
      --disable-network-policy
      {% if k3s_disable_traefik | bool %}--disable traefik{% endif %}
      {% if k3s_disable_servicelb | bool %}--disable servicelb{% endif %}
      --write-kubeconfig-mode {{ k3s_kubeconfig_mode }}

- name: Install k3s server
  shell: |
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION="{{ k3s_version }}" \
      INSTALL_K3S_EXEC="{{ k3s_server_exec }}" \
      sh -
  args:
    creates: /usr/local/bin/k3s

- name: Wait for node-token
  wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: "{{ k3s_node_token_timeout }}"

- name: Read node token
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: token_raw

- name: Set token fact on localhost
  set_fact:
    k3s_token: "{{ token_raw.content | b64decode | trim }}"
  delegate_to: localhost
  run_once: true

- name: Wait for kube-apiserver
  shell: |
    k3s kubectl get --raw=/readyz >/dev/null
  register: readyz
  retries: "{{ k3s_readyz_retries }}"
  delay: "{{ k3s_readyz_delay }}"
  until: readyz.rc == 0
  changed_when: false
