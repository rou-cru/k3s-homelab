# Validate Tailscale IP address format for secure cluster communication
- name: Validate IP
  ansible.builtin.assert:
    that:
      - tailscale_ip is defined
      - tailscale_ip | length > 0
      - tailscale_ip is match('^100\.')
    fail_msg: "ERROR: Invalid tailscale_ip ({{ tailscale_ip | default('undefined') }}). Must be 100.x.x.x"
  when: tailscale_ip is defined

# Import common K3s setup tasks (directories, containerd, uninstall logic)
- name: Run K3s Common
  ansible.builtin.import_role:
    name: k3s_common
  vars:
    k3s_recreate: "{{ k3s_server_recreate }}"

# Create secure log directory for K3s components
- name: Ensure K3s log directory exists
  ansible.builtin.file:
    path: /var/log/k3s
    state: directory
    mode: '0700'
    owner: root
    group: root
# Create audit log file with strict permissions for security
- name: Ensure K3s audit log file exists with restrictive permissions
  ansible.builtin.file:
    path: /var/log/k3s/audit.log
    state: touch
    owner: root
    group: root
    mode: '0600'
    modification_time: preserve
# Deploy Kubernetes audit policy for API security monitoring
- name: Deploy K3s audit policy
  ansible.builtin.template:
    src: audit-policy.yaml.j2
    dest: /etc/rancher/k3s/audit-policy.yaml
    mode: '0600'
  notify: Restart k3s
# Deploy K3s server configuration with security hardening
- name: Deploy config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s
  when: not ansible_check_mode
# Download and install K3s with specified version
- name: Install K3s
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION="{{ k3s_server_version }}" \
      sh -
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s
  when: not ansible_check_mode
# Create systemd override directory for K3s service customization
- name: Create override dir
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    mode: "0750"
# Override K3s service configuration for clean startup
- name: Create override
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service.d/override.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/local/bin/k3s server
    mode: "0640"
  notify: Restart k3s
# Remove legacy environment file to prevent conflicts
- name: Remove env file
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.env
    state: absent
  notify: Restart k3s
# Reload systemd configuration after service changes
- name: Reload systemd (k3s)
  ansible.builtin.systemd:
    daemon_reload: true
# Enable and start K3s service
- name: Start K3s
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started
  when: not ansible_check_mode
# Apply pending service restarts before continuing
- name: Flush handlers
  ansible.builtin.meta: flush_handlers
# Wait for K3s to generate admin kubeconfig file
- name: Wait for kubeconfig
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: "{{ k3s_server_node_token_timeout }}"
  when: not ansible_check_mode
# Read K3s admin kubeconfig for Tailscale integration
- name: Read kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig_raw
  no_log: true
  when: not ansible_check_mode
# Replace localhost with Tailscale IP for remote cluster access
- name: Build canonical config
  ansible.builtin.set_fact:
    k3s_kubeconfig_canonical: |
      {{ k3s_kubeconfig_raw.content | b64decode |
         regex_replace('https://[0-9.]+:6443', 'https://' + tailscale_ip + ':6443') }}
  when: not ansible_check_mode
# Store Tailscale-enabled kubeconfig for server access
- name: Write server config
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig_canonical }}"
    dest: /etc/rancher/k3s/k3s-tailscale.yaml
    owner: root
    group: root
    mode: "{{ k3s_server_kubeconfig_mode }}"
  when: not ansible_check_mode
# Create secure kubeconfig directory for ansible user
- name: Create user kube dir
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
  when: not ansible_check_mode
# Deploy Tailscale-enabled kubeconfig for ansible user
- name: Write user config
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig_canonical }}"
    dest: "/home/{{ ansible_user }}/.kube/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  when: not ansible_check_mode
# Verify Kubernetes API server is ready before proceeding
- name: Wait for apiserver
  ansible.builtin.command: kubectl api-resources
  register: k3s_server_readyz
  retries: "{{ k3s_server_readyz_retries }}"
  delay: "{{ k3s_server_readyz_delay }}"
  until: k3s_server_readyz.rc == 0
  changed_when: false
  when: not ansible_check_mode
  become: false
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
# Remove default Traefik ingress controller if disabled
- name: Remove Traefik
  ansible.builtin.command: >
    kubectl -n kube-system delete helmchart traefik traefik-crd --ignore-not-found

  register: k3s_traefik_cleanup
  changed_when: "'deleted' in k3s_traefik_cleanup.stdout"
  when:
    - not ansible_check_mode
    - k3s_server_disable_traefik | bool
  become: false
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
# Copy kubeconfig to local machine for remote cluster management
- name: Copy local config
  when:
    - k3s_server_copy_kubeconfig_local | default(true) | bool
    - not ansible_check_mode
  delegate_to: localhost
  become: false
  run_once: true
  block:
    # Create local directory for kubeconfig storage
    - name: Create local dir
      ansible.builtin.file:
        path: "{{ k3s_server_local_kubeconfig_path | dirname }}"
        state: directory
        mode: "0700"
    # Retrieve Tailscale-enabled kubeconfig from server
    - name: Fetch config
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s-tailscale.yaml
      register: k3s_server_kubeconfig_b64
      delegate_to: "{{ inventory_hostname }}"
      become: true
    # Customize kubeconfig with unique context names for multi-cluster support
    - name: Parse config
      ansible.builtin.set_fact:
        k3s_server_kubeconfig_local: |
          {{ k3s_server_kubeconfig_b64.content | b64decode |
             regex_replace('name: default', 'name: k3s-' + inventory_hostname) |
             regex_replace('cluster: default', 'cluster: k3s-' + inventory_hostname) |
             regex_replace('user: default', 'user: k3s-' + inventory_hostname) |
             regex_replace('current-context: default', 'current-context: k3s-' + inventory_hostname)
          }}
    # Save customized kubeconfig to local file
    - name: Write local config
      ansible.builtin.copy:
        content: "{{ k3s_server_kubeconfig_local }}"
        dest: "{{ k3s_server_local_kubeconfig_path }}"
        mode: "0600"
    # Display success message with kubeconfig location
    - name: Show config info
      ansible.builtin.debug:
        msg: "✅ Kubeconfig ready: {{ k3s_server_local_kubeconfig_path }}"
  rescue:
    - name: Report kubeconfig copy failure
      ansible.builtin.debug:
        msg: >-
          Kubeconfig copy failed at {{ ansible_failed_task.name }}: {{ ansible_failed_result | to_json }}
    - name: Fail kubeconfig copy
      ansible.builtin.fail:
        msg: "Kubeconfig copy to local machine failed"
