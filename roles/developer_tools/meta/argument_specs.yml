---
argument_specs:
  main:
    short_description: Installs development tools and CLIs.
    description: |
      Installs a suite of developer tools including terminal utilities (bat, tmux),
      Kubernetes CLIs (kubectl, helm, k9s), Python tools (uv, pipx), and AI CLIs.
    author: rc
    options:
      devtools_install_docker:
        type: bool
        required: false
        default: false
        description: Installs Docker CLI (not recommended for K3s nodes which use containerd).
