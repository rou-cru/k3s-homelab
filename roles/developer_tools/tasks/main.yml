- name: Install dev tools (apt)
  ansible.builtin.apt:
    name:
      # Terminal utilities
      - btop
      - bat
      - tree
      - tmux
      - jq
      - curl
      # Python ecosystem
      - python3-venv
      # System tools
      - gnupg
      - ca-certificates
    state: present
    update_cache: true
# Kubernetes tools are installed in roles/common to avoid snap usage.
# Development environments
- name: Install NVM
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
  args:
    creates: /root/.nvm/nvm.sh
    executable: /bin/bash
- name: Install latest Node.js LTS via NVM
  ansible.builtin.shell: |
    set -euo pipefail
    export NVM_DIR="/root/.nvm"
    . "${NVM_DIR}/nvm.sh"
    nvm install --lts
    nvm alias default 'lts/*'
  args:
    executable: /bin/bash
- name: Enable Corepack and activate pnpm
  ansible.builtin.shell: |
    set -euo pipefail
    export NVM_DIR="/root/.nvm"
    . "${NVM_DIR}/nvm.sh"
    corepack enable
    corepack prepare pnpm@latest --activate
  args:
    executable: /bin/bash
- name: Install Devbox
  ansible.builtin.shell: |
    curl -fsSL https://get.jetpack.io/devbox | bash
  args:
    creates: /usr/local/bin/devbox
# Python CLI tools (pipx/uv)
- name: Install nvitop
  ansible.builtin.command: uv tool install nvitop
  args:
    creates: /root/.local/bin/nvitop
  environment:
    PATH: "/root/.cargo/bin:{{ ansible_facts['env']['PATH'] }}"
  when: nvidia_gpu_setup_mode | default('auto') != 'false'
- name: Install Kimi
  ansible.builtin.command: uv tool install kimi-cli
  args:
    creates: /root/.local/bin/kimi
  environment:
    PATH: "/root/.cargo/bin:{{ ansible_facts['env']['PATH'] }}"
  ignore_errors: true
# AI CLI tools (npm)
- name: Install AI tools
  ansible.builtin.shell: |
    set -euo pipefail
    export NVM_DIR="/root/.nvm"
    . "${NVM_DIR}/nvm.sh"
    npm install -g {{ item }}
  args:
    executable: /bin/bash
  loop:
    - "@anthropic-ai/claude-code"
    - "@google/gemini-cli"
    - "@qwen-code/qwen-code"
    - "@openai/codex"
  ignore_errors: true
# Docker (optional, disabled by default)
- name: Install Docker
  when: devtools_install_docker | default(false) | bool
  block:
    - name: Add Docker key
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
          gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/docker-archive-keyring.gpg
    - name: Add Docker repo
      ansible.builtin.apt_repository:
        repo: >-
          {{


            'deb [arch=' ~ hashicorp_repo_arch ~
            ' signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] ' ~
            'https://download.docker.com/linux/ubuntu ' ~
            ansible_distribution_release ~
            ' stable'
          }}
        state: present
        filename: docker
    - name: Install Docker CLI
      ansible.builtin.apt:
        name:
          - docker-ce-cli
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
    - name: Show Docker warning
      ansible.builtin.debug:
        msg: "⚠️  Docker CLI installed (containerd used by K3s)"
  rescue:
    - name: Report Docker installation failure
      ansible.builtin.debug:
        msg: >-
          Docker installation failed at {{ ansible_failed_task.name }}: {{ ansible_failed_result | to_nice_json }}
    - name: Fail Docker installation
      ansible.builtin.fail:
        msg: "Docker installation failed"
# Vagrant + libvirt (for Molecule testing)
- name: Install Vagrant and libvirt
  when: devtools_install_vagrant | default(true) | bool
  block:
    - name: Set HashiCorp repo release
      ansible.builtin.set_fact:
        hashicorp_repo_release: >-
          {{ 'jammy' if ansible_distribution_release == 'noble' else ansible_distribution_release }}
    - name: Set HashiCorp repo architecture
      ansible.builtin.set_fact:
        hashicorp_repo_arch: >-
          {{


            'amd64'
            if ansible_architecture == 'x86_64'
            else 'arm64'
            if ansible_architecture == 'aarch64'
            else 'unsupported'
          }}
    - name: Validate HashiCorp repo architecture
      ansible.builtin.assert:
        that:
          - hashicorp_repo_arch != 'unsupported'
        fail_msg: "Unsupported architecture for HashiCorp repo: {{ ansible_architecture }}"
    - name: Ensure APT keyrings dir (HashiCorp)
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: "0755"
      check_mode: false
    - name: Install HashiCorp keyring
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL https://apt.releases.hashicorp.com/gpg | \
          gpg --dearmor --batch --yes --no-tty -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
      args:
        executable: /bin/bash
      check_mode: false
    - name: Add HashiCorp APT repo
      ansible.builtin.apt_repository:
        repo: >-
          {{


            'deb [arch=' ~ hashicorp_repo_arch ~
            ' signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] ' ~
            'https://apt.releases.hashicorp.com ' ~
            hashicorp_repo_release ~
            ' main'
          }}
        state: present
        filename: hashicorp
      check_mode: false
    - name: Refresh APT cache after HashiCorp repo
      ansible.builtin.apt:
        update_cache: true
      check_mode: false
    - name: Install libvirt and dependencies
      ansible.builtin.apt:
        name:
          - qemu-kvm
          - libvirt-daemon-system
          - libvirt-clients
          - libvirt-dev
          - bridge-utils
          - virt-manager
          - gcc
          - make
          - pkg-config
          - ruby-dev
          - libxml2-dev
          - libxslt1-dev
          - zlib1g-dev
          - vagrant
        state: present
        update_cache: true
    - name: Ensure libvirtd service is enabled and started
      ansible.builtin.systemd:
        name: libvirtd
        enabled: true
        state: started
    - name: Add ansible_user to libvirt group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: libvirt
        append: true
    - name: Add root to libvirt group
      ansible.builtin.user:
        name: root
        groups: libvirt
        append: true
    - name: Install vagrant-libvirt plugin
      ansible.builtin.command: vagrant plugin install vagrant-libvirt
      register: vagrant_plugin_result
      changed_when: "'Installed the plugin' in vagrant_plugin_result.stdout"
      become: true
      become_user: "{{ ansible_user }}"
      when: not ansible_check_mode
    - name: Show Vagrant installation success
      ansible.builtin.debug:
        msg: "✅ Vagrant + libvirt installed successfully"
  rescue:
    - name: Report Vagrant installation failure
      ansible.builtin.debug:
        msg: >-
          Vagrant installation failed at {{ ansible_failed_task.name }}: {{ ansible_failed_result | to_nice_json }}
    - name: Fail Vagrant installation
      ansible.builtin.fail:
        msg: "Vagrant installation failed"
