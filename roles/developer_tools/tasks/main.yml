# @docsible Install base development tools via APT
- name: Install dev tools (apt)
  ansible.builtin.apt:
    name:
      # Terminal utilities
      - btop
      - bat
      - tree
      - tmux
      - jq
      - curl
      # Python ecosystem
      - python3-venv
      # System tools
      - gnupg
      - ca-certificates
    state: present
    update_cache: true
# @docsible Install Node Version Manager
- name: Install NVM
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/{{ devtools_nvmVersion }}/install.sh | bash
  args:
    creates: /root/.nvm/nvm.sh
    executable: /bin/bash
  when: not ansible_check_mode
# @docsible Install Node.js LTS via NVM
- name: Install latest Node.js LTS via NVM
  ansible.builtin.shell: |
    set -euo pipefail
    export NVM_DIR="/root/.nvm"
    . "${NVM_DIR}/nvm.sh"
    nvm install --lts
    nvm alias default 'lts/*'
  args:
    executable: /bin/bash
  when: not ansible_check_mode
# @docsible Enable Corepack and activate pnpm
- name: Enable Corepack and activate pnpm
  ansible.builtin.shell: |
    set -euo pipefail
    export NVM_DIR="/root/.nvm"
    . "${NVM_DIR}/nvm.sh"
    corepack enable
    corepack prepare pnpm@latest --activate
  args:
    executable: /bin/bash
  when: not ansible_check_mode
# @docsible Install Devbox package manager
- name: Install Devbox
  ansible.builtin.shell: |
    curl -fsSL https://get.jetpack.io/devbox | bash
  args:
    creates: /usr/local/bin/devbox
  when: not ansible_check_mode
# @docsible Install nvitop GPU monitor via uv
- name: Install nvitop
  ansible.builtin.command: uv tool install nvitop
  args:
    creates: /root/.local/bin/nvitop
  environment:
    PATH: "/root/.cargo/bin:{{ ansible_facts['env']['PATH'] }}"
  when:
    - nvidia_setupMode | default('auto') != 'false'
    - not ansible_check_mode
# @docsible Install Kimi CLI via uv
- name: Install Kimi
  ansible.builtin.command: uv tool install kimi-cli
  args:
    creates: /root/.local/bin/kimi
  environment:
    PATH: "/root/.cargo/bin:{{ ansible_facts['env']['PATH'] }}"
  when: not ansible_check_mode
# @docsible Install AI CLI tools via npm
- name: Install AI tools
  ansible.builtin.shell: |
    set -euo pipefail
    export NVM_DIR="/root/.nvm"
    . "${NVM_DIR}/nvm.sh"
    npm install -g {{ item }}
  args:
    executable: /bin/bash
  loop:
    - "@anthropic-ai/claude-code"
    - "@google/gemini-cli"
    - "@qwen-code/qwen-code"
    - "@openai/codex"
  when: not ansible_check_mode
# @docsible Install Docker CLI if enabled
- name: Install Docker
  when:
    - devtools_installDocker | default(false) | bool
    - not ansible_check_mode
  block:
    # @docsible Add Docker GPG key
    - name: Add Docker key
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
          gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/docker-archive-keyring.gpg
    # @docsible Add Docker APT repository
    - name: Add Docker repo
      ansible.builtin.apt_repository:
        repo: >-
          {{
            'deb [arch=' ~ (
              'amd64' if ansible_facts['architecture'] == 'x86_64'
              else 'arm64' if ansible_facts['architecture'] == 'aarch64'
              else 'unsupported'
            ) ~
            ' signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] ' ~
            'https://download.docker.com/linux/ubuntu ' ~
            ansible_facts['distribution_release'] ~
            ' stable'
          }}
        state: present
        filename: docker
    # @docsible Install Docker CLI packages
    - name: Install Docker CLI
      ansible.builtin.apt:
        name:
          - docker-ce-cli
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
    # @docsible Warn about containerd conflict
    - name: Show Docker warning
      ansible.builtin.debug:
        msg: "⚠️  Docker CLI installed (containerd used by K3s)"
  rescue:
    - name: Report Docker installation failure
      ansible.builtin.debug:
        msg: >-
          Docker installation failed at {{ ansible_failed_task.name }}: {{ ansible_failed_result | to_json }}
    - name: Fail Docker installation
      ansible.builtin.fail:
        msg: "Docker installation failed"
# @docsible Install Vagrant and libvirt for testing
- name: Install Vagrant and libvirt
  when:
    - devtools_installVagrant | default(true) | bool
    - not ansible_check_mode
  block:
    # @docsible Determine HashiCorp repo release
    - name: Set HashiCorp repo release
      ansible.builtin.set_fact:
        hashicorp_repo_release: >-
          {{ 'jammy' if ansible_facts['distribution_release'] == 'noble' else ansible_facts['distribution_release'] }}
    # @docsible Determine architecture for HashiCorp repo
    - name: Set HashiCorp repo architecture
      ansible.builtin.set_fact:
        hashicorp_repo_arch: >-
          {{
            'amd64'
            if ansible_facts['architecture'] == 'x86_64'
            else 'arm64'
            if ansible_facts['architecture'] == 'aarch64'
            else 'unsupported'
          }}
    # @docsible Validate supported architecture
    - name: Validate HashiCorp repo architecture
      ansible.builtin.assert:
        that:
          - hashicorp_repo_arch != 'unsupported'
        fail_msg: "Unsupported architecture for HashiCorp repo: {{ ansible_facts['architecture'] }}"
    # @docsible Create APT keyrings directory
    - name: Ensure APT keyrings dir (HashiCorp)
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: "0755"
      when: not ansible_check_mode
    # @docsible Install HashiCorp GPG key
    - name: Install HashiCorp keyring
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL https://apt.releases.hashicorp.com/gpg | \
          gpg --dearmor --batch --yes --no-tty -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
      args:
        executable: /bin/bash
        creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg
      when: not ansible_check_mode
    # @docsible Add HashiCorp APT repository
    - name: Add HashiCorp APT repo
      ansible.builtin.apt_repository:
        repo: >-
          {{


            'deb [arch=' ~ hashicorp_repo_arch ~
            ' signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] ' ~
            'https://apt.releases.hashicorp.com ' ~
            hashicorp_repo_release ~
            ' main'
          }}
        state: present
        filename: hashicorp
      when: not ansible_check_mode
    # @docsible Install libvirt and build dependencies
    - name: Install libvirt and dependencies
      ansible.builtin.apt:
        name:
          - qemu-kvm
          - libvirt-daemon-system
          - libvirt-clients
          - libvirt-dev
          - bridge-utils
          - virt-manager
          - gcc
          - make
          - pkg-config
          - ruby-dev
          - libxml2-dev
          - libxslt1-dev
          - zlib1g-dev
          - vagrant
        state: present
        update_cache: true
    # @docsible Enable libvirtd service
    - name: Ensure libvirtd service is enabled and started
      ansible.builtin.systemd:
        name: libvirtd
        enabled: true
        state: started
    # @docsible Add ansible user to libvirt group
    - name: Add ansible_user to libvirt group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: libvirt
        append: true
    # @docsible Add root to libvirt group
    - name: Add root to libvirt group
      ansible.builtin.user:
        name: root
        groups: libvirt
        append: true
    # @docsible List installed Vagrant plugins
    - name: Check installed Vagrant plugins
      ansible.builtin.command: vagrant plugin list
      register: vagrant_plugin_list
      changed_when: false
    # @docsible Install vagrant-libvirt plugin
    - name: Install vagrant-libvirt plugin
      ansible.builtin.command: vagrant plugin install vagrant-libvirt
      register: vagrant_plugin_result
      changed_when: "'Installed the plugin' in vagrant_plugin_result.stdout"
      when:
        - not ansible_check_mode
        - vagrant_plugin_list.rc == 0
        - "'vagrant-libvirt' not in vagrant_plugin_list.stdout"
    # @docsible Confirm Vagrant installation
    - name: Show Vagrant installation success
      ansible.builtin.debug:
        msg: "✅ Vagrant + libvirt installed successfully"
  rescue:
    - name: Report Vagrant installation failure
      ansible.builtin.debug:
        msg: >-
          Vagrant installation failed at {{ ansible_failed_task.name }}: {{ ansible_failed_result | to_json }}
    - name: Fail Vagrant installation
      ansible.builtin.fail:
        msg: "Vagrant installation failed"
