- name: Check if Helm is installed
  ansible.builtin.command: which helm
  register: helm_binary_check
  changed_when: false
  failed_when: false

- name: Ensure ArgoCD Helm repo
  ansible.builtin.command: helm repo add argo https://argoproj.github.io/argo-helm
  register: argo_repo_add
  changed_when: "'has been added' in argo_repo_add.stdout"
  failed_when: argo_repo_add.rc != 0 and 'exists' not in argo_repo_add.stderr
  when: helm_binary_check.rc == 0

- name: Deploy ArgoCD
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    release_namespace: "{{ argocd_namespace }}"
    update_repo_cache: true
    create_namespace: true
    chart_version: "{{ argocd_chart_version | default(omit, true) }}"
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
    values:
      crds:
        install: "{{ argocd_install_crds }}"
      dex:
        enabled: "{{ argocd_dex_enabled }}"
      redis-ha:
        enabled: "{{ argocd_ha_enabled }}"
      controller:
        replicas: 1
        metrics:
          enabled: true
          serviceMonitor:
            enabled: "{{ argocd_servicemonitor_enabled }}"
      server:
        replicas: 1
        metrics:
          enabled: true
          serviceMonitor:
            enabled: "{{ argocd_servicemonitor_enabled }}"
      repoServer:
        replicas: 1
        metrics:
          enabled: true
          serviceMonitor:
            enabled: "{{ argocd_servicemonitor_enabled }}"
      applicationSet:
        enabled: true
        replicaCount: 1
        metrics:
          enabled: true
          serviceMonitor:
            enabled: "{{ argocd_servicemonitor_enabled }}"
  become: false
  when: helm_binary_check.rc == 0
  tags: ["apps", "argocd"]

- name: Create ArgoCD Admin Password ExternalSecret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: argocd-admin-pass
        namespace: "{{ argocd_namespace }}"
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: oci-vault
          kind: ClusterSecretStore
        target:
          name: argocd-secret
          creationPolicy: Merge
        data:
          - secretKey: admin.password
            remoteRef:
              key: argocd-admin-pass
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
  register: argocd_es_created
  become: false
  when: helm_binary_check.rc == 0
  tags: ["apps", "argocd", "secrets"]

- name: Wait for argocd-secret to have admin.password
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: argocd-secret
    namespace: "{{ argocd_namespace }}"
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
  register: argocd_secret_check
  retries: 12
  delay: 5
  until:
    - argocd_secret_check.resources | length > 0
    - "'admin.password' in (argocd_secret_check.resources[0].data | default({}))"
  when: helm_binary_check.rc == 0 and argocd_es_created.changed
  become: false
  tags: ["apps", "argocd", "secrets"]

- name: Restart ArgoCD Server to pick up new password
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-server
        namespace: "{{ argocd_namespace }}"
        annotations:
          kubectl.kubernetes.io/restartedAt: "{{ ansible_date_time.iso8601 }}"
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
  when: helm_binary_check.rc == 0 and argocd_es_created.changed
  become: false
  tags: ["apps", "argocd", "secrets"]
