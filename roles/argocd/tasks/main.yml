# @docsible Registers ArgoCD Helm repository
- name: Ensure ArgoCD Helm repo
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm
  when: not ansible_check_mode

# @docsible Creates 'argocd' namespace
- name: Create argocd namespace
  kubernetes.core.k8s:
    state: present
    src: "{{ k8s_manifestsDir }}/bootstrap/argocd/namespace.yaml"
    kubeconfig: "{{ kubeconfig }}"
  when: not ansible_check_mode

# @docsible Installs ArgoCD (Helm)
- name: Deploy ArgoCD
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    release_namespace: "{{ argocd_namespace }}"
    update_repo_cache: true
    create_namespace: false
    timeout: 10m0s
    chart_version: "{{ argocd_chartVersion | default(omit, true) }}"
    kubeconfig: "{{ kubeconfig }}"
    values_files:
      - "{{ k8s_manifestsDir }}/bootstrap/argocd/values.yaml"
    values: "{{ lookup('template', playbook_dir + '/k8s/bootstrap/argocd/values-override.yaml.j2') | from_yaml }}"
  when: not ansible_check_mode
  tags: ["gitops"]

# @docsible Syncs Admin Password from Vault (ExternalSecret)
- name: Create ArgoCD Admin Password ExternalSecret
  kubernetes.core.k8s:
    state: present
    src: "{{ k8s_manifestsDir }}/bootstrap/argocd/admin-password.yaml"
    kubeconfig: "{{ kubeconfig }}"
  register: argocd_es_created
  until: argocd_es_created is succeeded
  when: not ansible_check_mode
  tags: ["gitops"]

# @docsible Waits for Admin Password Secret sync
- name: Wait for argocd-secret to have admin.password
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: argocd-secret
    namespace: "{{ argocd_namespace }}"
    kubeconfig: "{{ kubeconfig }}"
  register: argocd_secret_check
  until:
    - argocd_secret_check.resources | length > 0
    - "'admin.password' in (argocd_secret_check.resources[0].data | default({}))"
  when:
    - argocd_es_created.changed
    - not ansible_check_mode
  tags: ["gitops"]

# @docsible Discovers ArgoCD project manifests in remote bootstrap directory
- name: Find ArgoCD project manifests
  ansible.builtin.find:
    paths: "{{ k8s_manifestsDir }}/bootstrap/argocd/projects"
    patterns: "*.yaml"
    file_type: file
  register: argocd_project_manifests
  tags: ["gitops"]

# @docsible Discovers ArgoCD ApplicationSet manifests in remote bootstrap directory
- name: Find ArgoCD ApplicationSet manifests
  ansible.builtin.find:
    paths: "{{ k8s_manifestsDir }}/bootstrap/argocd/applicationsets"
    patterns: "*.yaml"
    file_type: file
  register: argocd_appset_manifests
  tags: ["gitops"]

# @docsible Applies ArgoCD AppProjects from bootstrap manifests
- name: Apply ArgoCD projects
  kubernetes.core.k8s:
    state: present
    src: "{{ item.path }}"
    kubeconfig: "{{ kubeconfig }}"
  loop: "{{ argocd_project_manifests.files | sort(attribute='path') }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: not ansible_check_mode
  tags: ["gitops"]

# @docsible Applies ArgoCD ApplicationSets from bootstrap manifests
- name: Apply ArgoCD ApplicationSets
  kubernetes.core.k8s:
    state: present
    src: "{{ item.path }}"
    kubeconfig: "{{ kubeconfig }}"
  loop: "{{ argocd_appset_manifests.files | sort(attribute='path') }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: not ansible_check_mode
  tags: ["gitops"]

# @docsible Restarts ArgoCD Server (Applies new password)
- name: Restart ArgoCD Server to pick up new password
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-server
        namespace: "{{ argocd_namespace }}"
        annotations:
          kubectl.kubernetes.io/restartedAt: "{{ ansible_facts['date_time']['iso8601'] }}"
    kubeconfig: "{{ kubeconfig }}"
  when:
    - argocd_es_created.changed
    - not ansible_check_mode
  tags: ["gitops"]
