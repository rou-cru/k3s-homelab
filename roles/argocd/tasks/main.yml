# @docsible Check Helm availability
- name: Check if Helm is installed
  ansible.builtin.command: which helm
  register: helm_binary_check
  changed_when: false
  failed_when: false

# @docsible Add ArgoCD Helm repository
- name: Ensure ArgoCD Helm repo
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm
  when:
    - helm_binary_check.rc == 0
    - not ansible_check_mode

# @docsible Deploy ArgoCD via Helm
- name: Deploy ArgoCD
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    release_namespace: "{{ argocd_namespace }}"
    update_repo_cache: true
    create_namespace: true
    chart_version: "{{ argocd_chartVersion | default(omit, true) }}"
    kubeconfig: "{{ k8s_kubeconfig }}"
    values:
      crds:
        install: "{{ argocd_installCrds }}"
        keep: true

      configs:
        cm:
          statusbadge.enabled: true
          resource.customizations.ignoreResourceUpdates.external-secrets.io_ExternalSecret: |
            jqPathExpressions:
              - '.status'
          resource.exclusions: |
            - apiGroups:
              - external-secrets.io
              kinds:
              - PushSecret
        cmp:
          create: true
          plugins:
            kustomize-with-helm:
              generate:
                command: [sh, -c]
                args: ["kustomize build --enable-helm"]

      global:
        logging:
          level: warning

      dex:
        enabled: "{{ argocd_dexEnabled }}"

      redis-ha:
        enabled: "{{ argocd_haEnabled }}"

      controller:
        replicas: 1
        pdb:
          enabled: false
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        metrics:
          enabled: true
          serviceMonitor:
            enabled: "{{ argocd_serviceMonitorEnabled }}"

      server:
        replicas: 1
        pdb:
          enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
        metrics:
          enabled: true
          serviceMonitor:
            enabled: "{{ argocd_serviceMonitorEnabled }}"

      repoServer:
        replicas: 1
        pdb:
          enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
        metrics:
          enabled: true
          serviceMonitor:
            enabled: "{{ argocd_serviceMonitorEnabled }}"

      applicationSet:
        enabled: true
        replicaCount: 1
        pdb:
          enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
        metrics:
          enabled: true
          serviceMonitor:
            enabled: "{{ argocd_serviceMonitorEnabled }}"

      notifications:
        enabled: true
        pdb:
          enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
        metrics:
          enabled: true
          serviceMonitor:
            enabled: "{{ argocd_serviceMonitorEnabled }}"
  become: false
  when:
    - helm_binary_check.rc == 0
    - not ansible_check_mode
  tags: ["apps", "argocd"]

# @docsible Create ExternalSecret for admin password
- name: Create ArgoCD Admin Password ExternalSecret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: argocd-admin-pass
        namespace: "{{ argocd_namespace }}"
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: oci-vault
          kind: ClusterSecretStore
        target:
          name: argocd-secret
          creationPolicy: Merge
        data:
          - secretKey: admin.password
            remoteRef:
              key: argocd-admin-pass
    kubeconfig: "{{ k8s_kubeconfig }}"
  register: argocd_es_created
  retries: 12
  delay: 5
  until: argocd_es_created is succeeded
  become: false
  when:
    - helm_binary_check.rc == 0
    - not ansible_check_mode
  tags: ["apps", "argocd", "secrets"]

# @docsible Wait for admin password secret
- name: Wait for argocd-secret to have admin.password
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: argocd-secret
    namespace: "{{ argocd_namespace }}"
    kubeconfig: "{{ k8s_kubeconfig }}"
  register: argocd_secret_check
  retries: 12
  delay: 5
  until:
    - argocd_secret_check.resources | length > 0
    - "'admin.password' in (argocd_secret_check.resources[0].data | default({}))"
  when:
    - helm_binary_check.rc == 0
    - argocd_es_created.changed
    - not ansible_check_mode
  become: false
  tags: ["apps", "argocd", "secrets"]

# @docsible Restart ArgoCD server for password update
- name: Restart ArgoCD Server to pick up new password
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-server
        namespace: "{{ argocd_namespace }}"
        annotations:
          kubectl.kubernetes.io/restartedAt: "{{ ansible_facts['date_time']['iso8601'] }}"
    kubeconfig: "{{ k8s_kubeconfig }}"
  when:
    - helm_binary_check.rc == 0
    - argocd_es_created.changed
    - not ansible_check_mode
  become: false
  tags: ["apps", "argocd", "secrets"]
