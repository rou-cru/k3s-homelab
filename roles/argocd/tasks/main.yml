- name: Check if Helm is installed
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: helm_binary_check

- name: Ensure ArgoCD Helm repo
  ansible.builtin.command: helm repo add argo https://argoproj.github.io/argo-helm
  register: argo_repo_add
  changed_when: "'has been added' in argo_repo_add.stdout"
  failed_when: argo_repo_add.rc != 0 and 'exists' not in argo_repo_add.stderr
  when: helm_binary_check.stat.exists

- name: Deploy ArgoCD
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    release_namespace: "{{ argocd_namespace }}"
    update_repo_cache: true
    create_namespace: true
    chart_version: "{{ argocd_chart_version | default(omit, true) }}"
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
    values:
      crds:
        install: "{{ argocd_install_crds }}"
        keep: true

      global:
        logging:
          level: warning

      dex:
        enabled: "{{ argocd_dex_enabled }}"

      redis-ha:
        enabled: "{{ argocd_ha_enabled }}"

      controller:
        replicas: 1
        pdb:
          enabled: false
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        metrics:
          enabled: true
          serviceMonitor:
            enabled: "{{ argocd_servicemonitor_enabled }}"

      server:
        replicas: 1
        pdb:
          enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
        metrics:
          enabled: true
          serviceMonitor:
            enabled: "{{ argocd_servicemonitor_enabled }}"

      repoServer:
        replicas: 1
        pdb:
          enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
        metrics:
          enabled: true
          serviceMonitor:
            enabled: "{{ argocd_servicemonitor_enabled }}"

      applicationSet:
        enabled: true
        replicaCount: 1
        pdb:
          enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
        metrics:
          enabled: true
          serviceMonitor:
            enabled: "{{ argocd_servicemonitor_enabled }}"
  become: false
  when: helm_binary_check.stat.exists
  tags: ["apps", "argocd"]

- name: Create ArgoCD Admin Password ExternalSecret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: argocd-admin-pass
        namespace: "{{ argocd_namespace }}"
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: oci-vault
          kind: ClusterSecretStore
        target:
          name: argocd-secret
          creationPolicy: Merge
        data:
          - secretKey: admin.password
            remoteRef:
              key: argocd-admin-pass
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
  register: argocd_es_created
  become: false
  when: helm_binary_check.stat.exists
  tags: ["apps", "argocd", "secrets"]

- name: Restart ArgoCD Server to pick up new password
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-server
        namespace: "{{ argocd_namespace }}"
        annotations:
          kubectl.kubernetes.io/restartedAt: "{{ ansible_date_time.iso8601 }}"
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
  when: helm_binary_check.stat.exists and argocd_es_created.changed
  become: false
  tags: ["apps", "argocd", "secrets"]
