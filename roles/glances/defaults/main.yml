# Title: Installation State
# Description: Whether Glances should be present or absent.
# Type: str
# Required: false
glances_state: present
# Title: Web Interface Port
# Description: Port number for Glances web interface.
# Type: int
# Required: false
glances_port: 61208
# Title: Bind Address
# Description: IP address to bind the web interface (127.0.0.1 for localhost only).
# Type: str
# Required: false
glances_bind_address: "127.0.0.1"
# Title: Virtual Environment Path
# Description: Path where Glances virtual environment will be installed.
# Type: str
# Required: false
glances_venv_path: "/opt/glances"
# Title: Package List
# Description: Glances packages to install (list of pip specifiers, e.g., "glances[all]").
# Type: list
# Required: false
# Install 'all' extras for full sensor support, web server, gpu, etc.
glances_packages:
  # Title: Glances Package
  # Description: Pip package specifier for Glances (include extras as needed).
  # Type: str
  # Required: false
  # Full extras for web UI and sensors
  - "glances[all]"
