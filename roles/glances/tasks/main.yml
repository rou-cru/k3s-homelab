# Check if hddtemp package is available for disk temperature monitoring
- name: Check hddtemp availability
  ansible.builtin.command: apt-cache show hddtemp
  register: glances_hddtemp_available
  changed_when: false
  failed_when: false
  check_mode: no
# Build package list including hddtemp if available
- name: Build Glances system package list
  ansible.builtin.set_fact:
    glances_system_packages: >-
      {{


        ['python3-venv', 'python3-pip', 'lm-sensors']
        + (['hddtemp'] if glances_hddtemp_available.stdout | length > 0 else [])
      }}
# Install system packages required for Glances and hardware monitoring
- name: Install system dependencies for Glances and sensors
  ansible.builtin.apt:
    name: "{{ glances_system_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
# Create dedicated directory for Glances virtual environment
- name: Create directory for Glances venv
  ansible.builtin.file:
    path: "{{ glances_venv_path }}"
    state: directory
    mode: '0755'
# Create Python virtual environment using uv for Glances installation
- name: Create Glances virtual environment (uv)
  ansible.builtin.command: uv venv "{{ glances_venv_path }}"
  args:
    creates: "{{ glances_venv_path }}/bin/python"
  environment:
    PATH: "/root/.cargo/bin:{{ ansible_facts['env']['PATH'] }}"
  notify: Restart glances
# Install Glances with all extras in the virtual environment
- name: Install Glances in virtual environment (uv)
  ansible.builtin.command: >-
    uv pip install --upgrade --python "{{ glances_venv_path }}/bin/python" {{ glances_packages | join(' ') }}
  environment:
    PATH: "/root/.cargo/bin:{{ ansible_facts['env']['PATH'] }}"
  notify: Restart glances
# Deploy systemd service for Glances web interface
- name: Create Systemd service for Glances Web
  ansible.builtin.template:
    src: glances-web.service.j2
    dest: /etc/systemd/system/glances-web.service
    mode: '0644'
  notify: Restart glances
# Enable and start Glances web service
- name: Ensure Glances service is enabled and running
  ansible.builtin.systemd:
    name: glances-web
    state: started
    enabled: true
    daemon_reload: true
