# @docsible Check hddtemp availability
- name: Check hddtemp availability
  ansible.builtin.command: apt-cache show hddtemp
  register: glances_hddtemp_available
  changed_when: false
  failed_when: false
  check_mode: no
# @docsible Build system package list
- name: Build Glances system package list
  ansible.builtin.set_fact:
    glances_system_packages: >-
      {{


        ['python3-venv', 'python3-pip', 'lm-sensors']
        + (['hddtemp'] if glances_hddtemp_available.stdout | length > 0 else [])
      }}
# @docsible Install system dependencies
- name: Install system dependencies for Glances and sensors
  ansible.builtin.apt:
    name: "{{ glances_system_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
# @docsible Create Glances venv directory
- name: Create directory for Glances venv
  ansible.builtin.file:
    path: "{{ glances_venv_path }}"
    state: directory
    mode: '0750'
# @docsible Check uv availability
- name: Check uv availability
  ansible.builtin.stat:
    path: /usr/local/bin/uv
  register: glances_uv_binary
  changed_when: false
# @docsible Validate uv installation
- name: Fail when uv is missing
  ansible.builtin.fail:
    msg: "uv not found at /usr/local/bin/uv. Run the common role to install uv before glances."
  when:
    - not ansible_check_mode
    - not glances_uv_binary.stat.exists
# @docsible Create Python virtual environment with uv
- name: Create Glances virtual environment (uv)
  ansible.builtin.command: uv venv --seed "{{ glances_venv_path }}"
  args:
    creates: "{{ glances_venv_path }}/bin/python"
  environment:
    PATH: "/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
  notify: Restart glances
  when: not ansible_check_mode
# @docsible Install Glances in virtual environment
- name: Install Glances in virtual environment
  ansible.builtin.pip:
    name: "{{ glances_packages }}"
    executable: "{{ glances_venv_path }}/bin/pip"
    extra_args: --upgrade
  notify: Restart glances
  when: not ansible_check_mode
# @docsible Create systemd service for Glances Web
- name: Create Systemd service for Glances Web
  ansible.builtin.template:
    src: glances-web.service.j2
    dest: /etc/systemd/system/glances-web.service
    mode: '0644'
  notify: Restart glances
# @docsible Enable and start Glances service
- name: Ensure Glances service is enabled and running
  ansible.builtin.systemd:
    name: glances-web
    state: started
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode
