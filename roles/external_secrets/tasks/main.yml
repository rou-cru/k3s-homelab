# @docsible Registers External Secrets Helm repository
- name: Ensure External Secrets Helm repo
  kubernetes.core.helm_repository:
    name: external-secrets
    repo_url: https://charts.external-secrets.io
  when: not ansible_check_mode

# @docsible Creates Namespace for External Secrets
- name: Create external-secrets namespace
  kubernetes.core.k8s:
    state: present
    src: "{{ k8s_manifestsDir }}/bootstrap/external-secrets/namespace.yaml"
    kubeconfig: "{{ kubeconfig }}"
  when: not ansible_check_mode

# @docsible Installs External Secrets Operator (Helm)
- name: Deploy External Secrets Operator
  kubernetes.core.helm:
    name: external-secrets
    chart_ref: external-secrets/external-secrets
    release_namespace: "{{ externalSecrets_namespace }}"
    update_repo_cache: true
    create_namespace: false
    chart_version: "{{ externalSecrets_chartVersion | default(omit, true) }}"
    kubeconfig: "{{ kubeconfig }}"
    values_files:
      - "{{ k8s_manifestsDir }}/bootstrap/external-secrets/values.yaml"
    values: >
      {{ lookup('template', playbook_dir + '/k8s/bootstrap/external-secrets/values-override.yaml.j2') | from_yaml }}
  when: not ansible_check_mode
  tags: ["infra"]

# @docsible Waits for Webhook CA Bundle Injection
- name: Wait for external-secrets webhook CA bundle
  kubernetes.core.k8s_info:
    api_version: admissionregistration.k8s.io/v1
    kind: ValidatingWebhookConfiguration
    name: secretstore-validate
    kubeconfig: "{{ kubeconfig }}"
  register: es_webhook_config
  retries: 30
  delay: 5
  until:
    - es_webhook_config.resources | length > 0
    - (es_webhook_config.resources[0].webhooks | default([])
       | selectattr('name', 'equalto', 'validate.clustersecretstore.external-secrets.io')
       | map(attribute='clientConfig.caBundle')
       | list
       | first
       | default('')) | length > 0
  when: not ansible_check_mode
  tags: ["infra"]

# @docsible Waits for Webhook Deployment Readiness
- name: Wait for external-secrets webhook to be ready
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    name: external-secrets-webhook
    namespace: "{{ externalSecrets_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
    kubeconfig: "{{ kubeconfig }}"
  when: not ansible_check_mode
  tags: ["infra"]

# @docsible Creates Secret for OCI/GCP Vault Authentication
- name: Create OCI Auth Secret
  kubernetes.core.k8s:
    state: present
    definition: >
      {{ lookup('template', playbook_dir + '/k8s/bootstrap/external-secrets/oracle-secret.yaml.j2') | from_yaml }}
    kubeconfig: "{{ kubeconfig }}"
  no_log: true
  when: not ansible_check_mode
  tags: ["infra"]

# @docsible Configures ClusterSecretStore (Vault Backend)
- name: Create OCI ClusterSecretStore
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', playbook_dir +
      '/k8s/bootstrap/external-secrets/cluster-secret-store.yaml.j2') | from_yaml }}"
    kubeconfig: "{{ kubeconfig }}"
  no_log: true
  when: not ansible_check_mode
  tags: ["infra"]
