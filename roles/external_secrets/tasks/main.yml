- name: Check if Helm is installed
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: helm_binary_check

- name: Ensure External Secrets Helm repo
  ansible.builtin.command: helm repo add external-secrets https://charts.external-secrets.io
  register: es_repo_add
  changed_when: "'has been added' in es_repo_add.stdout"
  failed_when: es_repo_add.rc != 0 and 'exists' not in es_repo_add.stderr
  when: helm_binary_check.stat.exists

- name: Deploy External Secrets Operator
  kubernetes.core.helm:
    name: external-secrets
    chart_ref: external-secrets/external-secrets
    release_namespace: "{{ external_secrets_namespace }}"
    update_repo_cache: true
    create_namespace: true
    chart_version: >-
      {{ external_secrets_chart_version | default(omit)
         if external_secrets_chart_version != '' else omit }}
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
    values:
      installCRDs: true
      serviceMonitor:
        enabled: "{{ external_secrets_servicemonitor_enabled }}"
      webhook:
        serviceMonitor:
          enabled: "{{ external_secrets_servicemonitor_enabled }}"
        certManager:
          enabled: true
          addInjectorAnnotations: true
          cert:
            create: true
            issuerRef:
              group: cert-manager.io
              kind: ClusterIssuer
              name: "{{ external_secrets_webhook_issuer_name }}"
      certController:
        enabled: false
        serviceMonitor:
          enabled: "{{ external_secrets_servicemonitor_enabled }}"
      grafanaDashboard:
        enabled: "{{ external_secrets_grafana_dashboard_enabled }}"
  become: false
  when: helm_binary_check.stat.exists
  tags: ["cluster", "infrastructure", "external-secrets"]

- name: Wait for external-secrets webhook CA bundle
  kubernetes.core.k8s_info:
    api_version: admissionregistration.k8s.io/v1
    kind: ValidatingWebhookConfiguration
    name: secretstore-validate
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
  register: es_webhook_config
  retries: 30
  delay: 5
  until:
    - es_webhook_config.resources | length > 0
    - (es_webhook_config.resources[0].webhooks
       | selectattr('name', 'equalto', 'validate.clustersecretstore.external-secrets.io')
       | map(attribute='clientConfig.caBundle')
       | list
       | first
       | default('')) | length > 0
  become: false
  when: helm_binary_check.stat.exists
  tags: ["cluster", "infrastructure", "external-secrets"]

- name: Wait for external-secrets webhook to be ready
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    name: external-secrets-webhook
    namespace: "{{ external_secrets_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
  become: false
  when: helm_binary_check.stat.exists
  tags: ["cluster", "infrastructure", "external-secrets"]

- name: Create OCI Auth Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: oracle-secret
        namespace: "{{ external_secrets_namespace }}"
        labels:
          type: oracle
      type: Opaque
      stringData:
        privateKey: "{{ lookup('file', lookup('ini', 'key_file', section='DEFAULT', file='.oci')) }}"
        fingerprint: "{{ lookup('ini', 'fingerprint', section='DEFAULT', file='.oci') }}"
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
  become: false
  when: helm_binary_check.stat.exists
  tags: ["cluster", "infrastructure", "external-secrets", "oci"]

- name: Create OCI ClusterSecretStore
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      metadata:
        name: oci-vault
      spec:
        provider:
          oracle:
            vault: "{{ lookup('ini', 'vault', section='DEFAULT', file='.oci') }}"
            region: "{{ lookup('ini', 'region', section='DEFAULT', file='.oci') }}"
            principalType: UserPrincipal
            auth:
              user: "{{ lookup('ini', 'user', section='DEFAULT', file='.oci') }}"
              tenancy: "{{ lookup('ini', 'tenancy', section='DEFAULT', file='.oci') }}"
              secretRef:
                privatekey:
                  name: oracle-secret
                  key: privateKey
                  namespace: "{{ external_secrets_namespace }}"
                fingerprint:
                  name: oracle-secret
                  key: fingerprint
                  namespace: "{{ external_secrets_namespace }}"
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
  become: false
  when: helm_binary_check.stat.exists
  tags: ["cluster", "infrastructure", "external-secrets", "oci"]
