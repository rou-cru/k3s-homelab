# @docsible Verify Helm CLI availability
- name: Check if Helm is installed
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: helm_binary_check
  failed_when: false

# @docsible Add External Secrets Helm repository
- name: Ensure External Secrets Helm repo
  kubernetes.core.helm_repository:
    name: external-secrets
    repo_url: https://charts.external-secrets.io
  when:
    - helm_binary_check.stat.exists
    - not ansible_check_mode

# @docsible Deploy External Secrets Operator via Helm
- name: Deploy External Secrets Operator
  kubernetes.core.helm:
    name: external-secrets
    chart_ref: external-secrets/external-secrets
    release_namespace: "{{ externalSecrets_namespace }}"
    update_repo_cache: true
    create_namespace: true
    chart_version: "{{ externalSecrets_chartVersion | default(omit, true) }}"
    kubeconfig: "{{ kubeconfig }}"
    values:
      installCRDs: true

      replicaCount: 1
      podDisruptionBudget:
        enabled: false

      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          memory: 512Mi
      securityContext:
        readOnlyRootFilesystem: false

      log:
        level: warn

      genericTargets:
        enabled: true

      serviceMonitor:
        enabled: "{{ externalSecrets_serviceMonitorEnabled }}"

      webhook:
        replicaCount: 1
        podDisruptionBudget:
          enabled: false
        serviceMonitor:
          enabled: "{{ externalSecrets_serviceMonitorEnabled }}"
        certManager:
          enabled: true
          addInjectorAnnotations: true
          cert:
            create: true
            issuerRef:
              group: cert-manager.io
              kind: ClusterIssuer
              name: "{{ externalSecrets_webhookIssuerName }}"

      certController:
        enabled: false

      grafanaDashboard:
        enabled: "{{ externalSecrets_grafanaDashboardEnabled }}"
  become: false
  when:
    - helm_binary_check.stat.exists
    - not ansible_check_mode
  tags: ["cluster", "infrastructure", "external-secrets"]

# @docsible Wait for webhook CA bundle population
- name: Wait for external-secrets webhook CA bundle
  kubernetes.core.k8s_info:
    api_version: admissionregistration.k8s.io/v1
    kind: ValidatingWebhookConfiguration
    name: secretstore-validate
    kubeconfig: "{{ kubeconfig }}"
  register: es_webhook_config
  retries: 30
  delay: 5
  until:
    - es_webhook_config.resources | length > 0
    - (es_webhook_config.resources[0].webhooks | default([])
       | selectattr('name', 'equalto', 'validate.clustersecretstore.external-secrets.io')
       | map(attribute='clientConfig.caBundle')
       | list
       | first
       | default('')) | length > 0
  become: false
  when:
    - helm_binary_check.stat.exists
    - not ansible_check_mode
  tags: ["cluster", "infrastructure", "external-secrets"]

# @docsible Wait for webhook deployment readiness
- name: Wait for external-secrets webhook to be ready
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    name: external-secrets-webhook
    namespace: "{{ externalSecrets_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
    kubeconfig: "{{ kubeconfig }}"
  become: false
  when:
    - helm_binary_check.stat.exists
    - not ansible_check_mode
  tags: ["cluster", "infrastructure", "external-secrets"]

# @docsible Create OCI Vault authentication secret
- name: Create OCI Auth Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: oracle-secret
        namespace: "{{ externalSecrets_namespace }}"
        labels:
          type: oracle
      type: Opaque
      stringData:
        privateKey: "{{ lookup('file', lookup('ini', 'key_file', section='DEFAULT', file=oci_configFile)) }}"
        fingerprint: "{{ lookup('ini', 'fingerprint', section='DEFAULT', file=oci_configFile) }}"
    kubeconfig: "{{ kubeconfig }}"
  become: false
  no_log: true
  when:
    - helm_binary_check.stat.exists
    - not ansible_check_mode
  tags: ["cluster", "infrastructure", "external-secrets", "oci"]

# @docsible Create OCI Vault ClusterSecretStore
- name: Create OCI ClusterSecretStore
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      metadata:
        name: oci-vault
      spec:
        provider:
          oracle:
            vault: "{{ lookup('ini', 'vault', section='DEFAULT', file=oci_configFile) }}"
            region: "{{ lookup('ini', 'region', section='DEFAULT', file=oci_configFile) }}"
            principalType: UserPrincipal
            auth:
              user: "{{ lookup('ini', 'user', section='DEFAULT', file=oci_configFile) }}"
              tenancy: "{{ lookup('ini', 'tenancy', section='DEFAULT', file=oci_configFile) }}"
              secretRef:
                privatekey:
                  name: oracle-secret
                  key: privateKey
                  namespace: "{{ externalSecrets_namespace }}"
                fingerprint:
                  name: oracle-secret
                  key: fingerprint
                  namespace: "{{ externalSecrets_namespace }}"
    kubeconfig: "{{ kubeconfig }}"
  become: false
  no_log: true
  when:
    - helm_binary_check.stat.exists
    - not ansible_check_mode
  tags: ["cluster", "infrastructure", "external-secrets", "oci"]
