argument_specs:
  main:
    short_description: Installs and configures Cilium CNI.
    description: |
      Deploys Cilium CNI using Helm, managing values templating and rollout verification.
    author: rc
    options:
      cilium_chartVersion:
        type: str
        required: false
        default: "1.19.3"
        description: Version of the Cilium Helm chart to install.
      cilium_chartName:
        type: str
        required: false
        default: "cilium"
        description: Name of the chart in the repository (e.g., cilium/cilium).
      cilium_namespace:
        type: str
        required: false
        default: "kube-system"
        description: Kubernetes namespace where Cilium should be installed.
      cilium_rolloutTimeout:
        type: int
        required: false
        default: 300
        description: Timeout (seconds) for waiting for Cilium pods rollout.
      cilium_waitRetries:
        type: int
        required: false
        default: 60
        description: Number of retries when checking for DaemonSet creation.
      cilium_waitDelay:
        type: int
        required: false
        default: 5
        description: Delay (seconds) between DaemonSet existence checks.
