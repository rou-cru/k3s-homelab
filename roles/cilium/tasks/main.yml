# @docsible Create temporary values file
- name: Create temporary values file
  ansible.builtin.tempfile:
    state: file
    suffix: "-cilium-values.yaml"
  register: cilium_values_tmp
  check_mode: false
  when: not ansible_check_mode
# @docsible Add Cilium Helm repository
- name: Ensure Cilium Helm repo
  kubernetes.core.helm_repository:
    name: cilium
    repo_url: https://helm.cilium.io/
  register: cilium_repo_add
  when: not ansible_check_mode
# @docsible Generate Cilium values from template
- name: Template Cilium values file
  ansible.builtin.template:
    src: cilium-values.yaml.j2
    dest: "{{ cilium_values_tmp.path }}"
    mode: "0600"
  check_mode: false
  when: not ansible_check_mode
# @docsible Deploy Cilium CNI via Helm
- name: Install Cilium via Helm
  kubernetes.core.helm:
    release_name: cilium
    chart_ref: cilium/{{ cilium_chartName }}
    release_namespace: "{{ cilium_namespace }}"
    create_namespace: true
    values_files:
      - "{{ cilium_values_tmp.path }}"
    chart_version: "{{ cilium_chartVersion }}"
    kubeconfig: "{{ kubeconfig }}"
    update_repo_cache: true # Ensure latest chart information
  when: not ansible_check_mode
# @docsible Wait for Cilium DaemonSet creation
- name: Wait for Cilium DaemonSet to be created
  kubernetes.core.k8s_info:
    kind: DaemonSet
    name: cilium
    namespace: "{{ cilium_namespace }}"
    kubeconfig: "{{ kubeconfig }}"
  register: cilium_ds_check
  until: cilium_ds_check.resources | length > 0
  retries: "{{ cilium_waitRetries }}"
  delay: "{{ cilium_waitDelay }}"
  when: not ansible_check_mode

# @docsible Wait for all Cilium pods to be ready
- name: Wait for cilium pods
  kubernetes.core.k8s_info:
    kind: DaemonSet
    name: cilium
    namespace: "{{ cilium_namespace }}"
    kubeconfig: "{{ kubeconfig }}"
  register: cilium_ds
  until: >-
    cilium_ds.resources | length > 0 and
    cilium_ds.resources[0].status.numberReady == cilium_ds.resources[0].status.desiredNumberScheduled and
    cilium_ds.resources[0].status.updatedNumberScheduled == cilium_ds.resources[0].status.desiredNumberScheduled
  retries: "{{ cilium_waitRetries }}"
  delay: "{{ cilium_waitDelay }}"
  when: not ansible_check_mode

# NOTE: Gateway is deployed in cert_manager/acme.yml after certificates are ready

# @docsible Cleanup temporary values file
- name: Remove temporary values file
  ansible.builtin.file:
    path: "{{ cilium_values_tmp.path }}"
    state: absent
  changed_when: false
  when: not ansible_check_mode
