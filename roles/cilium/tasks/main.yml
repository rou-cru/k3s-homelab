# @docsible Registers Cilium Helm repository
- name: Ensure Cilium Helm repo
  kubernetes.core.helm_repository:
    name: cilium
    repo_url: https://helm.cilium.io/
  register: cilium_repo_add
  when: not ansible_check_mode

# @docsible Installs Cilium (values.yaml + dynamic overrides)
- name: Install Cilium via Helm
  kubernetes.core.helm:
    release_name: cilium
    chart_ref: cilium/{{ cilium_chartName }}
    release_namespace: "{{ cilium_namespace }}"
    create_namespace: false
    values_files:
      - "{{ k8s_manifestsDir }}/bootstrap/cilium/values.yaml"
    values: "{{ lookup('template', playbook_dir + '/k8s/bootstrap/cilium/values-override.yaml.j2') | from_yaml }}"
    chart_version: "{{ cilium_chartVersion }}"
    kubeconfig: "{{ kubeconfig }}"
    update_repo_cache: true
  when: not ansible_check_mode

# @docsible Waits for Cilium DaemonSet existence
- name: Wait for Cilium DaemonSet to be created
  kubernetes.core.k8s_info:
    kind: DaemonSet
    name: cilium
    namespace: "{{ cilium_namespace }}"
    kubeconfig: "{{ kubeconfig }}"
  register: cilium_ds_check
  until: cilium_ds_check.resources | default([]) | length > 0
  retries: "{{ cilium_waitRetries }}"
  delay: "{{ cilium_waitDelay }}"
  when: not ansible_check_mode

# @docsible Waits for full Cilium DaemonSet rollout
- name: Wait for cilium pods
  kubernetes.core.k8s_info:
    kind: DaemonSet
    name: cilium
    namespace: "{{ cilium_namespace }}"
    kubeconfig: "{{ kubeconfig }}"
  register: cilium_ds
  until: >-
    cilium_ds.resources | default([]) | length > 0 and
    cilium_ds.resources[0].status.numberReady == cilium_ds.resources[0].status.desiredNumberScheduled and
    cilium_ds.resources[0].status.updatedNumberScheduled == cilium_ds.resources[0].status.desiredNumberScheduled
  retries: "{{ cilium_waitRetries }}"
  delay: "{{ cilium_waitDelay }}"
  when: not ansible_check_mode
