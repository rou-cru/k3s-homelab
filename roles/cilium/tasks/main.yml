---
# Instalación de Cilium CNI como HelmChart en K3s
- name: Ensure manifests directory exists
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    mode: "0755"

- name: Copy Cilium values file
  ansible.builtin.copy:
    src: cilium-values.yaml
    dest: /var/lib/rancher/k3s/server/manifests/cilium-values.yaml
    mode: "0644"

- name: Build Cilium HelmChart manifest
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/server/manifests/cilium-helmchart.yaml
    mode: "0644"
    content: |
      apiVersion: helm.cattle.io/v1
      kind: HelmChart
      metadata:
        name: cilium
        namespace: kube-system
      spec:
        repo: "{{ cilium_chart_repo }}"
        chart: "{{ cilium_chart_name }}"
        version: "{{ cilium_version }}"
        targetNamespace: "{{ cilium_namespace }}"
        valuesFile: /var/lib/rancher/k3s/server/manifests/cilium-values.yaml

- name: Wait for cilium pods
  ansible.builtin.shell: |
    k3s kubectl -n kube-system rollout status ds/cilium --timeout="{{ cilium_rollout_timeout }}s"
  register: cilium_rollout
  changed_when: false
  failed_when: cilium_rollout.rc != 0

# Verificación final - muestra estado del nodo con Cilium operativo
- name: Show node status
  ansible.builtin.command: k3s kubectl get nodes -o wide
  register: nodes_out
  changed_when: false
