# Create temporary file for Cilium Helm values configuration
- name: Create temporary values file
  ansible.builtin.tempfile:
    state: file
    suffix: "-cilium-values.yaml"
  register: cilium_values_tmp
  check_mode: false
  when: not ansible_check_mode
# Add Cilium Helm repository for CNI installation
- name: Ensure Cilium Helm repo
  kubernetes.core.helm_repository:
    name: cilium
    repo_url: https://helm.cilium.io/
  register: cilium_repo_add
  when: not ansible_check_mode
# Generate Cilium configuration from Jinja2 template
- name: Template Cilium values file
  ansible.builtin.template:
    src: cilium-values.yaml.j2
    dest: "{{ cilium_values_tmp.path }}"
    mode: "0600"
  check_mode: false
  when: not ansible_check_mode
# Deploy Cilium CNI using Helm with custom configuration
- name: Install Cilium via Helm
  kubernetes.core.helm:
    release_name: cilium
    chart_ref: cilium/{{ cilium_chart_name }}
    release_namespace: "{{ cilium_namespace }}"
    create_namespace: true
    values_files:
      - "{{ cilium_values_tmp.path }}"
    chart_version: "{{ cilium_version }}"
    kubeconfig: "{{ k8s_kubeconfig }}"
    update_repo_cache: true # Ensure latest chart information
  when: not ansible_check_mode
# Verify Cilium DaemonSet creation before proceeding
- name: Wait for Cilium DaemonSet to be created
  kubernetes.core.k8s_info:
    kind: DaemonSet
    name: cilium
    namespace: "{{ cilium_namespace }}"
    kubeconfig: "{{ k8s_kubeconfig }}"
  register: cilium_ds_check
  until: cilium_ds_check.resources | length > 0
  retries: "{{ cilium_wait_retries | default(60) }}"
  delay: "{{ cilium_wait_delay | default(5) }}"
  when: not ansible_check_mode

# Wait for cilium pods
- name: Wait for cilium pods
  kubernetes.core.k8s_info:
    kind: DaemonSet
    name: cilium
    namespace: "{{ cilium_namespace }}"
    kubeconfig: "{{ k8s_kubeconfig }}"
  register: cilium_ds
  until: >-
    cilium_ds.resources | length > 0 and
    cilium_ds.resources[0].status.numberReady == cilium_ds.resources[0].status.desiredNumberScheduled and
    cilium_ds.resources[0].status.updatedNumberScheduled == cilium_ds.resources[0].status.desiredNumberScheduled
  retries: "{{ (cilium_rollout_timeout | int / 5) | int }}"
  delay: 5
  when: not ansible_check_mode

# Deploy General Cluster Gateway
- name: Deploy Cluster Gateway
  ansible.builtin.import_tasks: gateway.yml
  become: false
  tags: ["cluster", "network", "gateway"]
  when: not ansible_check_mode

# Clean up temporary configuration file
- name: Remove temporary values file
  ansible.builtin.file:
    path: "{{ cilium_values_tmp.path }}"
    state: absent
  changed_when: false
  when: not ansible_check_mode
