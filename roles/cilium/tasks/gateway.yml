- name: Deploy General Cluster Gateway
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: public-gateway
        namespace: "{{ cilium_namespace }}"
        annotations:
          # Explicitly set service type to ClusterIP for Cloudflare Tunnel integration
          io.cilium/service-type: "ClusterIP"
      spec:
        gatewayClassName: cilium
        listeners:
          - name: http
            protocol: HTTP
            port: 80
            allowedRoutes:
              namespaces:
                from: All
          - name: https
            protocol: HTTPS
            port: 443
            allowedRoutes:
              namespaces:
                from: All
          # Note: TLS Termination will be handled here,
          # but requires a certificateRef which we will add later with cert-manager
    kubeconfig: "{{ kubeconfig }}"
  when: not ansible_check_mode
