---
# Title: Cilium Version
# Description: Version of the Cilium Helm chart to install.
# Type: str
# Required: false
cilium_version: "1.18.5"
# Title: Chart Name
# Description: Name of the chart in the repository (e.g., cilium/cilium).
# Type: str
# Required: false
cilium_chart_name: "cilium"
# Title: Namespace
# Description: Kubernetes namespace where Cilium should be installed.
# Type: str
# Required: false
cilium_namespace: "kube-system"
# Title: Rollout Timeout
# Description: Timeout (seconds) for waiting for Cilium pods rollout.
# Type: int
# Required: false
cilium_rollout_timeout: 300
# Title: Wait Retries
# Description: Number of retries when checking for DaemonSet creation.
# Type: int
# Required: false
cilium_wait_retries: 60
# Title: Wait Delay
# Description: Delay (seconds) between DaemonSet existence checks.
# Type: int
# Required: false
cilium_wait_delay: 5
# Title: Cilium devices
# Description: Space-separated device patterns to include (exclude tailscale0).
# Type: str
# Required: false
cilium_devices: "eth+ en+ ens+"
