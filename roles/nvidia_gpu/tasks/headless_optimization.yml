# @docsible Installs Xorg for headless fan control
- name: Install X11 deps
  ansible.builtin.apt:
    name:
      - xserver-xorg-core
      - xserver-xorg-video-nvidia-{{ nvidia_driverTarget | regex_replace('^nvidia-driver-', '') }}
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: nvidia_active | default(false) | bool

# @docsible Configures Xorg with Coolbits for fan control
- name: Configure xorg
  ansible.builtin.template:
    src: xorg.conf.j2
    dest: /etc/X11/xorg.conf
    mode: "0640"
    owner: root
    group: root
  register: nvidia_xorgConf
  when: nvidia_active | default(false) | bool

# @docsible Deploys nvidia-persistenced service
- name: Deploy persistence svc
  ansible.builtin.copy:
    src: nvidia-persistence.service
    dest: /etc/systemd/system/nvidia-persistence.service
    mode: "0640"
    owner: root
    group: root
  register: nvidia_persistenceService
  when: nvidia_active | default(false) | bool

# @docsible Deploys headless Xorg service
- name: Deploy Xorg svc
  ansible.builtin.copy:
    src: nvidia-xorg.service
    dest: /etc/systemd/system/nvidia-xorg.service
    mode: "0640"
    owner: root
    group: root
  register: nvidia_xorgService
  when: nvidia_active | default(false) | bool

# @docsible Reloads systemd daemon
- name: Reload systemd (nvidia)
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - nvidia_active | default(false) | bool
    - nvidia_persistenceService.changed or nvidia_xorgService.changed

# @docsible Starts nvidia-persistenced
- name: Start persistence svc
  ansible.builtin.systemd:
    name: nvidia-persistence.service
    enabled: true
    state: started
  when: nvidia_active | default(false) | bool

# @docsible Starts headless Xorg on display :1
- name: Start Xorg svc
  ansible.builtin.systemd:
    name: nvidia-xorg.service
    enabled: true
    state: started
  when:
    - nvidia_active | default(false) | bool
    - nvidia_headlessX11Enabled | default(true) | bool

# @docsible Waits for X11 socket availability
- name: Wait for X server
  ansible.builtin.wait_for:
    path: /tmp/.X1-lock
    timeout: 30
  when:
    - nvidia_active | default(false) | bool
    - nvidia_headlessX11Enabled | default(true) | bool
