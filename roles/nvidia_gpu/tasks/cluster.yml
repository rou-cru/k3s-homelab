- name: NVIDIA GPU cluster setup
  tags: ["cluster", "nvidia"]
  block:
    - name: Check if Helm is installed
      ansible.builtin.command: which helm
      register: helm_binary_check
      changed_when: false
      failed_when: false

    - name: Ensure NVIDIA Helm repo
      ansible.builtin.command: helm repo add nvdp https://nvidia.github.io/k8s-device-plugin
      register: nvdp_repo_add
      changed_when: "'has been added' in nvdp_repo_add.stdout"
      failed_when: nvdp_repo_add.rc != 0 and 'exists' not in nvdp_repo_add.stderr
      when: helm_binary_check.rc == 0

    - name: Create temp values
      ansible.builtin.tempfile:
        state: file
        suffix: "-nvidia-device-plugin-values.yaml"
      register: nvidia_device_plugin_values_tmp
      when: helm_binary_check.rc == 0

    - name: Copy values
      ansible.builtin.copy:
        src: nvidia-device-plugin-values.yaml
        dest: "{{ nvidia_device_plugin_values_tmp.path }}"
        mode: "0600"
      when: helm_binary_check.rc == 0

    - name: Install device plugin
      kubernetes.core.helm:
        release_name: nvidia-device-plugin
        chart_ref: nvdp/nvidia-device-plugin
        release_namespace: kube-system
        update_repo_cache: true
        values_files:
          - "{{ nvidia_device_plugin_values_tmp.path }}"
        chart_version: "{{ nvidia_gpu_device_plugin_version }}"
        kubeconfig: "/home/{{ ansible_user }}/.kube/config"
      when: helm_binary_check.rc == 0
    - name: Wait for daemonset
      ansible.builtin.command: >-
        kubectl -n kube-system rollout status ds/nvidia-device-plugin --timeout=300s
      register: nvidia_device_plugin_rollout
      changed_when: false
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      when: helm_binary_check.rc == 0
    - name: Check GPU resources
      ansible.builtin.shell: >-
        kubectl get nodes -o json | jq -r '.items[].status.capacity["nvidia.com/gpu"]'
      register: gpu_resources_check
      changed_when: false
      failed_when: gpu_resources_check.rc != 0 and 'not found' not in gpu_resources_check.stderr
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      when: helm_binary_check.rc == 0
    - name: Debug GPU resources
      ansible.builtin.debug:
        msg: "✅ GPU resources detected: {{ gpu_resources_check.stdout_lines | join(', ') }}"
        verbosity: 1
      when: helm_binary_check.rc == 0
  rescue:
    - name: Report NVIDIA GPU cluster setup failure
      ansible.builtin.debug:
        msg: >-
          NVIDIA GPU cluster setup failed at {{ ansible_failed_task.name }}: {{ ansible_failed_result | to_nice_json }}
    - name: Fail NVIDIA GPU cluster setup
      ansible.builtin.fail:
        msg: "NVIDIA GPU cluster setup failed"
  always:
    - name: Remove temporary values file
      ansible.builtin.file:
        path: "{{ nvidia_device_plugin_values_tmp.path }}"
        state: absent
      when: nvidia_device_plugin_values_tmp is defined
      changed_when: false
