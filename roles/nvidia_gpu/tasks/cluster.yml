- name: NVIDIA GPU cluster setup
  tags: ["cluster", "nvidia"]
  block:
    - name: Check if Helm is installed
      ansible.builtin.command: which helm
      register: helm_binary_check
      changed_when: false
      failed_when: false

    - name: Warn if Helm is not available
      ansible.builtin.debug:
        msg: "⚠️ Helm not found - skipping NVIDIA device plugin installation"
      when: helm_binary_check.rc != 0

    - name: Ensure NVIDIA Helm repo
      kubernetes.core.helm_repository:
        name: nvdp
        repo_url: https://nvidia.github.io/k8s-device-plugin
      when: helm_binary_check.rc == 0

    - name: Create temp values
      ansible.builtin.tempfile:
        state: file
        suffix: "-nvidia-device-plugin-values.yaml"
      register: nvidia_device_plugin_values_tmp
      when: helm_binary_check.rc == 0

    - name: Copy values
      ansible.builtin.copy:
        src: nvidia-device-plugin-values.yaml
        dest: "{{ nvidia_device_plugin_values_tmp.path }}"
        mode: "0600"
      when: helm_binary_check.rc == 0

    - name: Install device plugin
      kubernetes.core.helm:
        release_name: nvidia-device-plugin
        chart_ref: nvdp/nvidia-device-plugin
        release_namespace: kube-system
        update_repo_cache: true
        values_files:
          - "{{ nvidia_device_plugin_values_tmp.path }}"
        chart_version: "{{ nvidia_gpu_device_plugin_version }}"
        kubeconfig: "{{ k8s_kubeconfig }}"
      when: helm_binary_check.rc == 0

    - name: Wait for daemonset
      kubernetes.core.k8s_info:
        kind: DaemonSet
        namespace: kube-system
        kubeconfig: "{{ k8s_kubeconfig }}"
        label_selectors:
          - app.kubernetes.io/name=nvidia-device-plugin
      register: nvdp_ds
      until: >-
        nvdp_ds.resources | length > 0 and
        nvdp_ds.resources[0].status.numberReady | default(0) > 0
      retries: "{{ global_wait_retries }}"
      delay: "{{ global_wait_delay }}"
      when: helm_binary_check.rc == 0

    - name: Check GPU resources
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        kubeconfig: "{{ k8s_kubeconfig }}"
      register: gpu_nodes_info
      when: helm_binary_check.rc == 0

    - name: Extract GPU capacities from nodes
      ansible.builtin.set_fact:
        gpu_resources: >-
          {{ gpu_nodes_info.resources | default([])
             | map(attribute='status.capacity', default={})
             | map(attribute='nvidia.com/gpu', default='0')
             | list }}
      when: helm_binary_check.rc == 0

    - name: Debug GPU resources
      ansible.builtin.debug:
        msg: "✅ GPU resources detected: {{ gpu_resources | join(', ') }}"
        verbosity: 1
      when: helm_binary_check.rc == 0
  when: not ansible_check_mode
  rescue:
    - name: Report NVIDIA GPU cluster setup failure
      ansible.builtin.debug:
        msg: >-
          NVIDIA GPU cluster setup failed at {{ ansible_failed_task.name }}: {{ ansible_failed_result | to_json }}
    - name: Fail NVIDIA GPU cluster setup
      ansible.builtin.fail:
        msg: "NVIDIA GPU cluster setup failed"
  always:
    - name: Remove temporary values file
      ansible.builtin.file:
        path: "{{ nvidia_device_plugin_values_tmp.path }}"
        state: absent
      when: (nvidia_device_plugin_values_tmp | default({})).path is defined
      changed_when: false
