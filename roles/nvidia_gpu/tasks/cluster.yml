# @docsible Applies NVIDIA GPU cluster integration resources
- name: NVIDIA GPU cluster setup
  tags: ["cluster", "nvidia"]
  block:
    # @docsible Registers NVIDIA Device Plugin Helm Repo
    - name: Ensure NVIDIA Helm repo
      kubernetes.core.helm_repository:
        name: nvdp
        repo_url: https://nvidia.github.io/k8s-device-plugin

    # @docsible Registers 'nvidia' RuntimeClass
    - name: Apply NVIDIA RuntimeClass
      kubernetes.core.k8s:
        src: "{{ k8s_manifestsDir }}/bootstrap/runtimes/nvidia/runtime-class.yaml"
        kubeconfig: "{{ kubeconfig }}"
        state: present

    # @docsible Installs NVIDIA Device Plugin via Helm
    - name: Install device plugin
      kubernetes.core.helm:
        release_name: nvidia-device-plugin
        chart_ref: nvdp/nvidia-device-plugin
        release_namespace: kube-system
        update_repo_cache: true
        values_files:
          - "{{ k8s_manifestsDir }}/bootstrap/nvidia/values.yaml"
        chart_version: "{{ nvidia_devicePluginVersion }}"
        kubeconfig: "{{ kubeconfig }}"

    # @docsible Waits for Device Plugin DaemonSet
    - name: Wait for daemonset
      kubernetes.core.k8s_info:
        kind: DaemonSet
        namespace: kube-system
        kubeconfig: "{{ kubeconfig }}"
        label_selectors:
          - app.kubernetes.io/name=nvidia-device-plugin
      register: nvdp_ds
      until: >-
        nvdp_ds.resources | length > 0 and
        (nvdp_ds.resources[0].status.desiredNumberScheduled | default(0)) > 0 and
        (nvdp_ds.resources[0].status.numberReady | default(0)) >=
        (nvdp_ds.resources[0].status.desiredNumberScheduled | default(0))
      retries: "{{ global_waitRetries }}"
      delay: "{{ global_waitDelay }}"

    # @docsible Queries Node status for GPU capacity
    - name: Check GPU resources
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        kubeconfig: "{{ kubeconfig }}"
      register: gpu_nodes_info

    # @docsible Parses GPU capacity from Node status
    - name: Extract GPU capacities from nodes
      ansible.builtin.set_fact:
        gpu_resources: >-
          {{ gpu_nodes_info.resources | default([])
             | map(attribute='status.capacity', default={})
             | map(attribute='nvidia.com/gpu', default='0')
             | list }}

    # @docsible Prints detected GPU count
    - name: Debug GPU resources
      ansible.builtin.debug:
        msg: "GPU resources detected: {{ gpu_resources | join(', ') }}"
        verbosity: 1
  when: not ansible_check_mode
  rescue:
    # @docsible Reports cluster setup failure
    - name: Report NVIDIA GPU cluster setup failure
      ansible.builtin.debug:
        msg: >-
          NVIDIA GPU cluster setup failed at {{ ansible_failed_task.name }}: {{ ansible_failed_result | to_json }}
    # @docsible Fails execution when cluster setup errors
    - name: Fail NVIDIA GPU cluster setup
      ansible.builtin.fail:
        msg: "NVIDIA GPU cluster setup failed"
