---
- name: NVIDIA GPU cluster setup
  tags: ["nvidia", "gpu", "nvidia-cluster"]
  when: nvidia_gpu_active | default(false) | bool
  block:
    - name: Create temporary values file for device plugin
      ansible.builtin.tempfile:
        state: file
        suffix: "-nvidia-device-plugin-values.yaml"
      register: nvidia_device_plugin_values_tmp

    - name: Copy device plugin values to temp file
      ansible.builtin.copy:
        src: nvidia-device-plugin-values.yaml
        dest: "{{ nvidia_device_plugin_values_tmp.path }}"
        mode: "0600"

    - name: Install NVIDIA device plugin via Helm
      kubernetes.core.helm:
        release_name: nvidia-device-plugin
        chart_ref: nvdp/nvidia-device-plugin
        release_namespace: kube-system
        values_files:
          - "{{ nvidia_device_plugin_values_tmp.path }}"
        chart_version: "{{ nvidia_gpu_device_plugin_version }}"
        kubeconfig: "/home/{{ ansible_user }}/.kube/config"

    - name: Wait for device plugin daemonset
      ansible.builtin.command: >-
        kubectl -n kube-system rollout status ds/nvidia-device-plugin --timeout=300s >/dev/null 2>&1
      register: nvidia_device_plugin_rollout
      changed_when: false
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"

    - name: Check GPU resources available
      ansible.builtin.shell: >-
        kubectl get nodes -o json | jq -r '.items[].status.capacity["nvidia.com/gpu"]'
      register: gpu_resources_check
      changed_when: false
      failed_when: false
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"

    - name: Debug GPU resources
      ansible.builtin.debug:
        msg: "✅ GPU resources detected: {{ gpu_resources_check.stdout_lines | join(', ') }}"
  rescue:
    - name: Report NVIDIA GPU cluster setup failure
      ansible.builtin.debug:
        msg: >-
          NVIDIA GPU cluster setup failed at
          {{ ansible_failed_task.name }}: {{ ansible_failed_result | to_nice_json }}
    - name: Fail NVIDIA GPU cluster setup
      ansible.builtin.fail:
        msg: "NVIDIA GPU cluster setup failed"
  always:
    - name: Remove temporary values file
      ansible.builtin.file:
        path: "{{ nvidia_device_plugin_values_tmp.path }}"
        state: absent
      when: nvidia_device_plugin_values_tmp is defined
      changed_when: false
