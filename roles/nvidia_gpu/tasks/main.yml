---
# Instalación de drivers NVIDIA y plugin de dispositivos para Kubernetes
- name: GPU Setup Block
  when: gpu_setup | bool
  block:
    # 1. Hardware Check
    - name: Detect NVIDIA GPU (Vendor ID 10de)
      ansible.builtin.command: lspci -nm
      register: lspci_out
      changed_when: false

    # Valida hardware requerido antes de continuar con instalación
    - name: Abort if no NVIDIA GPU found
      ansible.builtin.fail:
        msg: "No NVIDIA GPU (Vendor ID 10de) detected on this host."
      when: '"10de" not in lspci_out.stdout'

    - name: Install driver tools
      ansible.builtin.apt:
        name:
          - ubuntu-drivers-common
          - linux-headers-generic
          - software-properties-common
        state: present

    - name: Detect NVIDIA driver
      ansible.builtin.shell: |
        set -o pipefail
        ubuntu-drivers devices 2>/dev/null | grep -oP 'driver\s+:\s+\K(nvidia-driver-\d+)(?=\s.*recommended)'
      args:
        executable: /bin/bash
      register: detected_driver
      changed_when: false
      when: nvidia_driver_package == "auto"

    - name: Set detected driver
      ansible.builtin.set_fact:
        nvidia_driver_target: "{{ detected_driver.stdout | trim }}"
      when:
        - nvidia_driver_package == "auto"
        - detected_driver.stdout | length > 0

    - name: Set driver fallback
      ansible.builtin.set_fact:
        nvidia_driver_target: "{{ nvidia_driver_fallback }}"
      when:
        - nvidia_driver_package == "auto"
        - (detected_driver.skipped is defined and detected_driver.skipped) or (detected_driver.stdout | length == 0)

    - name: Set manual driver
      ansible.builtin.set_fact:
        nvidia_driver_target: "{{ nvidia_driver_package }}"
      when: nvidia_driver_package != "auto"

    - name: Blacklist nouveau driver
      ansible.builtin.copy:
        dest: /etc/modprobe.d/blacklist-nouveau.conf
        content: |
          blacklist nouveau
          options nouveau modeset=0
        mode: "0644"
      register: blacklist_nouveau

    - name: Update initramfs if blacklist changed  # noqa: no-handler
      ansible.builtin.command: update-initramfs -u
      when: blacklist_nouveau.changed
      changed_when: true

    # Deriva el paquete nvidia-utils del driver detectado (ej: nvidia-driver-535 -> nvidia-utils-535)
    - name: Calculate nvidia-utils package name
      ansible.builtin.set_fact:
        nvidia_utils_package: "nvidia-utils-{{ nvidia_driver_target | regex_replace('^nvidia-driver-', '') }}"

    - name: Install NVIDIA Driver
      ansible.builtin.apt:
        name:
          - "{{ nvidia_driver_target }}"
          - "{{ nvidia_utils_package }}"
        state: present
      register: driver_install

    - name: Reboot if driver installed
      ansible.builtin.reboot:
        msg: "Rebooting to load NVIDIA drivers"
        connect_timeout: 5
        reboot_timeout: "{{ nvidia_reboot_timeout }}"
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami
      when: driver_install.changed or blacklist_nouveau.changed

    - name: Add Toolkit GPG Key
      ansible.builtin.apt_key:
        url: "{{ nvidia_toolkit_gpg_url }}"
        state: present

    - name: Add Toolkit Repository
      ansible.builtin.get_url:
        url: "{{ nvidia_toolkit_repo_url }}"
        dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
        mode: "0644"
      register: repo_added

    - name: Install Toolkit
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present

    - name: Ensure containerd config dir exists
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/agent/etc/containerd/
        state: directory
        mode: "0755"

    - name: Deploy containerd config template
      ansible.builtin.template:
        src: config.toml.tmpl
        dest: /var/lib/rancher/k3s/agent/etc/containerd/config.toml.tmpl
        mode: "0644"
      notify: Restart K3s

    - name: Create Device Plugin directory
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/server/manifests/nvidia-device-plugin
        state: directory
        mode: "0755"

    - name: Copy Device Plugin values
      ansible.builtin.copy:
        src: nvidia-device-plugin-values.yaml
        dest: /var/lib/rancher/k3s/server/manifests/nvidia-device-plugin/values.yaml
        mode: "0644"

    # HelmChart CRD para K3s - instala el plugin de dispositivos NVIDIA automáticamente
    - name: Deploy Device Plugin HelmChart
      ansible.builtin.copy:
        dest: /var/lib/rancher/k3s/server/manifests/nvidia-device-plugin-helmchart.yaml
        mode: "0644"
        content: |
          apiVersion: helm.cattle.io/v1
          kind: HelmChart
          metadata:
            name: nvidia-device-plugin
            namespace: kube-system
          spec:
            repo: "{{ nvidia_device_plugin_repo }}"
            chart: "nvidia-device-plugin"
            version: "{{ nvidia_device_plugin_version }}"
            targetNamespace: "kube-system"
            valuesFile: /var/lib/rancher/k3s/server/manifests/nvidia-device-plugin/values.yaml
