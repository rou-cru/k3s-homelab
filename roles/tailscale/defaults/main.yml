# Title: Hostname Prefix
# Description: Prefix for the generated Tailscale hostname (e.g., k3s-hostname).
# Type: str
# Required: false
tailscale_hostname_prefix: "k3s"
# Title: ACL Tags
# Description: Comma-separated list of ACL tags to advertise (e.g., tag:k3s).
# Type: str
# Required: false
tailscale_tags: ""
# Title: Accept DNS
# Description: Whether to accept DNS configuration from the tailnet ("true"/"false").
# Type: str
# Required: false
tailscale_accept_dns: "true"
# Title: Enable SSH
# Description: Whether to enable Tailscale SSH ("true"/"false").
# Type: str
# Required: false
tailscale_ssh: "true"
# Title: Tailscale install script checksum
# Description: SHA256 for https://tailscale.com/install.sh (pin to avoid supply-chain drift).
# Type: str
# Required: false
tailscale_install_script_checksum: "39e5b9185e9329955b324a48c13d4863c3a93f814260336cf0d4ad92a0aac3d3"
# Title: Exit Node
# Description: Whether to advertise this node as a Tailscale exit node.
# Type: bool
# Required: false
tailscale_exit_node_enabled: false
# Title: Advertise Routes
# Description: CIDR routes to advertise to the tailnet (e.g., "10.42.0.0/16,10.43.0.0/16").
# Type: str
# Required: false
tailscale_advertise_routes: ""
