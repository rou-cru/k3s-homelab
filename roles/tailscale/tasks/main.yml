# @docsible Check if tailscaled binary is installed at expected path
- name: Check tailscale exists
  ansible.builtin.stat:
    path: /usr/sbin/tailscaled
  register: tailscale_binary_check
  changed_when: false

# @docsible Get tailscale status JSON (only when binary exists)
- name: Check Tailscale status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_json
  changed_when: false
  failed_when: false
  check_mode: false
  when: tailscale_binary_check.stat.exists

# @docsible Parse Tailscale state: installed, daemon_running, is_authenticated
- name: Determine Tailscale state
  vars:
    _tailscale_backend_state: >-
      {{
        (tailscale_status_json.stdout | from_json).BackendState
        if (tailscale_status_json.rc is defined and tailscale_status_json.rc == 0)
        else 'NotInstalled'
      }}
    _tailscale_self_online: >-
      {{
        (tailscale_status_json.rc is defined and tailscale_status_json.rc == 0 and
        (tailscale_status_json.stdout | from_json).Self.Online | default(false))
        or false
      }}
  ansible.builtin.set_fact:
    tailscale_installed: "{{ tailscale_binary_check.stat.exists }}"
    tailscale_daemon_running: "{{ _tailscale_backend_state not in ['Stopped', 'NotInstalled'] }}"
    tailscale_is_authenticated: "{{ _tailscale_backend_state == 'Running' and _tailscale_self_online }}"
    tailscale_backend_state: "{{ _tailscale_backend_state }}"
    tailscale_is_running: "{{ _tailscale_self_online }}"
    tailscale_needs_logout: >-
      {{
        _tailscale_backend_state == 'Running' and
        not _tailscale_self_online
      }}

# @docsible Display parsed state for debugging
- name: Display detected state
  ansible.builtin.debug:
    msg:
      - "Installed: {{ tailscale_installed }}"
      - "Daemon Running: {{ tailscale_daemon_running }}"
      - "Authenticated: {{ tailscale_is_authenticated }}"
      - "Backend State: {{ tailscale_backend_state }}"

# @docsible Download official Tailscale install script
- name: Download Tailscale installer
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /tmp/tailscale-install.sh
    mode: "0755"
    timeout: 60
  when:
    - not tailscale_installed | bool
    - not ansible_check_mode

# @docsible Execute install script (creates /usr/sbin/tailscaled)
- name: Run Tailscale installer
  ansible.builtin.command: /tmp/tailscale-install.sh
  args:
    creates: /usr/sbin/tailscaled
  when:
    - not tailscale_installed | bool
    - not ansible_check_mode

# @docsible Enable and start tailscaled systemd service
- name: Start tailscaled service
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
  when:
    - not tailscale_daemon_running | bool
    - not ansible_check_mode

# @docsible Logout if backend state is inconsistent (Running but not Online)
- name: Logout Tailscale (reset state if inconsistent)
  ansible.builtin.command: tailscale logout
  when:
    - tailscale_needs_logout | bool
    - not ansible_check_mode

# @docsible Authenticate with tailscale up (NO --reset to preserve routes)
- name: Authenticate Tailscale
  ansible.builtin.shell: |
    tailscale up \
      --authkey="${TSKEY}" \
      --hostname="{{ inventory_hostname }}" \
      --snat-subnet-routes={{ tailscale_snatSubnetRoutes | default(true) | bool | lower }}
  environment:
    TSKEY: "{{ tailscale_authkey }}"
  register: tailscale_up
  no_log: true
  when:
    - not tailscale_is_authenticated | bool
    - not ansible_check_mode
  changed_when: tailscale_up.rc == 0

# @docsible Configure DNS acceptance from admin console
- name: Configure accept-dns
  ansible.builtin.command: tailscale set --accept-dns={{ tailscale_acceptDns | default(true) | bool | lower }}
  when:
    - tailscale_is_authenticated | bool or (tailscale_up is succeeded | default(false))
    - not ansible_check_mode
  changed_when: false

# @docsible Enable route acceptance for Cilium Native Routing mesh
- name: Configure accept-routes
  ansible.builtin.command: tailscale set --accept-routes=true
  when:
    - tailscale_is_authenticated | bool or (tailscale_up is succeeded | default(false))
    - not ansible_check_mode
  changed_when: false

# @docsible Enable Tailscale SSH server on the node
- name: Configure SSH
  ansible.builtin.command: tailscale set --ssh
  when:
    - tailscale_is_authenticated | bool or (tailscale_up is succeeded | default(false))
    - not ansible_check_mode
  changed_when: false

# @docsible Advertise as exit node if enabled in variables
- name: Configure exit node advertisement
  ansible.builtin.command: tailscale set --advertise-exit-node={{ tailscale_exitNodeEnabled | bool | lower }}
  when:
    - tailscale_is_authenticated | bool or (tailscale_up is succeeded | default(false))
    - not ansible_check_mode
  changed_when: false

# @docsible Disable exit node advertisement when not enabled
- name: Disable exit node advertisement
  ansible.builtin.command: tailscale set --advertise-exit-node=false
  when:
    - not (tailscale_exitNodeEnabled | default(false) | bool)
    - tailscale_is_authenticated | bool or (tailscale_up is succeeded | default(false))
    - not ansible_check_mode
  changed_when: false

# @docsible Unset exit node usage when not using an exit node
- name: Unset exit node
  ansible.builtin.command: tailscale set --exit-node=""
  when:
    - not (tailscale_useExitNode | default(false) | bool)
    - tailscale_is_authenticated | bool or (tailscale_up is succeeded | default(false))
    - not ansible_check_mode
  changed_when: false

# @docsible Advertise static subnet routes from inventory
- name: Configure static routes
  ansible.builtin.command: tailscale set --advertise-routes="{{ tailscale_advertiseRoutes }}"
  when:
    - tailscale_advertiseRoutes | default('') | length > 0
    - tailscale_is_authenticated | bool or (tailscale_up is succeeded | default(false))
    - not ansible_check_mode
  changed_when: false

# @docsible Clear static routes when none defined
- name: Clear static routes
  ansible.builtin.command: tailscale set --advertise-routes=""
  when:
    - tailscale_advertiseRoutes | default('') | length == 0
    - tailscale_is_authenticated | bool or (tailscale_up is succeeded | default(false))
    - not ansible_check_mode
  changed_when: false

# @docsible Wait for valid CGNAT IP (100.x.x.x) assignment
- name: Wait for Tailscale IP
  ansible.builtin.shell: |
    set -o pipefail
    tailscale ip -4
  args:
    executable: /bin/bash
  register: tailscale_ip_cmd
  changed_when: false
  when:
    - not ansible_check_mode
  until:
    - tailscale_ip_cmd.rc == 0
    - (tailscale_ip_cmd.stdout | trim | length > 0)
    - (tailscale_ip_cmd.stdout | trim is regex('^100\.'))
  retries: 20
  delay: 3

# @docsible Set IP_tailscale fact for use by other roles
- name: Set Tailscale IP fact
  ansible.builtin.set_fact:
    IP_tailscale: >-
      {{ (tailscale_ip_cmd.stdout_lines | default([])) | first | default(tailscale_ip_cmd.stdout | trim) }}
  when:
    - tailscale_ip_cmd is not skipped
    - tailscale_ip_cmd.stdout is defined

# @docsible Provide mock IP for check mode execution
- name: Set mock IP fact (check mode)
  ansible.builtin.set_fact:
    IP_tailscale: "100.64.0.1"
  when: ansible_check_mode

# @docsible Verifies Tailscale ended in authenticated online state after bootstrap
- name: Validate authenticated Tailscale state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_final
  changed_when: false
  when: not ansible_check_mode

# @docsible Fails bootstrap when Tailscale is not online/authenticated
- name: Assert Tailscale is online
  ansible.builtin.assert:
    that:
      - "(tailscale_status_final.stdout | from_json).BackendState == 'Running'"
      - "(tailscale_status_final.stdout | from_json).Self.Online | default(false)"
    fail_msg: "Tailscale bootstrap failed: node is not authenticated/online in tailnet."
  when: not ansible_check_mode

# @docsible Verify SSH connectivity over Tailscale network
- name: Validate connectivity
  ansible.builtin.wait_for:
    host: "{{ IP_tailscale }}"
    port: 22
    timeout: 10
  register: tailscale_connectivity_check
  when:
    - IP_tailscale is defined
    - IP_tailscale | length > 0
    - not ansible_check_mode

# @docsible Warn if Tailscale SSH is not reachable
- name: Warn connectivity
  ansible.builtin.debug:
    msg: "⚠️  Tailscale connectivity failed: {{ IP_tailscale }}:22"
  when: tailscale_connectivity_check.failed | default(false)
