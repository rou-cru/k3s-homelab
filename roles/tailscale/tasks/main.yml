# Download Tailscale installation script with checksum verification
- name: Install Tailscale
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /tmp/tailscale-install.sh
    mode: "0755"
    checksum: "sha256:{{ tailscale_install_script_checksum }}"
    timeout: 60
# Execute Tailscale installation script if not already installed
- name: Run Tailscale installer
  ansible.builtin.command: /tmp/tailscale-install.sh
  args:
    creates: /usr/sbin/tailscaled
# Enable and start Tailscale daemon service
- name: Start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
# Check current Tailscale connection status in JSON format
- name: Check status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_json
  changed_when: false
  failed_when: false
  check_mode: false
# Determine if Tailscale is actively running and connected
- name: Determine state
  ansible.builtin.set_fact:
    # Check if BackendState is Running and Self.Online is true
    tailscale_is_running: >-
      {{


        tailscale_status_json.rc == 0 and
        (tailscale_status_json.stdout | from_json).BackendState == 'Running'
      }}
# Configure Tailscale with authentication and custom settings
- name: Configure Tailscale
  ansible.builtin.shell: |
    tailscale up \
      --authkey="${TSKEY}" \
      --hostname="{{ tailscale_hostname_prefix }}-{{ inventory_hostname }}" \
      {% if tailscale_tags | length > 0 %}--advertise-tags="{{ tailscale_tags }}" {% endif %}
      --accept-dns="{{ tailscale_accept_dns }}" \
      {% if tailscale_ssh | bool %}--ssh{% endif %}
  environment:
    TSKEY: "{{ tailscale_authkey }}"
  register: tailscale_up
  no_log: true
  # Execute if NOT running (repair) OR if we suspect drift (can be improved later)
  when: not tailscale_is_running | bool
  changed_when: tailscale_up.rc == 0
# Wait for Tailscale to assign valid 100.x.x.x IP address
- name: Wait for IP
  ansible.builtin.shell: |
    set -o pipefail
    tailscale ip -4
  args:
    executable: /bin/bash
  register: tailscale_ip_cmd
  changed_when: false
  check_mode: no
  until:
    - tailscale_ip_cmd.rc == 0
    - (tailscale_ip_cmd.stdout | trim | length > 0)
    - (tailscale_ip_cmd.stdout | trim is regex('^100\.'))
  retries: 20
  delay: 3
# Store Tailscale IP address as ansible fact for other roles
- name: Set IP fact
  ansible.builtin.set_fact:
    tailscale_ip: >-
      {{ (tailscale_ip_cmd.stdout_lines | default([])) | first | default(tailscale_ip_cmd.stdout | trim) }}
# Test SSH connectivity through Tailscale network
- name: Validate connectivity
  ansible.builtin.wait_for:
    host: "{{ tailscale_ip }}"
    port: 22
    timeout: 10
  ignore_errors: true
  register: tailscale_connectivity_check
# Display warning if Tailscale connectivity test fails
- name: Warn connectivity
  ansible.builtin.debug:
    msg: "⚠️  Tailscale connectivity failed: {{ tailscale_ip }}:22"
  when: tailscale_connectivity_check.failed | default(false)
