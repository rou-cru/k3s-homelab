# @docsible Download Tailscale installation script
- name: Install Tailscale
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /tmp/tailscale-install.sh
    mode: "0755"
    checksum: "sha256:{{ tailscale_installScriptChecksum }}"
    timeout: 60
  when: not ansible_check_mode
# @docsible Execute Tailscale installer
- name: Run Tailscale installer
  ansible.builtin.command: /tmp/tailscale-install.sh
  args:
    creates: /usr/sbin/tailscaled
  when: not ansible_check_mode
# @docsible Enable and start Tailscale daemon
- name: Start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
  when: not ansible_check_mode
# @docsible Check Tailscale connection status
- name: Check status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_json
  changed_when: false
  failed_when: false
  check_mode: false
# @docsible Parse connection state from status output
- name: Determine state
  vars:
    _tailscale_backend_state: >-
      {{
        (tailscale_status_json.stdout | from_json).BackendState
        if tailscale_status_json.rc == 0 else ''
      }}
    _tailscale_self_online: >-
      {{
        tailscale_status_json.rc == 0 and
        (tailscale_status_json.stdout | from_json).Self.Online | default(false)
      }}
  ansible.builtin.set_fact:
    tailscale_backend_state: "{{ _tailscale_backend_state }}"
    tailscale_is_running: "{{ _tailscale_self_online }}"
    tailscale_needs_logout: >-
      {{
        _tailscale_backend_state == 'Running' and
        not _tailscale_self_online
      }}
# @docsible Logout if in stale state
- name: Logout Tailscale (reset state)
  ansible.builtin.command: tailscale logout
  when:
    - tailscale_needs_logout | bool
    - not ansible_check_mode

# @docsible Configure Tailscale with auth key and settings
- name: Configure Tailscale
  ansible.builtin.shell: |
    tailscale up \
      --authkey="${TSKEY}" \
      --hostname="{{ inventory_hostname }}" \
      {% if tailscale_tags | length > 0 %}--advertise-tags="{{ tailscale_tags }}" {% endif %}
      --accept-dns="{{ tailscale_acceptDns }}" \
      {% if tailscale_ssh | bool %}--ssh {% endif %}
      {% if tailscale_exitNodeEnabled | bool %}--advertise-exit-node {% endif %}
      {% if tailscale_advertiseRoutes | length > 0 %}--advertise-routes="{{ tailscale_advertiseRoutes }}" {% endif %}
  environment:
    TSKEY: "{{ tailscale_authkey }}"
  register: tailscale_up
  no_log: true
  # Execute if NOT online
  when:
    - not tailscale_is_running | bool
    - not ansible_check_mode
  changed_when: tailscale_up.rc == 0

# @docsible Advertise as exit node
- name: Enable exit node advertisement
  ansible.builtin.command: tailscale set --advertise-exit-node
  when:
    - tailscale_exitNodeEnabled | bool
    - tailscale_is_running | bool
    - not ansible_check_mode
  register: tailscale_exit_node_set
  changed_when: false

# @docsible Advertise subnet routes
- name: Advertise routes
  ansible.builtin.command: tailscale set --advertise-routes="{{ tailscale_advertiseRoutes }}"
  when:
    - tailscale_advertiseRoutes | length > 0
    - tailscale_is_running | bool
    - not ansible_check_mode
  register: tailscale_routes_set
  changed_when: false
# @docsible Wait for Tailscale IP assignment
- name: Wait for IP
  ansible.builtin.shell: |
    set -o pipefail
    tailscale ip -4
  args:
    executable: /bin/bash
  register: tailscale_ip_cmd
  changed_when: false
  when:
    - tailscale_status_json.rc == 0
    - not ansible_check_mode
  until:
    - tailscale_ip_cmd.rc == 0
    - (tailscale_ip_cmd.stdout | trim | length > 0)
    - (tailscale_ip_cmd.stdout | trim is regex('^100\.'))
  retries: 20
  delay: 3
# @docsible Store Tailscale IP as fact
- name: Set IP fact
  ansible.builtin.set_fact:
    IP_tailscale: >-
      {{ (tailscale_ip_cmd.stdout_lines | default([])) | first | default(tailscale_ip_cmd.stdout | trim) }}
  when: tailscale_ip_cmd is not skipped

# @docsible Provide mock IP in check mode
- name: Set mock IP fact (check mode)
  ansible.builtin.set_fact:
    IP_tailscale: "100.64.0.1"
  when: ansible_check_mode
# @docsible Test SSH connectivity via Tailscale
- name: Validate connectivity
  ansible.builtin.wait_for:
    host: "{{ IP_tailscale }}"
    port: 22
    timeout: 10
  register: tailscale_connectivity_check
  when: IP_tailscale is defined and IP_tailscale | length > 0
# @docsible Warn if connectivity test fails
- name: Warn connectivity
  ansible.builtin.debug:
    msg: "⚠️  Tailscale connectivity failed: {{ IP_tailscale }}:22"
  when: tailscale_connectivity_check.failed | default(false)
# @docsible Remind about exit node approval in admin console
- name: Exit node approval reminder
  ansible.builtin.debug:
    msg: |
      ⚠️  Exit node advertised for {{ inventory_hostname }}
      Manual step required: Approve exit node in Tailscale admin console
      https://login.tailscale.com/admin/machines
  when: tailscale_exitNodeEnabled | bool
