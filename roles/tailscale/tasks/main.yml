# Instalación y configuración de Tailscale VPN
- name: Install Tailscale # noqa: command-instead-of-module
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://tailscale.com/install.sh | sh
  args:
    creates: /usr/sbin/tailscaled
    executable: /bin/bash
- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
- name: Tailscale up with auth key
  ansible.builtin.shell: |
    tailscale up \
      --reset \
      --auth-key="{{ tailscale_authkey }}" \
      --hostname="{{ tailscale_hostname_prefix }}-{{ inventory_hostname }}" \
      {% if tailscale_tags | length > 0 %}--advertise-tags="{{ tailscale_tags }}" {% endif %}
      --accept-dns="{{ tailscale_accept_dns }}" \
      {% if tailscale_ssh | bool %}--ssh{% endif %}
  register: tailscale_up
  changed_when: tailscale_up.rc == 0
  # Acepta "already connected" como éxito
  failed_when: tailscale_up.rc != 0 and ("already" not in (tailscale_up.stderr | default("")) | lower)
- name: Wait for valid Tailscale IPv4 (100.x.y.z)
  ansible.builtin.shell: |
    set -o pipefail
    tailscale ip -4
  args:
    executable: /bin/bash
  register: tailscale_ip_cmd
  changed_when: false
  until:
    - tailscale_ip_cmd.rc == 0
    - (tailscale_ip_cmd.stdout | trim | length > 0)
    - (tailscale_ip_cmd.stdout | trim is regex('^100\.'))
  retries: 20
  delay: 3
- name: Set tailscale_ip fact
  ansible.builtin.set_fact:
    tailscale_ip: "{{ (tailscale_ip_cmd.stdout_lines | default([])) | first | default(tailscale_ip_cmd.stdout | trim) }}"
