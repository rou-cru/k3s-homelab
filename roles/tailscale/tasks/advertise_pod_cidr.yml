# @docsible Advertises node-specific Pod CIDR via Tailscale for Hybrid Routing

# @docsible Waits for CiliumNode with CiliumInternalIP assigned
- name: Wait for CiliumNode with CiliumInternalIP
  kubernetes.core.k8s_info:
    api_version: cilium.io/v2
    kind: CiliumNode
    name: "{{ ansible_facts['hostname'] | default(inventory_hostname) }}"
    kubeconfig: "{{ kubeconfig }}"
  register: cilium_node_result
  until: >-
    cilium_node_result.resources | default([]) | length > 0 and
    (cilium_node_result.resources[0].spec.addresses | default([])
    | selectattr('type', 'equalto', 'CiliumInternalIP') | list | length > 0)
  retries: "{{ cilium_waitRetries }}"
  delay: "{{ cilium_waitDelay }}"
  when: not ansible_check_mode
  delegate_to: "{{ groups['k3s_server'][0] }}"
  become: false

# @docsible Parses CiliumInternalIP to determine Pod CIDR
- name: Extract CiliumInternalIP from CiliumNode
  vars:
    _cilium_addresses: "{{ cilium_node_result.resources[0].spec.addresses | default([]) }}"
  ansible.builtin.set_fact:
    _cilium_internal_ip: >-
      {{ _cilium_addresses | selectattr('type', 'equalto', 'CiliumInternalIP')
      | map(attribute='ip') | first | default('') }}
  when:
    - not ansible_check_mode
    - cilium_node_result.resources | default([]) | length > 0

# @docsible Calculates /24 Pod CIDR from internal IP
- name: Calculate pod CIDR from CiliumInternalIP
  ansible.builtin.set_fact:
    _cilium_pod_cidr: "{{ (_cilium_internal_ip ~ '/24') | ansible.utils.ipaddr('subnet') }}"
  when:
    - not ansible_check_mode
    - _cilium_internal_ip | default('') | length > 0

# @docsible Updates Tailscale route advertisement with Pod CIDR and Service CIDR
- name: Advertise pod and service CIDR routes via Tailscale
  vars:
    _combined_routes: >-
      {{
        ((tailscale_advertiseRoutes | default('') | split(',') | select | list)
        + [_cilium_pod_cidr]
        + ([tailscale_serviceCidr] if (tailscale_advertiseServiceCidr | default(false) | bool) else [])
        ) | unique | join(',')
      }}
  ansible.builtin.command: >
    tailscale set
    --advertise-routes="{{ _combined_routes }}"
  become: true
  when:
    - _cilium_pod_cidr | default('') | length > 0
    - not ansible_check_mode
  register: tailscale_advertise_result
  changed_when: false
