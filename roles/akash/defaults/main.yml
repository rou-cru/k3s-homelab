# Akash Provider Configuration

# Title: Akash Node Moniker
# Description: Provider display name on the Akash network.
# Type: str
# Required: true
akash_node_moniker: "homelab-provider"

# Title: Akash Wallet Address
# Description: Provider wallet address for receiving payments.
# Type: str
# Required: true
akash_wallet_address: ""

# Title: Akash Keyring Backend
# Description: Keyring backend for wallet management.
# Type: str
# Required: false
akash_keyring_backend: "os"

# Title: Akash Chain ID
# Description: Akash network chain ID.
# Type: str
# Required: false
akash_chain_id: "akashnet-2"

# Title: Akash RPC Node
# Description: RPC endpoint for Akash network.
# Type: str
# Required: false
akash_node_rpc: "https://rpc.akashnet.net:443"

# Title: Provider Domain
# Description: Public domain for provider endpoints.
# Type: str
# Required: true
akash_provider_domain: ""

# Title: Provider Bid Price Script
# Description: Path to bid pricing script.
# Type: str
# Required: false
akash_bid_price_script: ""

# Title: Provider Attributes
# Description: Provider attributes for marketplace; list of {key,value} entries (e.g., host=akash, tier=community).
# Type: list
# Required: false
akash_provider_attributes:
  # Title: Attribute Item
  # Description: Provider attribute key/value pair (key is namespaced attribute, value is string).
  # Type: dict
  # Required: false
  # Base provider identity
  - key: host
    # Title: Attribute Value
    # Description: Provider attribute value (string).
    # Type: str
    # Required: false
    value: akash
  # Title: Attribute Item
  # Description: Provider attribute key/value pair (key is namespaced attribute, value is string).
  # Type: dict
  # Required: false
  # Pricing tier and organization metadata
  - key: tier
    # Title: Attribute Value
    # Description: Provider attribute value (string).
    # Type: str
    # Required: false
    value: community
  # Title: Attribute Item
  # Description: Provider attribute key/value pair (key is namespaced attribute, value is string).
  # Type: dict
  # Required: false
  - key: organization
    # Title: Attribute Value
    # Description: Provider attribute value (string).
    # Type: str
    # Required: false
    value: homelab

# Title: GPU Vendor
# Description: GPU vendor for GPU-enabled providers.
# Type: str
# Required: false
akash_gpu_vendor: "nvidia"

# Title: GPU Model
# Description: GPU model name for attributes.
# Type: str
# Required: false
akash_gpu_model: "rtx4070"

# Title: Ingress Nginx Chart Version
# Description: Version of ingress-nginx Helm chart.
# Type: str
# Required: false
akash_ingress_nginx_version: "4.11.3"

# Title: Hostname Operator Chart Version
# Description: Version of akash-hostname-operator Helm chart.
# Type: str
# Required: false
akash_hostname_operator_version: "1.0.0"

# Title: Inventory Operator Chart Version
# Description: Version of akash-inventory-operator Helm chart.
# Type: str
# Required: false
akash_inventory_operator_version: "1.0.0"

# Title: Provider Chart Version
# Description: Version of akash-provider Helm chart.
# Type: str
# Required: false
akash_provider_version: "6.0.0"

# Title: Enable GPU Support
# Description: Whether to advertise GPU capabilities.
# Type: bool
# Required: false
akash_gpu_enabled: true
