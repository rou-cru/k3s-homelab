---
# @docsible Validate required Akash configuration variables
- name: Validate Akash configuration
  ansible.builtin.assert:
    that:
      - akash_walletAddress | length > 0
      - akash_providerDomain | length > 0
    fail_msg: "ERROR: akash_walletAddress and akash_providerDomain are required"

# @docsible Add Akash Network Helm repository
- name: Add Akash Helm repository
  kubernetes.core.helm_repository:
    name: akash
    repo_url: "https://akash-network.github.io/helm-charts"
  become: false

# @docsible Add Ingress NGINX Helm repository
- name: Add Ingress Nginx Helm repository
  kubernetes.core.helm_repository:
    name: ingress-nginx
    repo_url: "https://kubernetes.github.io/ingress-nginx"
  become: false

# @docsible Create dedicated namespace with restricted pod security
- name: Create akash-services namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: akash-services
        labels:
          app.kubernetes.io/managed-by: ansible
          pod-security.kubernetes.io/enforce: restricted
  become: false

# @docsible Deploy Ingress NGINX controller for Akash workloads
- name: Deploy Ingress Nginx for Akash
  kubernetes.core.helm:
    name: akash-ingress
    chart_ref: ingress-nginx/ingress-nginx
    chart_version: "{{ akash_ingressNginxVersion }}"
    release_namespace: akash-services
    create_namespace: false
    values:
      controller:
        ingressClassResource:
          name: akash-nginx
          enabled: true
          default: false
        ingressClass: akash-nginx
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        kind: DaemonSet
        service:
          enabled: false
        config:
          allow-snippet-annotations: "false"
          proxy-buffer-size: "16k"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
  become: false

# @docsible Deploy hostname operator for custom domains
- name: Deploy Akash Hostname Operator
  kubernetes.core.helm:
    name: akash-hostname-operator
    chart_ref: akash/akash-hostname-operator
    chart_version: "{{ akash_hostnameOperatorVersion }}"
    release_namespace: akash-services
    create_namespace: false
  become: false

# @docsible Deploy inventory operator for resource tracking
- name: Deploy Akash Inventory Operator
  kubernetes.core.helm:
    name: akash-inventory-operator
    chart_ref: akash/akash-inventory-operator
    chart_version: "{{ akash_inventoryOperatorVersion }}"
    release_namespace: akash-services
    create_namespace: false
  become: false

# @docsible Build provider attributes including GPU if enabled
- name: Build provider attributes
  ansible.builtin.set_fact:
    akash_full_attributes: >-
      {{
        akash_providerAttributes +
        ([
          {
            'key': 'capabilities/gpu/vendor/' + akash_gpuVendor + '/model/' + akash_gpuModel,
            'value': 'true'
          }
        ] if akash_gpuEnabled | bool else [])
      }}

# @docsible Deploy Akash provider with bidding configuration
- name: Deploy Akash Provider
  kubernetes.core.helm:
    name: akash-provider
    chart_ref: akash/provider
    chart_version: "{{ akash_providerVersion }}"
    release_namespace: akash-services
    create_namespace: false
    values:
      provider:
        moniker: "{{ akash_nodeMoniker }}"
        domain: "{{ akash_providerDomain }}"
        attributes: "{{ akash_full_attributes }}"
        withdrawalPeriod: "24h"
        bidPriceStrategy: "shellScript"
        bidPriceScript: "{{ akash_bidPriceScript | default('') }}"
      node:
        chainId: "{{ akash_chainId }}"
        rpcEndpoint: "{{ akash_nodeRpc }}"
      keyring:
        backend: "{{ akash_keyringBackend }}"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
  become: false
  when: akash_walletAddress | length > 0

# @docsible Display deployment status and next steps
- name: Display Akash setup instructions
  ansible.builtin.debug:
    msg: |
      ====================================
      Akash Provider Deployed
      ====================================
      Moniker: {{ akash_nodeMoniker }}
      Domain: {{ akash_providerDomain }}
      GPU Enabled: {{ akash_gpuEnabled }}

      Next steps:
      1. Import wallet keys to provider pod
      2. Configure TLSRoute for ingress
      3. Set up Egress Gateway for SNAT
      4. Register provider on Akash network
      ====================================
