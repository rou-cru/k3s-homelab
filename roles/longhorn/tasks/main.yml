---
# Longhorn Distributed Storage Deployment
# Provides persistent volumes with replication

# Install iscsi tools (required by Longhorn)
- name: Install Longhorn dependencies
  ansible.builtin.apt:
    name:
      - open-iscsi
      - nfs-common
    state: present

# Enable and start iscsid service
- name: Enable iscsid service
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started

# Add Longhorn Helm repository
- name: Add Longhorn Helm repository
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: "https://charts.longhorn.io"
  become: false

# Create longhorn-system namespace
- name: Create longhorn-system namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: longhorn-system
        labels:
          app.kubernetes.io/managed-by: ansible
  become: false

# Deploy Longhorn
- name: Deploy Longhorn
  kubernetes.core.helm:
    name: longhorn
    chart_ref: longhorn/longhorn
    chart_version: "{{ longhorn_chart_version }}"
    release_namespace: longhorn-system
    create_namespace: false
    values:
      persistence:
        defaultClass: "{{ longhorn_default_class }}"
        defaultClassReplicaCount: "{{ longhorn_default_replica_count }}"
        defaultDataLocality: "{{ longhorn_data_locality }}"
      defaultSettings:
        storageOverProvisioningPercentage: "{{ longhorn_storage_over_provisioning }}"
        storageMinimalAvailablePercentage: "{{ longhorn_storage_minimal_available }}"
        defaultReplicaCount: "{{ longhorn_default_replica_count }}"
        defaultDataLocality: "{{ longhorn_data_locality }}"
        backupTarget: "{{ longhorn_backup_target }}"
        backupTargetCredentialSecret: "{{ longhorn_backup_credential_secret }}"
        guaranteedEngineManagerCPU: "{{ longhorn_guaranteed_engine_manager_cpu }}"
        guaranteedReplicaManagerCPU: "{{ longhorn_guaranteed_replica_manager_cpu }}"
        priorityClass: "{{ longhorn_priority_class }}"
      longhornManager:
        priorityClass: "{{ longhorn_priority_class }}"
      longhornDriver:
        priorityClass: "{{ longhorn_priority_class }}"
  become: false

# Wait for Longhorn to be ready
- name: Wait for Longhorn manager
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    name: longhorn-manager
    namespace: longhorn-system
  register: longhorn_manager
  until:
    - longhorn_manager.resources | length > 0
    - longhorn_manager.resources[0].status.numberReady | default(0) > 0
  retries: 30
  delay: 10
  become: false
  when: not ansible_check_mode

# Display post-installation info
- name: Display Longhorn status
  ansible.builtin.debug:
    msg: |
      ====================================
      Longhorn Storage Deployed
      ====================================
      Default Class: {{ longhorn_default_class }}
      Replica Count: {{ longhorn_default_replica_count }}
      Data Locality: {{ longhorn_data_locality }}

      Access Longhorn UI:
        kubectl port-forward -n longhorn-system svc/longhorn-frontend 8080:80

      Notes:
        - VPS replica support pending latency validation
        - Backup target: {{ longhorn_backup_target | default('Not configured') }}
      ====================================
