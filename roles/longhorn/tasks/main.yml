---
# Longhorn Distributed Storage Deployment

# @docsible Install iSCSI and NFS dependencies
- name: Install Longhorn dependencies
  ansible.builtin.apt:
    name:
      - open-iscsi
      - nfs-common
    state: present

# @docsible Enable iscsid service for volume attachment
- name: Enable iscsid service
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started

# @docsible Add Long Helm repository
- name: Add Longhorn Helm repository
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: "https://charts.longhorn.io"
  become: false

# @docsible Create dedicated namespace
- name: Create longhorn-system namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: longhorn-system
        labels:
          app.kubernetes.io/managed-by: ansible
  become: false

# @docsible Deploy Longhorn with configured replicas and backup
- name: Deploy Longhorn
  kubernetes.core.helm:
    name: longhorn
    chart_ref: longhorn/longhorn
    chart_version: "{{ longhorn_chartVersion }}"
    release_namespace: longhorn-system
    create_namespace: false
    values:
      persistence:
        defaultClass: "{{ longhorn_defaultClass }}"
        defaultClassReplicaCount: "{{ longhorn_defaultReplicaCount }}"
        defaultDataLocality: "{{ longhorn_dataLocality }}"
      defaultSettings:
        storageOverProvisioningPercentage: "{{ longhorn_storageOverProvisioning }}"
        storageMinimalAvailablePercentage: "{{ longhorn_storageMinimalAvailable }}"
        defaultReplicaCount: "{{ longhorn_defaultReplicaCount }}"
        defaultDataLocality: "{{ longhorn_dataLocality }}"
        backupTarget: "{{ longhorn_backupTarget }}"
        backupTargetCredentialSecret: "{{ longhorn_backupCredentialSecret }}"
        guaranteedEngineManagerCPU: "{{ longhorn_guaranteedEngineManagerCpu }}"
        guaranteedReplicaManagerCPU: "{{ longhorn_guaranteedReplicaManagerCpu }}"
        priorityClass: "{{ longhorn_priorityClass }}"
      longhornManager:
        priorityClass: "{{ longhorn_priorityClass }}"
      longhornDriver:
        priorityClass: "{{ longhorn_priorityClass }}"
  become: false

# @docsible Wait for Longhorn manager DaemonSet readiness
- name: Wait for Longhorn manager
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    name: longhorn-manager
    namespace: longhorn-system
  register: longhorn_manager
  until:
    - longhorn_manager.resources | length > 0
    - longhorn_manager.resources[0].status.numberReady | default(0) > 0
  retries: 30
  delay: 10
  become: false
  when: not ansible_check_mode

# @docsible Display deployment status and access info
- name: Display Longhorn status
  ansible.builtin.debug:
    msg: |
      ====================================
      Longhorn Storage Deployed
      ====================================
      Default Class: {{ longhorn_defaultClass }}
      Replica Count: {{ longhorn_defaultReplicaCount }}
      Data Locality: {{ longhorn_dataLocality }}

      Access Longhorn UI:
        kubectl port-forward -n longhorn-system svc/longhorn-frontend 8080:80

      Notes:
        - VPS replica support pending latency validation
        - Backup target: {{ longhorn_backupTarget | default('Not configured') }}
      ====================================
