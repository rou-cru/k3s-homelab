# Longhorn Distributed Storage Configuration

# Title: Longhorn Chart Version
# Description: Version of Longhorn Helm chart to install.
# Type: str
# Required: false
longhorn_chart_version: "1.7.2"

# Title: Default Replica Count
# Description: Default number of replicas for volumes.
# Type: int
# Required: false
longhorn_default_replica_count: 1

# Title: Data Locality
# Description: Data locality setting (disabled, best-effort, strict-local).
# Type: str
# Required: false
longhorn_data_locality: "best-effort"

# Title: Storage Over Provisioning
# Description: Percentage of storage over-provisioning allowed.
# Type: int
# Required: false
longhorn_storage_over_provisioning: 100

# Title: Storage Minimal Available
# Description: Minimum percentage of storage that must remain available.
# Type: int
# Required: false
longhorn_storage_minimal_available: 25

# Title: Default Storage Class
# Description: Whether to set Longhorn as the default StorageClass.
# Type: bool
# Required: false
longhorn_default_class: true

# Title: Backup Target
# Description: Backup target URL (e.g., s3://bucket or nfs://server/path).
# Type: str
# Required: false
longhorn_backup_target: ""

# Title: Backup Target Credential Secret
# Description: Name of the secret containing backup credentials.
# Type: str
# Required: false
longhorn_backup_credential_secret: ""

# Title: Guaranteed Engine Manager CPU
# Description: CPU allocation for engine manager.
# Type: int
# Required: false
longhorn_guaranteed_engine_manager_cpu: 12

# Title: Guaranteed Replica Manager CPU
# Description: CPU allocation for replica manager.
# Type: int
# Required: false
longhorn_guaranteed_replica_manager_cpu: 12

# Title: Priority Class
# Description: PriorityClass for Longhorn components.
# Type: str
# Required: false
longhorn_priority_class: "priority-ops-critical"
