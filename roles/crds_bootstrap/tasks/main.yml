# Install Gateway API CRDs
- name: Install Gateway API CRDs
  kubernetes.core.k8s:
    state: present
    src: "https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml"

# Install Prometheus Operator CRDs via Helm
- name: Add Prometheus Community Helm repo
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts

- name: Install Prometheus Operator CRDs
  kubernetes.core.helm:
    release_name: prometheus-operator-crds
    chart_ref: prometheus-community/prometheus-operator-crds
    release_namespace: "{{ prometheus_operator_crds_namespace }}"
    create_namespace: true
    chart_version: "{{ prometheus_operator_crds_version }}"
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
