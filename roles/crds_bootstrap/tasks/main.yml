# Install Gateway API CRDs
- name: Install Gateway API CRDs
  kubernetes.core.k8s:
    state: present
    src: >-
      https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_apiVersion }}/standard-install.yaml
    kubeconfig: "{{ k8s_kubeconfig }}"

- name: Wait for Gateway API CRDs to be established
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: gateways.gateway.networking.k8s.io
    kubeconfig: "{{ k8s_kubeconfig }}"
    wait: true
    wait_condition:
      type: Established
      status: "True"
    wait_timeout: 60

# Install Prometheus Operator CRDs via Helm
- name: Add Prometheus Community Helm repo
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts
  check_mode: false

- name: Install Prometheus Operator CRDs
  kubernetes.core.helm:
    release_name: prometheus-operator-crds
    chart_ref: prometheus-community/prometheus-operator-crds
    release_namespace: "{{ prometheus_operatorCrdsNamespace }}"
    create_namespace: true
    update_repo_cache: true
    chart_version: "{{ prometheus_operatorCrdsVersion }}"
    kubeconfig: "{{ k8s_kubeconfig }}"
