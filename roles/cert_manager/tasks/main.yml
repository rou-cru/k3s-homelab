- name: Check if Helm is installed
  ansible.builtin.command: which helm
  register: helm_binary_check
  changed_when: false
  failed_when: false

- name: Ensure Jetstack Helm repo
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io
  when: helm_binary_check.rc == 0

- name: Deploy cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    release_namespace: "{{ cert_manager_namespace }}"
    update_repo_cache: true
    create_namespace: true
    chart_version: "{{ cert_manager_chart_version | default(omit, true) }}"
    kubeconfig: "{{ (ansible_user_dir | default(ansible_env.HOME)) }}/.kube/config"
    values:
      crds:
        enabled: true
        keep: true

      # Controller configuration
      replicaCount: 1
      podDisruptionBudget:
        enabled: false

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

      # Prometheus monitoring
      prometheus:
        enabled: "{{ cert_manager_prometheus_enabled | default(false) }}"
        servicemonitor:
          enabled: "{{ cert_manager_prometheus_enabled | default(false) }}"
          interval: 60s
          scrapeTimeout: 30s

      # Webhook configuration
      webhook:
        replicaCount: 1
        podDisruptionBudget:
          enabled: false
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

      # CA Injector configuration
      cainjector:
        replicaCount: 1
        podDisruptionBudget:
          enabled: false
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
  become: false
  when: helm_binary_check.rc == 0
  tags: ["cluster", "infrastructure", "cert-manager"]

- name: Wait for cert-manager webhook to be available
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    name: cert-manager-webhook
    namespace: "{{ cert_manager_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
    kubeconfig: "{{ (ansible_user_dir | default(ansible_env.HOME)) }}/.kube/config"
  become: false
  when: helm_binary_check.rc == 0
  tags: ["cluster", "infrastructure", "cert-manager"]

- name: Create cert-manager self-signed ClusterIssuer
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: "{{ cert_manager_selfsigned_issuer_name }}"
      spec:
        selfSigned: {}
    kubeconfig: "{{ (ansible_user_dir | default(ansible_env.HOME)) }}/.kube/config"
  become: false
  when: helm_binary_check.rc == 0
  tags: ["cluster", "infrastructure", "cert-manager"]

- name: Create cert-manager CA certificate
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: "{{ cert_manager_ca_certificate_name }}"
        namespace: "{{ cert_manager_namespace }}"
      spec:
        isCA: true
        commonName: "{{ cert_manager_ca_certificate_name }}"
        secretName: "{{ cert_manager_ca_secret_name }}"
        privateKey:
          algorithm: ECDSA
          size: 256
          rotationPolicy: Always
        issuerRef:
          name: "{{ cert_manager_selfsigned_issuer_name }}"
          kind: ClusterIssuer
    kubeconfig: "{{ (ansible_user_dir | default(ansible_env.HOME)) }}/.kube/config"
  become: false
  when: helm_binary_check.rc == 0
  tags: ["cluster", "infrastructure", "cert-manager"]

- name: Wait for cert-manager CA secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ cert_manager_ca_secret_name }}"
    namespace: "{{ cert_manager_namespace }}"
    kubeconfig: "{{ (ansible_user_dir | default(ansible_env.HOME)) }}/.kube/config"
  register: cert_manager_ca_secret
  retries: 30
  delay: 5
  until:
    - cert_manager_ca_secret.resources | length > 0
  become: false
  when: helm_binary_check.rc == 0
  tags: ["cluster", "infrastructure", "cert-manager"]

- name: Create cert-manager CA ClusterIssuer
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: "{{ cert_manager_ca_issuer_name }}"
      spec:
        ca:
          secretName: "{{ cert_manager_ca_secret_name }}"
    kubeconfig: "{{ (ansible_user_dir | default(ansible_env.HOME)) }}/.kube/config"
  become: false
  when: helm_binary_check.rc == 0
  tags: ["cluster", "infrastructure", "cert-manager"]
