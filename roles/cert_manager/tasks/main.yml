# @docsible Registers Jetstack Helm repository
- name: Ensure Jetstack Helm repo
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io
    force_update: true
  when: not ansible_check_mode

# @docsible Creates namespace for cert-manager
- name: Create cert-manager namespace
  kubernetes.core.k8s:
    state: present
    src: "{{ k8s_manifestsDir }}/bootstrap/cert-manager/namespace.yaml"
    kubeconfig: "{{ kubeconfig }}"
  when: not ansible_check_mode

# @docsible Installs cert-manager via Helm
- name: Deploy cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    release_namespace: "{{ certManager_namespace }}"
    update_repo_cache: true
    create_namespace: false
    chart_version: "{{ certManager_chartVersion | default(omit, true) }}"
    kubeconfig: "{{ kubeconfig }}"
    values_files:
      - "{{ k8s_manifestsDir }}/bootstrap/cert-manager/values.yaml"
    values: "{{ lookup('template', playbook_dir + '/k8s/bootstrap/cert-manager/values-override.yaml.j2') | from_yaml }}"
  when: not ansible_check_mode
  tags: ["infra"]

# @docsible Waits for cert-manager webhook availability required by CRDs
- name: Wait for cert-manager webhook to be available
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    name: cert-manager-webhook
    namespace: "{{ certManager_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
    kubeconfig: "{{ kubeconfig }}"
  when: not ansible_check_mode
  tags: ["infra"]

# @docsible Creates self-signed bootstrap ClusterIssuer
- name: Create cert-manager self-signed ClusterIssuer
  kubernetes.core.k8s:
    state: present
    src: "{{ k8s_manifestsDir }}/bootstrap/cert-manager/selfsigned-issuer.yaml"
    kubeconfig: "{{ kubeconfig }}"
  when: not ansible_check_mode
  tags: ["infra"]

# @docsible Generates root CA certificate
- name: Create cert-manager CA certificate
  kubernetes.core.k8s:
    state: present
    src: "{{ k8s_manifestsDir }}/bootstrap/cert-manager/ca-certificate.yaml"
    kubeconfig: "{{ kubeconfig }}"
  when: not ansible_check_mode
  tags: ["infra"]

# @docsible Waits for root CA secret
- name: Wait for cert-manager CA secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ certManager_caSecretName }}"
    namespace: "{{ certManager_namespace }}"
    kubeconfig: "{{ kubeconfig }}"
  register: secretCA
  retries: 30
  delay: 5
  until:
    - secretCA.resources | length > 0
  when: not ansible_check_mode
  tags: ["infra"]

# @docsible Creates CA-based ClusterIssuer for internal PKI
- name: Create cert-manager CA ClusterIssuer
  kubernetes.core.k8s:
    state: present
    src: "{{ k8s_manifestsDir }}/bootstrap/cert-manager/ca-issuer.yaml"
    kubeconfig: "{{ kubeconfig }}"
  when: not ansible_check_mode
  tags: ["infra"]
