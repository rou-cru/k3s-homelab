- name: Check if Helm is installed
  ansible.builtin.command: which helm
  register: helm_binary_check
  changed_when: false
  failed_when: false

- name: Ensure Jetstack Helm repo
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io
  when:
    - helm_binary_check.rc == 0
    - not ansible_check_mode

- name: Deploy cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    release_namespace: "{{ certManager_namespace }}"
    update_repo_cache: true
    create_namespace: true
    chart_version: "{{ certManager_chartVersion | default(omit, true) }}"
    kubeconfig: "{{ kubeconfig }}"
    values:
      crds:
        enabled: true
        keep: true

      # Controller configuration
      replicaCount: 1
      podDisruptionBudget:
        enabled: false

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

      # Prometheus monitoring
      prometheus:
        enabled: "{{ certManager_prometheusEnabled | default(false) }}"
        servicemonitor:
          enabled: "{{ certManager_prometheusEnabled | default(false) }}"
          interval: 60s
          scrapeTimeout: 30s

      # Webhook configuration
      webhook:
        replicaCount: 1
        podDisruptionBudget:
          enabled: false
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

      # CA Injector configuration
      cainjector:
        replicaCount: 1
        podDisruptionBudget:
          enabled: false
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
  become: false
  when:
    - helm_binary_check.rc == 0
    - not ansible_check_mode
  tags: ["cluster", "infrastructure", "cert-manager"]

- name: Wait for cert-manager webhook to be available
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    name: cert-manager-webhook
    namespace: "{{ certManager_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
    kubeconfig: "{{ kubeconfig }}"
  become: false
  when:
    - helm_binary_check.rc == 0
    - not ansible_check_mode
  tags: ["cluster", "infrastructure", "cert-manager"]

- name: Create cert-manager self-signed ClusterIssuer
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: "{{ certManager_selfsignedIssuerName }}"
      spec:
        selfSigned: {}
    kubeconfig: "{{ kubeconfig }}"
  become: false
  when:
    - helm_binary_check.rc == 0
    - not ansible_check_mode
  tags: ["cluster", "infrastructure", "cert-manager"]

- name: Create cert-manager CA certificate
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: "{{ certManager_caCertificateName }}"
        namespace: "{{ certManager_namespace }}"
      spec:
        isCA: true
        commonName: "{{ certManager_caCertificateName }}"
        secretName: "{{ certManager_caSecretName }}"
        privateKey:
          algorithm: ECDSA
          size: 256
          rotationPolicy: Always
        issuerRef:
          name: "{{ certManager_selfsignedIssuerName }}"
          kind: ClusterIssuer
    kubeconfig: "{{ kubeconfig }}"
  become: false
  when:
    - helm_binary_check.rc == 0
    - not ansible_check_mode
  tags: ["cluster", "infrastructure", "cert-manager"]

- name: Wait for cert-manager CA secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ certManager_caSecretName }}"
    namespace: "{{ certManager_namespace }}"
    kubeconfig: "{{ kubeconfig }}"
  register: secretCA
  retries: 30
  delay: 5
  until:
    - secretCA.resources | length > 0
  become: false
  when:
    - helm_binary_check.rc == 0
    - not ansible_check_mode
  tags: ["cluster", "infrastructure", "cert-manager"]

- name: Create cert-manager CA ClusterIssuer
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: "{{ certManager_caIssuerName }}"
      spec:
        ca:
          secretName: "{{ certManager_caSecretName }}"
    kubeconfig: "{{ kubeconfig }}"
  become: false
  when:
    - helm_binary_check.rc == 0
    - not ansible_check_mode
  tags: ["cluster", "infrastructure", "cert-manager"]
