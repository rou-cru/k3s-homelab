# ACME / Let's Encrypt with Cloudflare DNS-01
# This file must run AFTER external_secrets (needs ClusterSecretStore)
# ---
# Dependencies: external_secrets (ClusterSecretStore oci-vault)
# Provides: Let's Encrypt ClusterIssuer, wildcard Certificate, public Gateway

# @docsible Sync Cloudflare API token from OCI Vault
- name: Create Cloudflare API token ExternalSecret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: cloudflare-token
        namespace: "{{ certManager_namespace }}"
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: oci-vault
          kind: ClusterSecretStore
        target:
          name: "{{ cloudflare_apiTokenSecretName }}"
          creationPolicy: Owner
        data:
          - secretKey: api-token
            remoteRef:
              key: cloudflare-token
    kubeconfig: "{{ kubeconfig }}"
  when: not ansible_check_mode
  tags: ["infra"]

# NOTE: No wait for Cloudflare secret - ClusterIssuer and Certificate are
# declarative resources. cert-manager will retry until dependencies are ready.
# ArgoCD deploys in Play 4, giving plenty of time for eventual consistency.

# @docsible Create Let's Encrypt production ClusterIssuer with Cloudflare DNS-01
- name: Create Let's Encrypt ClusterIssuer
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: "{{ acme_clusterIssuerName }}"
      spec:
        acme:
          server: https://acme-v02.api.letsencrypt.org/directory
          email: "{{ acme_email }}"
          privateKeySecretRef:
            name: letsencrypt-prod-account-key
          solvers:
            - dns01:
                cloudflare:
                  apiTokenSecretRef:
                    name: "{{ cloudflare_apiTokenSecretName }}"
                    key: api-token
              selector:
                dnsZones:
                  - "{{ wildcard_domain }}"
    kubeconfig: "{{ kubeconfig }}"
  when: not ansible_check_mode
  tags: ["infra"]

# @docsible Request wildcard certificate for public exposure
- name: Create wildcard Certificate for {{ wildcard_domain }}
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: wildcard-roura-xyz
        namespace: "{{ certManager_namespace }}"
      spec:
        secretName: "{{ wildcard_tlsSecretName }}"
        issuerRef:
          name: "{{ acme_clusterIssuerName }}"
          kind: ClusterIssuer
        dnsNames:
          - "*.{{ wildcard_domain }}"
          - "{{ wildcard_domain }}"
    kubeconfig: "{{ kubeconfig }}"
  when: not ansible_check_mode
  tags: ["infra"]

# NOTE: No wait needed here - ArgoCD deploys in Play 4 after VPS setup,
# giving plenty of time for Let's Encrypt DNS-01 challenge (~2 min).
# The Gateway will accept the certificate once it's ready.

# @docsible Deploy Gateway API public gateway with HTTP/HTTPS listeners
- name: Deploy public Gateway
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: public-gateway
        namespace: "{{ cilium_namespace }}"
        annotations:
          # Bind Gateway service to the VPS public IP
          io.cilium/service-type: "LoadBalancer"
          io.cilium/lb-ipam-ips: "{{ public_gateway_ip }}"
      spec:
        gatewayClassName: cilium
        listeners:
          - name: http
            protocol: HTTP
            port: 80
            allowedRoutes:
              namespaces:
                from: All
          - name: https
            protocol: HTTPS
            port: 443
            hostname: "*.{{ wildcard_domain }}"
            tls:
              mode: Terminate
              certificateRefs:
                - name: "{{ wildcard_tlsSecretName }}"
                  namespace: "{{ certManager_namespace }}"
            allowedRoutes:
              namespaces:
                from: All
    kubeconfig: "{{ kubeconfig }}"
  when: not ansible_check_mode
  tags: ["infra"]
