# Title: Network Optimization
# Description: Enables sysctl adjustments for network performance.
# Type: bool
# Required: false
common_network_optimization_enabled: false
# Title: Install NetworkManager
# Description: Installs network-manager package.
# Type: bool
# Required: false
common_install_network_manager: true
# Title: Install ACPI daemon
# Description: Installs acpid package.
# Type: bool
# Required: false
common_install_acpid: true
# Title: Install Cloud-Native Binaries
# Description: Installs uv/kubectl/helm and related tooling.
# Type: bool
# Required: false
common_install_cloud_binaries: true
# Title: Install K8s Python Dependencies
# Description: Installs python3-kubernetes and related Python modules.
# Type: bool
# Required: false
common_install_k8s_python: true
# Title: Install Debug Packages
# Description: Installs lightweight OS debugging/incident response tools.
# Type: bool
# Required: false
common_install_debug_packages: true
# Title: Install Dev Packages
# Description: Installs heavier developer/workstation packages.
# Type: bool
# Required: false
common_install_dev_packages: true
# Title: Install GitHub CLI Repository
# Description: Adds the GitHub CLI apt repository and keyring.
# Type: bool
# Required: false
common_install_github_cli_repo: true
# Title: Install HWE kernel
# Description: Installs the hardware enablement kernel package when available.
# Type: bool
# Required: false
common_install_hwe_kernel: true
# Title: RoG Server Support
# Description: Enables ASUS RoG specific hardware tweaks (drivers, LEDs, power profiles).
# Type: bool
# Required: false
common_rog_server: false
# Title: Radio Block
# Description: Soft-blocks WiFi and Bluetooth radios to save power.
# Type: bool
# Required: false
common_radio_block_enabled: false
# Title: Audio Optimization
# Description: Installs alsa-utils and configures realtime limits for audio.
# Type: bool
# Required: false
common_audio_optimization_enabled: false
# Title: File Descriptors (Soft)
# Description: Soft limit for open file descriptors (ulimit -n).
# Type: int
# Required: false
common_file_descriptors_soft: 100000
# Title: File Descriptors (Hard)
# Description: Hard limit for open file descriptors.
# Type: int
# Required: false
common_file_descriptors_hard: 100000
# Title: System File Max
# Description: System-wide maximum number of open file descriptors.
# Type: int
# Required: false
common_fs_file_max: 2097152
# Title: Inotify Instances
# Description: Max inotify instances per user.
# Type: int
# Required: false
common_inotify_max_instances: 8192
# Title: Inotify Watches
# Description: Max inotify watches per user.
# Type: int
# Required: false
common_inotify_max_watches: 524288
# Title: Power Efficiency Tuning
# Description: Low-level CPU power management (Intel RAPL & P-State) for efficiency/mining.
# Type: bool
# Required: false
common_power_efficiency_tuning_enabled: false
# Title: Intel RAPL PL1 Limit (Microwatts)
# Description: Sustained power limit for Intel RAPL (in microwatts).
# Type: int
# Required: false
common_intel_rapl_pl1_limit_microwatts: 100000000
# Title: Intel RAPL PL2 Limit (Microwatts)
# Description: Short-term power limit for Intel RAPL (in microwatts).
# Type: int
# Required: false
common_intel_rapl_pl2_limit_microwatts: 140000000
# Title: Intel P-State Max Performance Percent
# Description: Maximum CPU performance percent for Intel P-State driver.
# Type: int
# Required: false
common_intel_pstate_max_perf_pct: 80
# Title: Intel P-State Disable Turbo
# Description: Disable turbo boost when set to 1.
# Type: int
# Required: false
common_intel_pstate_no_turbo: 1
# Title: Watchdog Timeout
# Description: Hardware watchdog timeout in seconds (RuntimeWatchdogSec).
# Type: int
# Required: false
common_watchdog_timeout_sec: 120
# Title: Battery Charge Threshold
# Description: Battery charge limit percentage for RoG laptops.
# Type: int
# Required: false
common_battery_charge_threshold: 80
# Title: Thermal Policy
# Description: RoG thermal policy ID (0=balanced, 1=turbo, 2=silent - check specific model).
# Type: int
# Required: false
common_thermal_policy: 1
# Title: Ring Buffer Target
# Description: Target size for network ring buffers.
# Type: int
# Required: false
common_ring_buffer_target: 4096
# Title: Mining Optimization
# Description: Enables optimizations for crypto mining (hugepages, MSR).
# Type: bool
# Required: false
common_mining_enabled: false
# Title: Hugepages Count
# Description: Number of hugepages to allocate if mining is enabled.
# Type: int
# Required: false
common_hugepages_count: 1280
# Title: Helm Repositories
# Description: List of Helm repositories to add; each item is {name, repo_url}.
# Type: list
# Required: false
common_helm_repositories:
  # Title: Helm Repository
  # Description: Helm repository entry with name and repo_url.
  # Type: dict
  # Required: false
  # Cilium CNI charts
  - name: cilium
    # Title: Helm Repository URL
    # Description: Chart repository URL.
    # Type: str
    # Required: false
    repo_url: "https://helm.cilium.io/"
  # Title: Helm Repository
  # Description: Helm repository entry with name and repo_url.
  # Type: dict
  # Required: false
  # NVIDIA device plugin charts
  - name: nvdp
    # Title: Helm Repository URL
    # Description: Chart repository URL.
    # Type: str
    # Required: false
    repo_url: "https://nvidia.github.io/k8s-device-plugin"
# Title: UV install script checksum
# Description: SHA256 for https://astral.sh/uv/install.sh (pin to avoid supply-chain drift).
# Type: str
# Required: false
common_uv_install_script_checksum: "10fb1f54d56f3eb60622006797339d4ea0bfda9b358d07db635f73cf89f7094c"
# Title: Helm install script checksum
# Description: SHA256 for https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3.
# Type: str
# Required: false
common_helm_install_script_checksum: "38b65f882d9cae3891755bdb03becc6a01ae6f9cb24826c191f219ddfee70a5d"

# Title: Debug Packages
# Description: Default debug tool packages for incident response.
# Type: list
# Required: false
common_debug_packages:
  - dnsutils
  - htop
  - iotop
  - jq
  - lsof
  - net-tools
  - ripgrep
  - sysstat
  - tcpdump
  - tmux
  - traceroute

# Title: Dev Packages
# Description: Default developer/workstation packages.
# Note: 'gh' requires common_install_github_cli_repo: true
# Type: list
# Required: false
common_dev_packages:
  - gh
  - imagemagick
  - s-tui
  - fbi
  - nvtop
  - tree
  - make
  - cmake
  - ninja-build
  - git
  - timeshift
  - xvfb
  - sqlite3
