---
# Optimización de hardware: IRQ balance, radios, audio y NVMe
- name: Install General Hardware Tuning Tools
  ansible.builtin.apt:
    name:
      - irqbalance
      - rfkill
    state: present

- name: Install Audio Tuning Tools
  ansible.builtin.apt:
    name:
      - alsa-utils
    state: present
  when: common_audio_optimization_enabled | bool

- name: Enable and start irqbalance
  ansible.builtin.systemd:
    name: irqbalance
    enabled: true
    state: started

# Bloquea WiFi/Bluetooth para ahorro energético y reducir interferencias
# El hardware permanece disponible para desbloqueo manual si es necesario
- name: Soft-block Wireless Radios (Save power/noise, keep HW available for SIGINT)
  community.general.rfkill:
    name: "{{ item }}"
    state: soft_blocked
  loop:
    - wifi
    - bluetooth
  when: common_radio_block_enabled | bool
  failed_when: false  # Graceful: hardware puede no tener wifi/BT

- name: Optimize System Limits for High Performance Audio (Realtime)
  community.general.pam_limits:
    domain: "*"
    limit_type: "{{ item.type }}"
    limit_item: "{{ item.item }}"
    value: "{{ item.value }}"
  loop:
    - {type: "-", item: "memlock", value: "unlimited"}
    - {type: "-", item: "rtprio", value: "95"}
  when: common_audio_optimization_enabled | bool

- name: Ensure fstrim.timer is enabled (NVMe Health)
  ansible.builtin.systemd:
    name: fstrim.timer
    enabled: true
    state: started
