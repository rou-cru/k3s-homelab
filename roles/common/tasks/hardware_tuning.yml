- name: Install General Hardware Tuning Tools
  apt:
    name:
      - irqbalance   # Distribute interrupts across i9 cores
      - rfkill       # Soft-block radios (SIGINT readiness)
    state: present
    update_cache: true

- name: Install Audio Tuning Tools
  apt:
    name:
      - alsa-utils   # Audio control
    state: present
  when: audio_optimization_enabled | bool

- name: Enable and start irqbalance
  systemd:
    name: irqbalance
    enabled: true
    state: started

- name: Soft-block Wireless Radios (Save power/noise, keep HW available for SIGINT)
  shell: |
    rfkill block wifi
    rfkill block bluetooth
  when: radio_block_enabled | bool
  changed_when: false
  failed_when: false

- name: Optimize System Limits for High Performance Audio (Realtime)
  pam_limits:
    domain: "*"
    limit_type: "{{ item.type }}"
    limit_item: "{{ item.item }}"
    value: "{{ item.value }}"
  loop:
    - { type: '-', item: 'memlock', value: 'unlimited' }
    - { type: '-', item: 'rtprio', value: '95' }
  when: audio_optimization_enabled | bool

- name: Ensure fstrim.timer is enabled (NVMe Health)
  systemd:
    name: fstrim.timer
    enabled: true
    state: started