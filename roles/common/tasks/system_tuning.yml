- name: Install performance tools
  apt:
    name:
      - cpufrequtils
    state: present

- name: Set CPU Governor to Schedutil (Balance Performance/Heat)
  # 'schedutil' uses kernel scheduling data to ramp up clocks instantly on demand,
  # but drops them when idle to save heat. Safer for i9 laptops than 'performance'.
  lineinfile:
    path: /etc/default/cpufrequtils
    regexp: '^GOVERNOR='
    line: 'GOVERNOR="schedutil"'
    create: true
  notify: Restart cpufrequtils

- name: Enable TCP BBR Congestion Control (Better Tailscale/Network performance)
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { key: 'net.core.default_qdisc', value: 'fq' }
    - { key: 'net.ipv4.tcp_congestion_control', value: 'bbr' }

- name: Increase File Descriptors Limits (Prevent K3s/Etcd crashes)
  # K3s and heavy workloads need more than the default 1024 open files.
  pam_limits:
    domain: "*"
    limit_type: "{{ item.type }}"
    limit_item: "{{ item.item }}"
    value: "{{ item.value }}"
  loop:
    - { type: 'soft', item: 'nofile', value: '100000' }
    - { type: 'hard', item: 'nofile', value: '100000' }

- name: Increase System-wide File Max
  sysctl:
    name: fs.file-max
    value: '2097152'
    state: present
    reload: true

- name: Increase Inotify Watches (Fixes "No space left on device" in K8s logs)
  sysctl:
    name: fs.inotify.max_user_instances
    value: '8192'
    state: present
    reload: true

- name: Increase Inotify User Watches
  sysctl:
    name: fs.inotify.max_user_watches
    value: '524288'
    state: present
    reload: true

- name: Enable Hardware Watchdog (Auto-reboot on freeze)
  # 120 seconds timeout to allow recovery from heavy load spikes without rebooting.
  lineinfile:
    path: /etc/systemd/system.conf
    regexp: '^#?RuntimeWatchdogSec='
    line: 'RuntimeWatchdogSec=120'
    state: present