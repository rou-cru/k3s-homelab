---
# Optimización del kernel: CPU, red y límites del sistema
- name: Install performance tools
  ansible.builtin.apt:
    name:
      - cpufrequtils
    state: present
- name: Set CPU Governor to Schedutil
  ansible.builtin.lineinfile:
    path: /etc/default/cpufrequtils
    regexp: "^GOVERNOR="
    line: 'GOVERNOR="schedutil"'
    create: true
    mode: "0644"
  notify: Restart cpufrequtils
- name: Enable TCP BBR Congestion Control
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - {key: "net.core.default_qdisc", value: "fq"}
    - {key: "net.ipv4.tcp_congestion_control", value: "bbr"}
- name: Increase File Descriptors Limits
  community.general.pam_limits:
    domain: "*"
    limit_type: "{{ item.type }}"
    limit_item: "{{ item.item }}"
    value: "{{ item.value }}"
  loop:
    - {type: "soft", item: "nofile", value: "{{ common_file_descriptors_soft }}"}
    - {type: "hard", item: "nofile", value: "{{ common_file_descriptors_hard }}"}
- name: Increase System-wide File Max
  ansible.posix.sysctl:
    name: fs.file-max
    value: "{{ common_fs_file_max }}"
    state: present
    reload: true
- name: Increase Inotify Watches
  ansible.posix.sysctl:
    name: fs.inotify.max_user_instances
    value: "{{ common_inotify_max_instances }}"
    state: present
    reload: true
- name: Increase Inotify User Watches
  ansible.posix.sysctl:
    name: fs.inotify.max_user_watches
    value: "{{ common_inotify_max_watches }}"
    state: present
    reload: true
- name: Enable Hardware Watchdog (Auto-reboot on freeze)
  ansible.builtin.lineinfile:
    path: /etc/systemd/system.conf
    regexp: "^#?RuntimeWatchdogSec="
    line: "RuntimeWatchdogSec={{ common_watchdog_timeout_sec }}"
    state: present
- name: Configure Huge Pages for mining (RandomX)
  ansible.posix.sysctl:
    name: vm.nr_hugepages
    value: "{{ common_hugepages_count }}"
    state: present
    reload: true
  when: common_mining_enabled | default(false)
  tags: ["mining", "hugepages"]
- name: Load MSR kernel module for CPU optimization
  community.general.modprobe:
    name: msr
    state: present
    persistent: present
  when: common_mining_enabled | default(false)
  tags: ["mining", "msr"]
