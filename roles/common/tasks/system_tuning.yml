# Kernel optimization: CPU, networking, and system limits
- name: Install performance tools
  ansible.builtin.apt:
    name:
      - cpufrequtils
    state: present
  when: ansible_facts['virtualization_role'] != 'guest'
- name: Set CPU governor
  ansible.builtin.lineinfile:
    path: /etc/default/cpufrequtils
    regexp: "^GOVERNOR="
    line: 'GOVERNOR="schedutil"'
    create: true
    mode: "0644"
  notify: Restart cpufrequtils
  when: ansible_facts['virtualization_role'] != 'guest'
- name: Enable BBR and Network Tuning
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: false
  loop:
    - {key: "net.core.default_qdisc", value: "fq_codel"}
    - {key: "net.ipv4.tcp_congestion_control", value: "bbr"}
    # Cilium / Tailscale requirements
    - {key: "net.ipv4.conf.default.rp_filter", value: "0"}
    - {key: "net.ipv4.conf.all.rp_filter", value: "0"}
    # Elastic / Logging requirement
    - {key: "vm.max_map_count", value: "1048576"}
  notify: Reload sysctl

- name: Akash Provider sysctl tuning
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: false
  loop:
    - {key: "net.core.somaxconn", value: "4096"}
    - {key: "net.ipv4.tcp_max_syn_backlog", value: "4096"}
    - {key: "net.ipv4.tcp_slow_start_after_idle", value: "0"}
  when: akash_provider_enabled | default(false)
  notify: Reload sysctl

- name: Increase FD limits
  community.general.pam_limits:
    domain: "*"
    limit_type: "{{ item.type }}"
    limit_item: "{{ item.item }}"
    value: "{{ item.value }}"
  loop:
    - {type: "soft", item: "nofile", value: "{{ common_file_descriptors_soft }}"}
    - {type: "hard", item: "nofile", value: "{{ common_file_descriptors_hard }}"}
- name: Increase file-max
  ansible.posix.sysctl:
    name: fs.file-max
    value: "{{ common_fs_file_max }}"
    state: present
    reload: true
- name: Increase inotify watches
  ansible.posix.sysctl:
    name: fs.inotify.max_user_instances
    value: "{{ common_inotify_max_instances }}"
    state: present
    reload: true
- name: Increase user watches
  ansible.posix.sysctl:
    name: fs.inotify.max_user_watches
    value: "{{ common_inotify_max_watches }}"
    state: present
    reload: true
- name: Enable watchdog
  ansible.builtin.lineinfile:
    path: /etc/systemd/system.conf
    regexp: "^#?RuntimeWatchdogSec="
    line: "RuntimeWatchdogSec={{ common_watchdog_timeout_sec }}"
    state: present
- name: Configure hugepages
  ansible.posix.sysctl:
    name: vm.nr_hugepages
    value: "{{ common_hugepages_count }}"
    state: present
    reload: true
  # 2 MiB per page; default 1280 ~= 2.5 GiB
  when: common_mining_enabled | default(false)
  tags: ["os"]
- name: Load MSR module
  community.general.modprobe:
    name: msr
    state: present
    persistent: present
  when: common_mining_enabled | default(false)
  tags: ["os"]
- name: Configure Nvidia modules load
  ansible.builtin.copy:
    dest: /etc/modules-load.d/nvidia.conf
    content: |
      nvidia
      nvidia-uvm
      nvidia-modeset
    mode: "0644"
  when: common_mining_enabled | default(false)
  tags: ["os", "nvidia"]
