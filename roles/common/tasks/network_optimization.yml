---
# Network optimization: Realtek drivers and network configuration
- name: Realtek optimizations
  when: common_rog_server | bool
  block:
    - name: Install Realtek driver
      ansible.builtin.apt:
        name: r8168-dkms
        state: present
      register: common_r8168_install
    - name: Blacklist generic driver
      ansible.builtin.copy:
        dest: /etc/modprobe.d/blacklist-r8169.conf
        content: |
          blacklist r8169
        mode: "0644"
      register: common_r8169_blacklist
    - name: Read GRUB config
      ansible.builtin.slurp:
        src: /etc/default/grub
      register: common_grub_file
    - name: Parse GRUB cmdline
      ansible.builtin.set_fact:
        common_grub_lines: "{{ (common_grub_file.content | b64decode).splitlines() }}"
        common_grub_cmdline_line: >-
          {{
            (common_grub_file.content | b64decode).splitlines()
            | select('match', '^GRUB_CMDLINE_LINUX_DEFAULT=')
            | list
            | first
            | default('GRUB_CMDLINE_LINUX_DEFAULT=\"\"')
          }}
    - name: Extract GRUB cmdline value
      ansible.builtin.set_fact:
        common_grub_cmdline_raw: "{{ common_grub_cmdline_line.split('=', 1)[1] | trim }}"
    - name: Normalize GRUB cmdline value
      ansible.builtin.set_fact:
        common_grub_cmdline_value: >-
          {{
            (common_grub_cmdline_raw | length >= 2
             and common_grub_cmdline_raw[0] == '\"'
             and common_grub_cmdline_raw[-1] == '\"')
            | ternary(common_grub_cmdline_raw[1:-1], common_grub_cmdline_raw)
          }}
    - name: Build GRUB cmdline tokens
      ansible.builtin.set_fact:
        common_grub_cmdline_tokens: "{{ common_grub_cmdline_value.split() }}"
    - name: Build GRUB cmdline tokens final
      ansible.builtin.set_fact:
        common_grub_cmdline_tokens_final: >-
          {{
            (common_grub_cmdline_tokens
             + (['pcie_aspm=off'] if 'pcie_aspm=off' not in common_grub_cmdline_tokens else []))
            | unique
          }}
    - name: Build GRUB cmdline line
      ansible.builtin.set_fact:
        common_grub_cmdline_new: "GRUB_CMDLINE_LINUX_DEFAULT=\"{{ common_grub_cmdline_tokens_final | join(' ') }}\""
    - name: Replace or append GRUB_CMDLINE_LINUX_DEFAULT
      ansible.builtin.set_fact:
        common_grub_lines_new: >-
          {%- set out = [] -%}
          {%- set replaced = false -%}
          {%- for line in common_grub_lines -%}
            {%- if line.startswith('GRUB_CMDLINE_LINUX_DEFAULT=') -%}
              {%- set _ = out.append(common_grub_cmdline_new) -%}
              {%- set replaced = true -%}
            {%- else -%}
              {%- set _ = out.append(line) -%}
            {%- endif -%}
          {%- endfor -%}
          {%- if not replaced -%}
            {%- set _ = out.append(common_grub_cmdline_new) -%}
          {%- endif -%}
          {{ out }}
    - name: Write GRUB config
      ansible.builtin.copy:
        dest: /etc/default/grub
        content: "{{ (common_grub_lines_new | join('\n')) + '\n' }}"
        mode: "0644"
      register: common_grub_aspm
    - name: Update GRUB # noqa: no-handler
      ansible.builtin.command: update-grub
      when: common_grub_aspm.changed
      changed_when: true
    - name: Register driver change
      ansible.builtin.set_fact:
        common_network_driver_changed: >-
          {{ common_r8168_install.changed or
             common_r8169_blacklist.changed or
             common_grub_aspm.changed }}
  rescue:
    - name: Report RoG/Realtek optimization failure
      ansible.builtin.debug:
        msg: >-
          RoG/Realtek optimization failed at {{ ansible_failed_task.name }}: {{ ansible_failed_result | to_nice_json }}
    - name: Fail RoG/Realtek optimization
      ansible.builtin.fail:
        msg: "RoG/Realtek optimization failed"
- name: Detect primary ethernet interface
  ansible.builtin.set_fact:
    common_primary_interface: "{{ ansible_facts['default_ipv4']['interface'] }}"
  when: ansible_facts['default_ipv4']['interface'] is defined
- name: Deploy optimization script
  ansible.builtin.template:
    src: optimize-network.sh.j2
    dest: /usr/local/bin/optimize-network.sh
    mode: "0755"
- name: Deploy optimization service
  ansible.builtin.copy:
    src: network-optimization.service
    dest: /etc/systemd/system/network-optimization.service
    mode: "0644"
- name: Start optimization service
  ansible.builtin.systemd:
    name: network-optimization
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
