# Network optimization: Realtek drivers and network configuration
# Optimize Realtek network drivers for ASUS RoG hardware
- name: Realtek optimizations
  when: common_rog_server | bool
  block:
    # Install optimized Realtek r8168 driver for better performance
    - name: Install Realtek driver
      ansible.builtin.apt:
        name: r8168-dkms
        state: present
      register: common_r8168_install
    # Prevent r8169 generic driver from loading to avoid conflicts
    - name: Blacklist generic driver
      ansible.builtin.copy:
        dest: /etc/modprobe.d/blacklist-r8169.conf
        content: |
          blacklist r8169
        mode: "0640"
      register: common_r8169_blacklist
    # Disable PCIe Active State Power Management for network stability
    - name: Ensure pcie_aspm=off in GRUB
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT="(?!.*pcie_aspm=off)(.*)"'
        replace: 'GRUB_CMDLINE_LINUX_DEFAULT="\1 pcie_aspm=off"'
      register: common_grub_aspm
    # Apply GRUB configuration changes for next boot
    - name: Update GRUB # noqa: no-handler
      ansible.builtin.command: update-grub
      when:
        - common_grub_aspm.changed
        - not ansible_check_mode
      changed_when: true
    # Track if network driver changes require reboot
    - name: Register driver change
      ansible.builtin.set_fact:
        common_network_driver_changed: >-
          {{ common_r8168_install.changed or
             common_r8169_blacklist.changed or
             common_grub_aspm.changed }}
  # Handle Realtek optimization failures gracefully
  rescue:
    - name: Report RoG/Realtek optimization failure
      ansible.builtin.debug:
        msg: >-
          RoG/Realtek optimization failed at {{ ansible_failed_task.name }}: {{ ansible_failed_result | to_json }}
    - name: Fail RoG/Realtek optimization
      ansible.builtin.fail:
        msg: "RoG/Realtek optimization failed"
# Identify primary network interface for optimization targeting
- name: Detect primary ethernet interface
  ansible.builtin.set_fact:
    common_primary_interface: "{{ ansible_facts['default_ipv4']['interface'] }}"
  when: ansible_facts['default_ipv4']['interface'] is defined
# Deploy network optimization script with interface-specific settings
- name: Deploy optimization script
  ansible.builtin.template:
    src: optimize-network.sh.j2
    dest: /usr/local/bin/optimize-network.sh
    mode: "0755"
# Install systemd service for network optimization at boot
- name: Deploy optimization service
  ansible.builtin.copy:
    src: network-optimization.service
    dest: /etc/systemd/system/network-optimization.service
    mode: "0640"
# Ensure systemd sees the new unit before enabling it
- name: Reload systemd daemon for network optimization
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - ansible_service_mgr == 'systemd'
    - not ansible_check_mode
# Enable and start network optimization service
- name: Start optimization service
  ansible.builtin.systemd:
    name: network-optimization.service
    enabled: true
    state: started
  when:
    - ansible_service_mgr == 'systemd'
    - not ansible_check_mode
