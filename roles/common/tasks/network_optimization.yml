# --- 1. ASUS RoG Strix Specifics (Kernel & Driver Layer) ---
- name: RoG/Realtek Specific Optimizations
  when: rog_server | bool
  block:
    - name: Install Realtek proprietary driver (r8168-dkms)
      apt:
        name: r8168-dkms
        state: present
        update_cache: true
      register: r8168_install

    - name: Blacklist unstable generic driver (r8169)
      copy:
        dest: /etc/modprobe.d/blacklist-r8169.conf
        content: |
          blacklist r8169
      register: r8169_blacklist

    - name: Disable ASPM in GRUB (fixes latency/disconnects on RoG laptops)
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT="(.*)"'
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="\1 pcie_aspm=off"'
        backrefs: true
      register: grub_aspm
      # Check if already present to avoid duplication/loop (simple check)
      failed_when: false
      changed_when: grub_aspm.changed and "pcie_aspm=off" not in grub_aspm.diff.before

    # Clean up duplicate flags if Ansible appended it multiple times in previous runs
    # This is a safety measure.
    - name: Ensure pcie_aspm=off is present exactly once
      replace:
        path: /etc/default/grub
        regexp: '(pcie_aspm=off\s?)+'
        replace: 'pcie_aspm=off '
      when: grub_aspm.changed

    - name: Update GRUB
      command: update-grub
      when: grub_aspm.changed

    - name: Reboot for Driver/GRUB changes
      reboot:
        msg: "Rebooting to apply RoG Network Fixes (Driver + ASPM)"
        connect_timeout: 5
        reboot_timeout: 600
      when: r8168_install.changed or r8169_blacklist.changed or grub_aspm.changed

# --- 2. Generic Optimizations (Runtime Layer) ---
- name: Detect primary ethernet interface
  set_fact:
    primary_interface: "{{ ansible_default_ipv4.interface }}"
  when: ansible_default_ipv4.interface is defined

- name: Create persistent network optimization script
  copy:
    dest: /usr/local/bin/optimize-network.sh
    mode: '0755'
    content: |
      #!/bin/bash
      # Script gestionado por Ansible
      # Optimiza la tarjeta de red para estabilidad y rendimiento
      
      INTERFACE="{{ primary_interface }}"
      
      if [ -z "$INTERFACE" ]; then
        echo "No interface detected. Exiting."
        exit 0
      fi

      echo "Optimizing interface: $INTERFACE"

      # 1. Desactivar Energy Efficient Ethernet (EEE)
      ethtool --show-eee $INTERFACE | grep -q "EEE is enabled" && ethtool --set-eee $INTERFACE eee off && echo "EEE disabled." || echo "EEE check passed."
      
      # 2. Desactivar Wake-on-LAN (Power Saving)
      ethtool -s $INTERFACE wol d || true
      
      # 3. Maximizar Ring Buffers (Crucial para 1Gbps/2.5Gbps estable)
      # Intentamos ponerlo a 4096 (estándar alto) o lo que reporte el driver como máximo.
      MAX_RX=$(ethtool -g $INTERFACE | grep -m1 "RX:" | awk '{print $2}')
      MAX_TX=$(ethtool -g $INTERFACE | grep -m1 "TX:" | awk '{print $2}')
      
      # Si podemos leer los máximos, los aplicamos. Si no, intentamos un valor seguro (4096).
      if [ ! -z "$MAX_RX" ] && [ "$MAX_RX" -gt 256 ]; then
         ethtool -G $INTERFACE rx $MAX_RX tx $MAX_TX 2>/dev/null && echo "Ring Buffers maximized to RX:$MAX_RX TX:$MAX_TX" || echo "Failed to set Ring Buffers."
      else
         echo "Ring buffers already maxed or undetectable."
      fi

- name: Create systemd service for network optimization
  copy:
    dest: /etc/systemd/system/network-optimization.service
    content: |
      [Unit]
      Description=Apply Network Optimizations
      After=network.target network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/optimize-network.sh
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

- name: Enable and start network optimization service
  systemd:
    name: network-optimization
    enabled: true
    state: started
    daemon_reload: true