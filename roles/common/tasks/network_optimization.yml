---
# Network optimization: Realtek drivers and network configuration
- name: RoG/Realtek Specific Optimizations
  when: common_rog_server | bool
  block:
    - name: Install Realtek driver (r8168-dkms)
      ansible.builtin.apt:
        name: r8168-dkms
        state: present
      register: common_r8168_install
    - name: Blacklist unstable generic driver (r8169)
      ansible.builtin.copy:
        dest: /etc/modprobe.d/blacklist-r8169.conf
        content: |
          blacklist r8169
        mode: "0644"
      register: common_r8169_blacklist
    - name: Disable ASPM in GRUB
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT="(.*)"'
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="\1 pcie_aspm=off"'
        backrefs: true
      register: common_grub_aspm
      failed_when: false
      changed_when: >-
        common_grub_aspm.changed and
        common_grub_aspm.diff is defined and
        common_grub_aspm.diff.before is defined and
        common_grub_aspm.diff.before is string and
        "pcie_aspm=off" not in common_grub_aspm.diff.before
    # Prevents parameter duplication if the regex already added it
    - name: Ensure pcie_aspm=off is present exactly once # noqa: no-handler
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: "(pcie_aspm=off\\s?)+"
        replace: "pcie_aspm=off "
      when: common_grub_aspm.changed
    - name: Update GRUB # noqa: no-handler
      ansible.builtin.command: update-grub
      when: common_grub_aspm.changed
      changed_when: true
    - name: Register network driver changes for consolidated reboot
      ansible.builtin.set_fact:
        common_network_driver_changed: >-
          {{ common_r8168_install.changed or

             common_r8169_blacklist.changed or
             common_grub_aspm.changed }}
  rescue:
    - name: Report RoG/Realtek optimization failure
      ansible.builtin.debug:
        msg: >-
          RoG/Realtek optimization failed at
          {{ ansible_failed_task.name }}: {{ ansible_failed_result | to_nice_json }}
    - name: Fail RoG/Realtek optimization
      ansible.builtin.fail:
        msg: "RoG/Realtek optimization failed"
- name: Detect primary ethernet interface
  ansible.builtin.set_fact:
    common_primary_interface: "{{ ansible_facts['default_ipv4']['interface'] }}"
  when: ansible_facts['default_ipv4']['interface'] is defined
- name: Deploy network optimization script
  ansible.builtin.template:
    src: optimize-network.sh.j2
    dest: /usr/local/bin/optimize-network.sh
    mode: "0755"
- name: Deploy systemd service for network optimization
  ansible.builtin.copy:
    src: network-optimization.service
    dest: /etc/systemd/system/network-optimization.service
    mode: "0644"
- name: Enable and start network optimization service
  ansible.builtin.systemd:
    name: network-optimization
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
