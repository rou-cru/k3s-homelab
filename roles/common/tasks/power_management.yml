# @docsible Configures logind to ignore Lid Switch events
- name: Configure logind to ignore Lid Switch
  ansible.builtin.lineinfile:
    path: /etc/systemd/logind.conf
    regexp: "^#?{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    state: present
  loop:
    - {key: "HandleLidSwitch", value: "ignore"}
    - {key: "HandleLidSwitchExternalPower", value: "ignore"}
    - {key: "HandleLidSwitchDocked", value: "ignore"}
  notify: Restart logind
  when: ansible_facts['virtualization_role'] != 'guest'

# @docsible Masks sleep/suspend systemd targets
- name: Mask sleep and suspend targets
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
    enabled: false
    state: stopped
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target
  when: ansible_facts['virtualization_role'] != 'guest'

# @docsible Deploys Intel RAPL energy tuning config
- name: Configure Power Efficiency Tuning
  ansible.builtin.template:
    src: energy-tuning.conf.j2
    dest: /etc/tmpfiles.d/energy-tuning.conf
    mode: '0644'
  when:
    - hardware_powerEfficiencyTuningEnabled | default(false) | bool
    - ansible_facts['processor_vendor'] is defined
    - ansible_facts['processor_vendor'] == 'GenuineIntel'
  notify: Apply power tuning
