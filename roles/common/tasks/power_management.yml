---
# Gestión de energía: deshabilitar suspensión y gestión de tapa
- name: Configure logind to ignore Lid Switch
  ansible.builtin.lineinfile:
    path: /etc/systemd/logind.conf
    regexp: "^#?{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    state: present
  loop:
    - { key: "HandleLidSwitch", value: "ignore" }
    - { key: "HandleLidSwitchExternalPower", value: "ignore" }
    - { key: "HandleLidSwitchDocked", value: "ignore" }
  notify: Restart logind

- name: Mask sleep and suspend targets to prevent accidental suspension
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
    enabled: false
    state: stopped
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target
