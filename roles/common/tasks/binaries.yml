# @docsible Block: Install uv (Fast Python Package Manager)
- name: Install uv (Python Tool Manager)
  block:
    # @docsible Checks for existing uv binary
    - name: Check if uv is installed
      ansible.builtin.stat:
        path: /usr/local/bin/uv
      register: uv_binary
    # @docsible Downloads uv installer
    - name: Download and install uv
      ansible.builtin.get_url:
        url: https://astral.sh/uv/install.sh
        dest: /tmp/uv-install.sh
        mode: "0755"
        timeout: 60
      when: not uv_binary.stat.exists
      changed_when: false
    # @docsible Executes uv installer
    - name: Run uv installer
      ansible.builtin.command: /tmp/uv-install.sh
      environment:
        UV_INSTALL_DIR: "/usr/local/bin"
      when: not uv_binary.stat.exists
      changed_when: true
  when:
    - system_installUv | bool
    - not ansible_check_mode
  rescue:
    # @docsible Fails if uv installation errors
    - name: Report uv installation failure
      ansible.builtin.fail:
        msg: "Failed to install uv tool manager"
# @docsible Block: Install kubectl
- name: Install Kubectl (Official Binary)
  block:
    # @docsible Resolves latest stable kubectl version
    - name: Get latest stable kubectl version
      ansible.builtin.uri:
        url: https://dl.k8s.io/release/stable.txt
        return_content: true
      register: kubectl_version_url
      check_mode: false
    # @docsible Sets kubectl version fact
    - name: Set kubectl version fact
      ansible.builtin.set_fact:
        kubectl_version: "{{ kubectl_version_url.content | trim }}"
    # @docsible Fetches kubectl SHA256 checksum
    - name: Get kubectl checksum
      ansible.builtin.uri:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl.sha256"
        return_content: true
      register: kubectl_checksum_response
      check_mode: false
    # @docsible Checks currently installed kubectl version
    - name: Check current kubectl version
      ansible.builtin.command: kubectl version --client
      register: kubectl_current_version
      failed_when: false
      changed_when: false
    # @docsible Downloads and installs kubectl binary
    - name: Download and install kubectl
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        checksum: "sha256:{{ kubectl_checksum_response.content | trim }}"
        mode: '0755'
        owner: root
        group: root
      when: kubectl_current_version.failed or kubectl_version not in kubectl_current_version.stdout
  when:
    - system_installCloudBinaries | bool
    - not ansible_check_mode
  rescue:
    # @docsible Fails if kubectl installation errors
    - name: Report kubectl installation failure
      ansible.builtin.fail:
        msg: "Failed to install kubectl binary"
# @docsible Block: Install Helm 3
- name: Install Helm (Official Script)
  block:
    # @docsible Checks for existing helm binary
    - name: Check if helm is installed
      ansible.builtin.stat:
        path: /usr/local/bin/helm
      register: helm_binary
    # @docsible Downloads Helm installer script
    - name: Install Helm
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get-helm-3
        mode: "0755"
        timeout: 60
      environment:
        HELM_INSTALL_DIR: "/usr/local/bin"
      when: not helm_binary.stat.exists
      changed_when: false
    # @docsible Executes Helm installer
    - name: Run helm installer
      ansible.builtin.command: /tmp/get-helm-3
      environment:
        HELM_INSTALL_DIR: "/usr/local/bin"
      when: not helm_binary.stat.exists
      changed_when: true
    # @docsible Installs helm-diff plugin
    - name: Install helm-diff plugin
      ansible.builtin.command: /usr/local/bin/helm plugin install https://github.com/databus23/helm-diff
      register: helm_diff_install
      changed_when: "'Installed plugin: diff' in helm_diff_install.stdout"
      failed_when:
        - helm_diff_install.rc != 0
        - "'plugin already exists' not in helm_diff_install.stderr"
      when: not ansible_check_mode or helm_binary.stat.exists
  when:
    - system_installCloudBinaries | bool
    - not ansible_check_mode
  rescue:
    # @docsible Fails if Helm installation errors
    - name: Report helm installation failure
      ansible.builtin.fail:
        msg: "Failed to install helm binary"
