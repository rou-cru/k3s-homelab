# @docsible Downloads GitHub CLI GPG keyring
- name: Download GitHub CLI keyring
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /usr/share/keyrings/githubcli-archive-keyring.gpg
    mode: '0644'
    force: true
  when: system_installGithubCliRepo | bool

# @docsible Verifies GPG keyring fingerprint against official ID
- name: Verify GitHub CLI keyring fingerprint
  ansible.builtin.command: >-
    gpg --show-keys --with-colons /usr/share/keyrings/githubcli-archive-keyring.gpg
  register: githubcli_keyring_fingerprint
  changed_when: false
  when:
    - system_installGithubCliRepo | bool
    - not ansible_check_mode

# @docsible Enforces GPG fingerprint match
- name: Assert GitHub CLI keyring fingerprint
  ansible.builtin.assert:
    that:
      - "'fpr:::::::::2C6106201985B60E6C7AC87323F3D4EA75716059:' in githubcli_keyring_fingerprint.stdout"
    fail_msg: "GitHub CLI keyring fingerprint mismatch."
  when:
    - system_installGithubCliRepo | bool
    - not ansible_check_mode
    - githubcli_keyring_fingerprint is defined

# @docsible Adds signed GitHub CLI APT repository
- name: Add GitHub CLI repository
  ansible.builtin.apt_repository:
    repo: >-
      {{
        'deb [arch=' ~ ansible_facts['architecture'] ~
        ' signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] ' ~
        'https://cli.github.com/packages stable main'
      }}
    filename: github-cli
    state: present
  when: system_installGithubCliRepo | bool

# @docsible Installs network diagnostic tools (tcpdump, net-tools)
- name: Install debug packages
  ansible.builtin.apt:
    name: "{{ packages_debug }}"
    state: present
    update_cache: true
  when:
    - system_installDebugPackages | bool
    - packages_debug | default([]) | length > 0

# @docsible Installs development tools (make, gcc) if enabled
- name: Install dev packages
  ansible.builtin.apt:
    name: "{{ packages_dev }}"
    state: present
    update_cache: true
  when:
    - system_installDevPackages | bool
    - packages_dev | default([]) | length > 0
