- name: Download GitHub CLI keyring
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /usr/share/keyrings/githubcli-archive-keyring.gpg
    mode: '0644'
    force: true
- name: Verify GitHub CLI keyring fingerprint
  ansible.builtin.command: >-
    gpg --show-keys --with-colons /usr/share/keyrings/githubcli-archive-keyring.gpg
  register: githubcli_keyring_fingerprint
  changed_when: false
  when: not ansible_check_mode
- name: Assert GitHub CLI keyring fingerprint
  ansible.builtin.assert:
    that:
      - "'fpr:::::::::2C6106201985B60E6C7AC87323F3D4EA75716059:' in githubcli_keyring_fingerprint.stdout"
    fail_msg: "GitHub CLI keyring fingerprint mismatch."
  when:
    - not ansible_check_mode
    - githubcli_keyring_fingerprint is defined
- name: Add GitHub CLI repository
  ansible.builtin.apt_repository:
    repo: >-
      {{


        'deb [arch=' ~ ansible_facts['architecture'] ~
        ' signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] ' ~
        'https://cli.github.com/packages stable main'
      }}
    filename: github-cli
    state: present
- name: Install Python dependencies for K8s Ansible modules
  ansible.builtin.apt:
    name:
      - python3-kubernetes
      - python3-pip
      - python3-yaml
      - python3-jsonpatch
      # System tools requested by OS mapping
      - gh
      - imagemagick
      - s-tui
      - fbi
      - nvtop
      - tree
      - tmux
      - ripgrep
      - make
      - cmake
      - ninja-build
      - git
      - timeshift
      - xvfb
      - sqlite3
    state: present
    update_cache: true
