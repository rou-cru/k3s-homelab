# Install Python dependencies for kubernetes.core Ansible collection
# Uses uv (installed via binaries.yml) to install modern versions
# The apt python3-kubernetes package is too old (<24.2.0)

- name: Install kubernetes.core deps via uv
  ansible.builtin.command:
    cmd: /usr/local/bin/uv pip install --system --break-system-packages kubernetes>=24.2.0 requests-oauthlib jsonpatch
  register: k8s_deps_install
  changed_when: "'Installed' in k8s_deps_install.stdout"
  when: not ansible_check_mode
