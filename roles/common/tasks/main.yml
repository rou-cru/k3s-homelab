# Disable swap to meet K3s requirements - Kubernetes doesn't support swap
- name: Disable swap
  ansible.builtin.command: swapoff -a
  changed_when: true
  when:
    - ansible_facts['swaptotal_mb'] > 0
    - not ansible_check_mode
# Permanently disable swap by commenting out fstab entries
- name: Disable swap (fstab)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: "^(.*\\sswap\\s.*)$"
    replace: "# \\1"
# Store Ubuntu version for kernel package selection
- name: Detect Ubuntu version
  ansible.builtin.set_fact:
    ubuntu_version: "{{ ansible_facts['distribution_version'] }}"
# Use HWE kernel for better hardware support on Ubuntu 20.04-24.04
- name: Define kernel package
  ansible.builtin.set_fact:
    hwe_kernel_package: "linux-generic-hwe-{{ ubuntu_version }}"
  when: ubuntu_version is version('20.04', '>=') and ubuntu_version is version('24.04', '<=')
# Install essential system tools for K3s and networking
- name: Install system base tools
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - iptables
      - ethtool
      - rsync
    state: present
# Optional base packages for workstation-style hosts
- name: Install NetworkManager
  ansible.builtin.apt:
    name: network-manager
    state: present
  when: system_installNetworkManager | bool
- name: Install ACPI daemon
  ansible.builtin.apt:
    name: acpid
    state: present
  when: system_installAcpid | bool
# Install additional system dependencies
- name: Install dependencies
  ansible.builtin.include_tasks: dependencies.yml
# Install Hardware Enablement kernel for newer hardware support
- name: Install HWE kernel
  ansible.builtin.apt:
    name: "{{ hwe_kernel_package }}"
    state: present
  when:
    - hwe_kernel_package is defined
    - system_installHweKernel | bool
  register: common_hwe_kernel_install
  failed_when: false
# Fallback to generic kernel if HWE installation fails or unavailable
- name: Install generic kernel
  ansible.builtin.apt:
    name: linux-generic
    state: present
  when: >-
    (common_hwe_kernel_install is skipped) or
    (common_hwe_kernel_install is failed) or
    (hwe_kernel_package is not defined)
  register: common_generic_kernel_install
# Track if kernel was changed to trigger reboot later
- name: Register kernel change
  ansible.builtin.set_fact:
    system_kernelChanged: >-
      {{ (common_hwe_kernel_install.changed | default(false))
        or (common_generic_kernel_install.changed | default(false))
      }}

# Schedule reboot if kernel changed
- name: Schedule reboot for kernel change
  ansible.builtin.debug:
    msg: "Kernel change detected; reboot will be scheduled."
  changed_when: true
  notify: Reboot host
  when:
    - system_kernelChanged | default(false) | bool
    - not ansible_check_mode
# Configure power management settings
- name: Configure power
  ansible.builtin.include_tasks: power_management.yml
# Apply hardware-specific optimizations
- name: Apply hardware tuning
  ansible.builtin.include_tasks: hardware_tuning.yml
# Apply system-level performance tuning
- name: System Tuning
  ansible.builtin.include_tasks: system_tuning.yml
# Install Kubernetes and container tools
- name: Install Cloud-Native Binaries
  ansible.builtin.include_tasks: binaries.yml

# Configure Helm repositories (inline from helm_setup.yml)
- name: Ensure Helm config directory exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.config/helm"
    state: directory
    mode: '0755'
  become: false
  when: system_installCloudBinaries | bool

- name: Add Helm Repositories
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    repo_url: "{{ item.repo_url }}"
  loop: "{{ system_helmRepositories }}"
  become: false
  when: system_installCloudBinaries | bool

# Install kubernetes.core Ansible collection Python dependencies
- name: Install K8s Ansible deps
  ansible.builtin.include_tasks: k8s_ansible_deps.yml
  when:
    - system_installK8sAnsibleDeps | bool
    - system_installCloudBinaries | bool
