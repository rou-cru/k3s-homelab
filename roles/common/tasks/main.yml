- name: Disable swap now
  command: swapoff -a
  changed_when: false
  failed_when: false

- name: Disable swap permanently in fstab
  replace:
    path: /etc/fstab
    regexp: '^(.*\sswap\s.*)$'
    replace: '# \1'

- name: Install base packages and Kernel HWE
  apt:
    name:
      - curl
      - ca-certificates
      - iptables
      - ethtool
      - network-manager
      - acpid  # Handles power button/lid/brightness events in server mode
      - linux-generic-hwe-22.04
    state: present
    update_cache: true
  register: base_packages_install

- name: Reboot to load new Kernel/Drivers
  reboot:
    msg: "Rebooting to load HWE Kernel"
    connect_timeout: 5
    reboot_timeout: 600
  when: base_packages_install.changed and ("linux-image" in base_packages_install.stdout or "linux-headers" in base_packages_install.stdout)

- name: Configure Power Management (Lid Switch / No Sleep)
  include_tasks: power_management.yml

- name: Apply Hardware Tuning (CPU/Radios/Audio)
  include_tasks: hardware_tuning.yml

- name: Apply Network Optimizations
  include_tasks: network_optimization.yml
  when: network_optimization_enabled | default(true)

- name: Apply RoG Server Hardware Tweaks
  include_tasks: rog_hardware.yml
  when: rog_server | default(true) | bool