# @docsible Disable swap for Kubernetes compatibility
- name: Disable swap
  ansible.builtin.command: swapoff -a
  changed_when: true
  when:
    - ansible_facts['swaptotal_mb'] > 0
    - not ansible_check_mode
# @docsible Permanently disable swap in fstab
- name: Disable swap (fstab)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: "^(.*\\sswap\\s.*)$"
    replace: "# \\1"
# @docsible Detect Ubuntu version for kernel selection
- name: Detect Ubuntu version
  ansible.builtin.set_fact:
    ubuntu_version: "{{ ansible_facts['distribution_version'] }}"
# @docsible Set HWE kernel package name
- name: Define kernel package
  ansible.builtin.set_fact:
    hwe_kernel_package: "linux-generic-hwe-{{ ubuntu_version }}"
  when: ubuntu_version is version('20.04', '>=') and ubuntu_version is version('24.04', '<=')
# @docsible Install essential system utilities
- name: Install system base tools
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - iptables
      - ethtool
      - rsync
    state: present
# @docsible Install NetworkManager if enabled
- name: Install NetworkManager
  ansible.builtin.apt:
    name: network-manager
    state: present
  when: system_installNetworkManager | bool
# @docsible Install ACPI daemon if enabled
- name: Install ACPI daemon
  ansible.builtin.apt:
    name: acpid
    state: present
  when: system_installAcpid | bool
# @docsible Install additional system dependencies
- name: Install dependencies
  ansible.builtin.include_tasks: dependencies.yml
# @docsible Install HWE kernel for newer hardware
- name: Install HWE kernel
  ansible.builtin.apt:
    name: "{{ hwe_kernel_package }}"
    state: present
  when:
    - hwe_kernel_package is defined
    - system_installHweKernel | bool
  register: common_hwe_kernel_install
  failed_when: false
# @docsible Fallback to generic kernel if HWE fails
- name: Install generic kernel
  ansible.builtin.apt:
    name: linux-generic
    state: present
  when: >-
    (common_hwe_kernel_install is skipped) or
    (common_hwe_kernel_install is failed) or
    (hwe_kernel_package is not defined)
  register: common_generic_kernel_install
# @docsible Track kernel installation changes
- name: Register kernel change
  ansible.builtin.set_fact:
    system_kernelChanged: >-
      {{ (common_hwe_kernel_install.changed | default(false))
        or (common_generic_kernel_install.changed | default(false))
      }}
# @docsible Configure power management settings
- name: Configure power
  ansible.builtin.include_tasks: power_management.yml
# @docsible Apply hardware-specific optimizations
- name: Apply hardware tuning
  ansible.builtin.include_tasks: hardware_tuning.yml
# @docsible Apply system-level kernel tuning
- name: System Tuning
  ansible.builtin.include_tasks: system_tuning.yml
# @docsible Install cloud-native binaries (Helm, kubectl, etc.)
- name: Install Cloud-Native Binaries
  ansible.builtin.include_tasks: binaries.yml

# @docsible Create Helm configuration directory
- name: Ensure Helm config directory exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.config/helm"
    state: directory
    mode: '0755'
  become: false
  when: system_installCloudBinaries | bool

# @docsible Add configured Helm repositories
- name: Add Helm Repositories
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    repo_url: "{{ item.repo_url }}"
  loop: "{{ system_helmRepositories }}"
  become: false
  when: system_installCloudBinaries | bool

# @docsible Install Python dependencies for K8s modules
- name: Install K8s Ansible deps
  ansible.builtin.include_tasks: k8s_ansible_deps.yml
  when:
    - system_installK8sAnsibleDeps | bool
    - system_installCloudBinaries | bool
