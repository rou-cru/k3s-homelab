---
- name: Disable swap now
  ansible.builtin.command: swapoff -a
  changed_when: true
  when: ansible_facts['swaptotal_mb'] > 0
- name: Disable swap permanently in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: "^(.*\\sswap\\s.*)$"
    replace: "# \\1"
- name: Detect Ubuntu version for HWE kernel
  ansible.builtin.set_fact:
    ubuntu_version: "{{ ansible_facts['distribution_version'] }}"
- name: Set HWE kernel package name
  ansible.builtin.set_fact:
    hwe_kernel_package: "linux-generic-hwe-{{ ubuntu_version }}"
  when: ubuntu_version is version('20.04', '>=') and ubuntu_version is version('24.04', '<=')
- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - iptables
      - ethtool
      - network-manager
      - acpid
      - rsync
    state: present
- name: Install Common Dependencies (Python/Helm)
  ansible.builtin.include_tasks: dependencies.yml

- name: Install HWE kernel (Ubuntu 20.04-24.04)
  ansible.builtin.apt:
    name: "{{ hwe_kernel_package }}"
    state: present
  when: hwe_kernel_package is defined
  register: common_hwe_kernel_install
  ignore_errors: true
- name: Install generic kernel as fallback
  ansible.builtin.apt:
    name: linux-generic
    state: present
  when: common_hwe_kernel_install is failed or hwe_kernel_package is not defined
  register: common_generic_kernel_install
- name: Register kernel changes for consolidated reboot
  ansible.builtin.set_fact:
    common_kernel_changed: >-
      {{ (common_hwe_kernel_install.changed | default(false)) or
      (common_generic_kernel_install.changed | default(false)) }}
- name: Configure Power Management (Lid Switch / No Sleep)
  ansible.builtin.include_tasks: power_management.yml
- name: Apply Hardware Tuning (CPU/Radios/Audio)
  ansible.builtin.include_tasks: hardware_tuning.yml
- name: Apply System Kernel Tuning (BBR/Limits/Watchdog)
  ansible.builtin.include_tasks: system_tuning.yml
- name: Apply Network Optimizations
  ansible.builtin.include_tasks: network_optimization.yml
  when: common_network_optimization_enabled | default(true)
- name: Apply RoG Server Hardware Tweaks
  ansible.builtin.include_tasks: rog_hardware.yml
  when: common_rog_server | default(true) | bool
- name: Initialize network_driver_changed if not set
  ansible.builtin.set_fact:
    common_network_driver_changed: false
  when: common_network_driver_changed is not defined

- name: Consolidated Reboot - Phase 1 (Kernel + Network Drivers)
  ansible.builtin.reboot:
    msg: "Rebooting to load HWE Kernel and Network Drivers (Consolidated Phase 1)"
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: whoami
  when: (common_kernel_changed | default(false)) or (common_network_driver_changed | default(false))

- name: Configure Helm Repositories (User Level)
  ansible.builtin.include_tasks: helm_setup.yml
