# @docsible Disables active swap immediately (required by kubelet)
- name: Disable swap
  ansible.builtin.command: swapoff -a
  changed_when: false
  when:
    - ansible_facts['swaptotal_mb'] > 0
    - not ansible_check_mode
# @docsible Persists swap disablement in /etc/fstab entries
- name: Disable swap (fstab)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: "^(.*\\sswap\\s.*)$"
    replace: "# \\1"
# @docsible Detects Ubuntu version to resolve the HWE kernel package
- name: Detect Ubuntu version
  ansible.builtin.set_fact:
    ubuntu_version: "{{ ansible_facts['distribution_version'] }}"
# @docsible Resolves the target HWE kernel package name
- name: Define kernel package
  ansible.builtin.set_fact:
    hwe_kernel_package: "linux-generic-hwe-{{ ubuntu_version }}"
  when: ubuntu_version is version('20.04', '>=') and ubuntu_version is version('24.04', '<=')
# @docsible Installs required base system utilities
- name: Install system base tools
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - iptables
      - ethtool
      - rsync
    state: present
# @docsible Installs NetworkManager when enabled
- name: Install NetworkManager
  ansible.builtin.apt:
    name: network-manager
    state: present
  when: system_installNetworkManager | bool
# @docsible Installs ACPI daemon for power event handling
- name: Install ACPI daemon
  ansible.builtin.apt:
    name: acpid
    state: present
  when: system_installAcpid | bool
# @docsible Runs dependency subtasks (repo keys and extra packages)
- name: Install dependencies
  ansible.builtin.include_tasks: dependencies.yml
# @docsible Installs the Ubuntu HWE kernel when available
- name: Install HWE kernel
  ansible.builtin.apt:
    name: "{{ hwe_kernel_package }}"
    state: present
  when:
    - hwe_kernel_package is defined
    - system_installHweKernel | bool
  register: common_hwe_kernel_install
  failed_when: false
# @docsible Falls back to the generic kernel when HWE is unavailable
- name: Install generic kernel
  ansible.builtin.apt:
    name: linux-generic
    state: present
  when: >-
    (common_hwe_kernel_install is skipped) or
    (common_hwe_kernel_install is failed) or
    (hwe_kernel_package is not defined)
  register: common_generic_kernel_install
# @docsible Runs power-management subtasks
- name: Configure power
  ansible.builtin.include_tasks: power_management.yml
# @docsible Runs hardware-tuning subtasks
- name: Apply hardware tuning
  ansible.builtin.include_tasks: hardware_tuning.yml
# @docsible Runs sysctl and limits tuning subtasks
- name: System Tuning
  ansible.builtin.include_tasks: system_tuning.yml
# @docsible Runs cloud binary install subtasks (uv, kubectl, helm)
- name: Install Cloud-Native Binaries
  ansible.builtin.include_tasks: binaries.yml

# @docsible Creates Helm config directory for the ansible user
- name: Ensure Helm config directory exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.config/helm"
    state: directory
    mode: '0755'
  become: false
  when: system_installCloudBinaries | bool

# @docsible Registers configured upstream Helm repositories
- name: Add Helm Repositories
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    repo_url: "{{ item.repo_url }}"
  loop: "{{ system_helmRepositories }}"
  become: false
  when: system_installCloudBinaries | bool

# @docsible Runs kubernetes.core Python dependency subtasks
- name: Install K8s Ansible deps
  ansible.builtin.include_tasks: k8s_ansible_deps.yml
  when:
    - system_installK8sAnsibleDeps | bool
    - system_installCloudBinaries | bool
