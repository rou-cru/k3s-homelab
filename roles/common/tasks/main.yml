---
- name: Disable swap now
  ansible.builtin.command: swapoff -a
  changed_when: false
  failed_when: false

- name: Disable swap permanently in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: "^(.*\\sswap\\s.*)$"
    replace: "# \\1"

- name: Install base packages and Kernel HWE
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - iptables
      - ethtool
      - network-manager
      - acpid
      - linux-generic-hwe-22.04
    state: present
  register: base_packages_install

- name: Register kernel changes for consolidated reboot
  ansible.builtin.set_fact:
    kernel_changed: "{{ base_packages_install.changed }}"

- name: Configure Power Management (Lid Switch / No Sleep)
  ansible.builtin.include_tasks: power_management.yml
- name: Apply Hardware Tuning (CPU/Radios/Audio)
  ansible.builtin.include_tasks: hardware_tuning.yml
- name: Apply System Kernel Tuning (BBR/Limits/Watchdog)
  ansible.builtin.include_tasks: system_tuning.yml
- name: Apply Network Optimizations
  ansible.builtin.include_tasks: network_optimization.yml
  when: network_optimization_enabled | default(true)

- name: Apply RoG Server Hardware Tweaks
  ansible.builtin.include_tasks: rog_hardware.yml
  when: rog_server | default(true) | bool

- name: Initialize network_driver_changed if not set
  ansible.builtin.set_fact:
    network_driver_changed: false
  when: network_driver_changed is not defined

- name: Consolidated Reboot - Phase 1 (Kernel + Network Drivers)
  ansible.builtin.reboot:
    msg: "Rebooting to load HWE Kernel and Network Drivers (Consolidated Phase 1)"
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: whoami
  when: (kernel_changed | default(false)) or (network_driver_changed | default(false))
