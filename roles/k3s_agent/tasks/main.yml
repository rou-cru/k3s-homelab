# main.yml - K3s Agent Role
- name: Verify K3s agent requirements
  ansible.builtin.assert:
    that:
      - k3s_agentServerUrl is defined
      - k3s_agentServerUrl | length > 0
      - k3s_agentToken is defined
      - k3s_agentToken | length > 0
    fail_msg: "ERROR: k3s_agentServerUrl and k3s_agentToken are required"

# Detect if gVisor or Nvidia runtimes are present on host
- name: Check for runsc binary
  ansible.builtin.stat:
    path: /usr/local/bin/runsc
  register: k3s_runsc_stat

- name: Check for nvidia-container-runtime
  ansible.builtin.stat:
    path: /usr/bin/nvidia-container-runtime
  register: k3s_nvidia_runtime_stat

- name: Build containerd runtime list
  ansible.builtin.set_fact:
    k3s_commonContainerdAdditionalRuntimes: >-
      {{
        []
        + (['runsc'] if k3s_runsc_stat.stat.exists else [])
        + (['nvidia'] if k3s_nvidia_runtime_stat.stat.exists else [])
      }}

# Import common K3s setup tasks (directories, containerd, uninstall logic)
- name: Run K3s Common
  ansible.builtin.import_role:
    name: k3s_common
  vars:
    k3s_recreate: "{{ k3s_agentRecreate }}"
    k3s_commonRestartHandler: "Restart k3s-agent"

# Deploy K3s agent configuration
- name: Deploy agent config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s-agent
  when: not ansible_check_mode

# Download and install K3s agent with specified version
- name: Install K3s agent
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION="{{ k3s_agentVersion }}" \
      INSTALL_K3S_EXEC="agent" \
      K3S_URL="{{ k3s_agentServerUrl }}" \
      K3S_TOKEN="{{ k3s_agentToken }}" \
      sh -
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s
  no_log: true
  when: not ansible_check_mode

# Create systemd override directory for K3s agent service customization
- name: Create override dir
  ansible.builtin.file:
    path: /etc/systemd/system/k3s-agent.service.d
    state: directory
    mode: "0750"

# Override K3s agent service configuration for clean startup
- name: Create override
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s-agent.service.d/override.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/local/bin/k3s agent
    mode: "0640"
  notify: Restart k3s-agent

# Reload systemd configuration after service changes
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# Enable and start K3s agent service
- name: Start K3s agent
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
  when: not ansible_check_mode

# Apply pending service restarts before continuing
- name: Flush handlers
  ansible.builtin.meta: flush_handlers

# Wait for node to appear and become ready on the cluster
- name: Wait for node to be ready
  kubernetes.core.k8s_info:
    kind: Node
    name: "{{ ansible_facts['hostname'] }}"
    kubeconfig: "{{ k8s_kubeconfig }}"
  delegate_to: "{{ groups['k3s_server'][0] }}"
  register: node_info
  until: >-
    node_info.resources | length > 0 and
    (node_info.resources[0].status.conditions |
     selectattr('type', 'equalto', 'Ready') |
     map(attribute='status') |
     first) == 'True'
  retries: "{{ k3s_agentReadyzRetries }}"
  delay: "{{ k3s_agentReadyzDelay }}"
  when: not ansible_check_mode

# Apply node labels if specified
- name: Apply node labels
  kubernetes.core.k8s:
    kind: Node
    name: "{{ ansible_facts['hostname'] }}"
    kubeconfig: "{{ k8s_kubeconfig }}"
    definition:
      metadata:
        labels: "{{ dict(k3s_agentNodeLabels | map('split', '=') | map('list')) }}"
  delegate_to: "{{ groups['k3s_server'][0] }}"
  when:
    - k3s_agentNodeLabels | length > 0
    - not ansible_check_mode

# Apply node taints if specified
- name: Apply node taints
  kubernetes.core.k8s_taint:
    name: "{{ ansible_facts['hostname'] }}"
    kubeconfig: "{{ k8s_kubeconfig }}"
    taints:
      - key: "{{ item.split(':')[0].split('=')[0] }}"
        value: "{{ item.split(':')[0].split('=')[1] | default(omit) }}"
        effect: "{{ item.split(':')[1] }}"
    state: present
  delegate_to: "{{ groups['k3s_server'][0] }}"
  loop: "{{ k3s_agentNodeTaints }}"
  when:
    - k3s_agentNodeTaints | length > 0
    - not ansible_check_mode

# Display success message
- name: Show agent join status
  ansible.builtin.debug:
    msg: "✅ K3s agent {{ ansible_facts['hostname'] }} joined cluster at {{ k3s_agentServerUrl }}"
