# @docsible Validates IP_tailscale follows CGNAT range (100.x.x.x)
- name: Validate Tailscale IP
  ansible.builtin.assert:
    that:
      - IP_tailscale is defined
      - IP_tailscale | length > 0
      - IP_tailscale is match('^100\.')
    fail_msg: "ERROR: Invalid IP_tailscale ({{ IP_tailscale | default('undefined') }}). Must be 100.x.x.x"

# @docsible Validates presence of K3s URL and Token
- name: Verify K3s agent requirements
  ansible.builtin.assert:
    that:
      - k3s_agentServerUrl is defined
      - k3s_agentServerUrl | length > 0
      - k3s_agentToken is defined
      - k3s_agentToken | length > 0
    fail_msg: "ERROR: k3s_agentServerUrl and k3s_agentToken are required"

# @docsible Detects containerd runtimes (runsc/nvidia) shared across server and agent
- name: Run k3s runtime discovery role
  ansible.builtin.import_role:
    name: k3s_runtime_discovery

# @docsible Imports K3s Common role (binaries, systemd)
- name: Run K3s Common
  ansible.builtin.import_role:
    name: k3s_common
  vars:
    k3s_recreate: "{{ k3s_agentRecreate }}"
    k3s_commonRestartHandler: "Restart k3s-agent"

# @docsible Deploys K3s Agent config (config.yaml)
- name: Deploy agent config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s-agent
  when: not ansible_check_mode

# @docsible Installs K3s agent with configured flags
- name: Install K3s agent
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION="{{ k3s_agentVersion }}" \
      INSTALL_K3S_EXEC="agent" \
      K3S_URL="{{ k3s_agentServerUrl }}" \
      K3S_TOKEN="{{ k3s_agentToken }}" \
      sh -
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s
  no_log: true
  when: not ansible_check_mode

# @docsible Creates systemd override directory
- name: Create override dir
  ansible.builtin.file:
    path: /etc/systemd/system/k3s-agent.service.d
    state: directory
    mode: "0750"

# @docsible Deploys systemd ExecStart override
- name: Create override
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s-agent.service.d/override.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/local/bin/k3s agent
    mode: "0640"
  notify: Restart k3s-agent

# @docsible Reloads systemd daemon
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# @docsible Starts k3s-agent.service
- name: Start K3s agent
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
  when: not ansible_check_mode

# @docsible Flushes handlers
- name: Flush handlers
  ansible.builtin.meta: flush_handlers

# @docsible Waits for Node "Ready" status in API
- name: Wait for node to be ready
  kubernetes.core.k8s_info:
    kind: Node
    name: "{{ ansible_facts['hostname'] }}"
    kubeconfig: "{{ kubeconfig }}"
  delegate_to: "{{ groups['k3s_server'][0] }}"
  become: false
  register: node_info
  until: >-
    node_info.resources | length > 0 and
    ((node_info.resources[0].status.conditions | default([])) |
     selectattr('type', 'equalto', 'Ready') |
     map(attribute='status') |
     first | default('')) == 'True'
  retries: "{{ k3s_agentReadyzRetries }}"
  delay: "{{ k3s_agentReadyzDelay }}"
  when: not ansible_check_mode

# @docsible Applies node labels
- name: Apply node labels
  kubernetes.core.k8s:
    kind: Node
    name: "{{ ansible_facts['hostname'] }}"
    kubeconfig: "{{ kubeconfig }}"
    definition:
      metadata:
        labels: "{{ dict(k3s_agentNodeLabels | map('split', '=') | map('list')) }}"
  delegate_to: "{{ groups['k3s_server'][0] }}"
  become: false
  when:
    - k3s_agentNodeLabels | length > 0
    - not ansible_check_mode

# @docsible Applies node taints
- name: Apply node taints
  kubernetes.core.k8s_taint:
    name: "{{ ansible_facts['hostname'] }}"
    kubeconfig: "{{ kubeconfig }}"
    taints:
      - key: "{{ item.split(':')[0].split('=')[0] }}"
        value: "{{ item.split(':')[0].split('=')[1] | default(omit) }}"
        effect: "{{ item.split(':')[1] }}"
    state: present
  delegate_to: "{{ groups['k3s_server'][0] }}"
  become: false
  loop: "{{ k3s_agentNodeTaints }}"
  when:
    - k3s_agentNodeTaints | length > 0
    - not ansible_check_mode

# @docsible Displays K3s agent join status
- name: Show agent join status
  ansible.builtin.debug:
    msg: "✅ K3s agent {{ ansible_facts['hostname'] }} joined cluster at {{ k3s_agentServerUrl }}"
